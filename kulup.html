<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside Kulüp Paneli</title>
<meta name="theme-color" content="#14212B">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brass: #C79A54; --brass-dim: #8A7350; --clay: #C06B57; --grass: #6FA37F;
    --on1: #4F8F63; --on2: #2C6743; --ball: #CFE21B; --ball-ink: #1E2A0A;
    --radius: 14px;
  }
  :root:not([data-theme="light"]) {
    --bg: #14212B; --panel: #1C2C38; --panel-2: #253A48; --text: #F4F1E8; --dim: #AEBAC2; --line: #34495A;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EFEAE0; --panel: #FFFFFF; --panel-2: #F6F2E8; --text: #1C2A33; --dim: #5C6A72; --line: #DAD2C0;
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] { --bg: #14212B; --panel: #1C2C38; --panel-2: #253A48; --text: #F4F1E8; --dim: #AEBAC2; --line: #34495A; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }

  /* Üst çubuk */
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .top svg { width: 40px; height: 40px; flex: none; }
  .brand { flex: 1; min-width: 0; }
  .brand b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 700; line-height: 1.1; }
  .brand span { font-size: 12.5px; color: var(--dim); }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who .nm { font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .ghost:hover { border-color: var(--brass); }

  /* Formlar */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .auth { max-width: 420px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; margin: 0 0 4px; line-height: 1.2; }
  h2 { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; margin: 0; }
  .lede { color: var(--dim); font-size: 14.5px; line-height: 1.55; margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--dim); }
  input, select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font-size: 15px; color: var(--text); font-family: inherit; min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .primary { background: var(--brass); color: #1B140A; border: none; border-radius: 11px; padding: 12px 18px; font-size: 15px; font-weight: 600; }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }
  .link { background: none; border: none; color: var(--brass); font-size: 14px; padding: 6px 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > input { flex: 1; }
  .msg { font-size: 13.5px; min-height: 18px; color: var(--grass); }
  .msg.err { color: var(--clay); }
  .note { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin: 0; }

  /* Kulüp başlığı */
  .clubhead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .clubhead .t { flex: 1; min-width: 220px; }
  .eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin-bottom: 4px; }
  .codebox { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px dashed var(--brass-dim); border-radius: 12px; padding: 9px 10px 9px 14px; }
  .codebox .k { font-size: 11.5px; color: var(--dim); }
  .codebox .v { font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 700; letter-spacing: .06em; color: var(--brass); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .monthnav { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .monthnav button { width: 36px; height: 34px; border: none; background: none; color: var(--text); font-size: 20px; border-radius: 8px; }
  .monthnav button:hover { background: var(--panel-2); }
  .monthnav span { min-width: 140px; text-align: center; font-weight: 600; text-transform: capitalize; }
  .toolbar select { padding: 9px 12px; font-size: 14px; }
  .toolbar .grow { flex: 1; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .n { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--dim); margin-top: 2px; }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* Antrenör ve grup */
  .coachhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--brass); color: #1B140A; font-weight: 700; font-size: 14px; }
  .coachhead .t { flex: 1; min-width: 0; }
  .coachhead .t b { display: block; font-size: 16px; }
  .coachhead .t span { font-size: 12.5px; color: var(--dim); }
  .coach { margin-top: 12px; }
  .coachtog { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--text); }
  .coachtog:hover { border-color: var(--brass-dim); }
  .coach.open .coachtog { border-color: var(--brass-dim); }
  .coachtog .t { flex: 1; min-width: 0; }
  .coachtog .t b { display: block; font-size: 16px; }
  .coachtog .t span { font-size: 12.5px; color: var(--dim); }
  .nums { display: flex; gap: 18px; flex: none; }
  .nums div { text-align: right; line-height: 1.15; }
  .nums b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-variant-numeric: tabular-nums; }
  .nums span { font-size: 11px; color: var(--dim); }
  .chev { flex: none; width: 9px; height: 9px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(45deg) translate(-2px, -2px); transition: transform .18s ease; margin: 0 4px; }
  .open > .coachtog .chev, .open > .grouptog .chev { transform: rotate(-135deg) translate(-2px, -2px); border-color: var(--brass); }
  .coachbody { padding: 10px 0 4px 16px; border-left: 2px solid var(--line); margin: 8px 0 6px 19px; }
  .grouptog { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: none; padding: 13px 16px; color: var(--text); }
  .grouptog:hover h3 { color: var(--brass); }
  .grouptog .gt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .group.open .grouptog { border-bottom: 1px solid var(--line); }
  .group.open .grouptog h3 { color: var(--brass); }
  .ratebar { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--panel-2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .ratebar i { display: block; height: 100%; background: var(--on1); }
  .hint { font-size: 12.5px; color: var(--dim); margin: 0 0 4px; }
  @media (max-width: 640px) {
    .nums { gap: 12px; } .nums .hide-s { display: none; }
    .coachbody { margin-left: 4px; padding-left: 10px; }
  }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .grouphead { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 10px; flex-wrap: wrap; }
  .grouphead h3 { font-family: 'Fraunces', Georgia, serif; font-size: 17px; font-weight: 600; margin: 0; }
  .grouphead .time { font-size: 12.5px; color: var(--dim); }
  .grouphead .sess { margin-left: auto; font-size: 13px; color: var(--dim); }
  .grouphead .sess b { font-family: 'Fraunces', Georgia, serif; font-size: 18px; color: var(--text); margin-right: 3px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 16px; font-size: 14px; text-align: right; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--dim); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  td.zero { color: var(--dim); }
  .bar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--panel-2); vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--on1); }
  details { border-top: 1px solid var(--line); }
  summary { padding: 11px 16px; font-size: 13.5px; color: var(--brass); cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .gridwrap { overflow-x: auto; padding: 0 0 12px; -webkit-overflow-scrolling: touch; }
  .dgrid { border-collapse: separate; border-spacing: 3px; padding: 0 12px; }
  .dgrid th, .dgrid td { border: none; padding: 0; font-size: 11px; text-align: center; }
  .dgrid th { color: var(--dim); font-weight: 600; min-width: 26px; line-height: 1.25; padding-bottom: 3px; }
  .dgrid td.nm, .dgrid th.nm { text-align: left; font-size: 13px; padding-right: 10px; white-space: nowrap; position: sticky; left: 0; background: var(--panel); z-index: 1; }
  .dgrid th.nm { font-size: 12px; }
  .cell { width: 26px; height: 24px; border-radius: 6px; background: var(--panel-2); display: grid; place-items: center; font-weight: 700; color: #fff; }
  .cell.c1 { background: var(--on1); }
  .cell.c2 { background: var(--on2); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--dim); padding: 0 16px 12px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--panel-2); }
  .sw.c1 { background: var(--on1); } .sw.c2 { background: var(--on2); }
  .empty { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; color: var(--dim); font-size: 14px; line-height: 1.55; }
  .warn { color: var(--clay); }

  /* Sahip bölümü */
  .owner { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
  .clubrow { display: grid; grid-template-columns: minmax(0, 1.4fr) auto auto auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .clubrow:first-of-type { border-top: none; }
  .clubrow .code { font-family: 'Fraunces', Georgia, serif; font-weight: 700; letter-spacing: .04em; color: var(--brass); }
  .clubrow .k { display: block; font-size: 11px; color: var(--dim); font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0; font-weight: 500; }
  @media (max-width: 640px) { .clubrow { grid-template-columns: 1fr 1fr; } .clubrow > :first-child { grid-column: 1 / -1; } }
  .uid { font-size: 11.5px; color: var(--dim); margin-top: 40px; text-align: center; overflow-wrap: anywhere; }
  .loading { color: var(--dim); padding: 30px 0; text-align: center; }
  /* Öğrenci takvimi (açılır pencere) */
  .kidbtn { background: none; border: none; color: inherit; font: inherit; padding: 0; text-align: left; cursor: pointer; border-bottom: 1px dashed transparent; }
  .kidbtn:hover, .kidbtn:focus-visible { color: var(--brass); border-bottom-color: var(--brass-dim); outline: none; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 19, .66); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .kidhead { display: flex; align-items: center; gap: 12px; }
  .kidhead .av { width: 48px; height: 48px; font-size: 17px; }
  .kidhead .t { flex: 1; min-width: 0; }
  .kidhead h2 { overflow-wrap: anywhere; }
  .kidhead .sub { font-size: 12.5px; color: var(--dim); }
  .xbtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--text); font-size: 18px; line-height: 1; }
  .sheet .monthnav { align-self: stretch; justify-content: space-between; }
  .kstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kstats .tile { padding: 10px 12px; }
  .kstats .n { font-size: 22px; }
  .kcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .kcal .wd { text-align: center; font-size: 11px; color: var(--dim); text-transform: uppercase; padding: 2px 0; }
  .kcell { position: relative; aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; background: var(--panel-2); color: var(--dim); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kcell.c1 { background: var(--on1); color: #fff; }
  .kcell.c2 { background: var(--on2); color: #fff; }
  .kcell.blank { background: none; }
  .kcell.today { box-shadow: inset 0 0 0 2px var(--brass); }
  .kcell .x2 { position: absolute; top: -5px; right: -4px; font-size: 9.5px; font-weight: 700; padding: 1px 4px; border-radius: 7px; background: var(--ball); color: var(--ball-ink); }
  .kdates { border: 1px solid var(--line); border-radius: 12px; }
  .kdates div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .kdates div:first-child { border-top: none; }
  .kdates span:last-child { color: var(--dim); white-space: nowrap; }
  .sheet .legend { padding: 0; }
  /* Öğrenci arama */
  .search { position: relative; flex: 1 1 220px; min-width: 180px; max-width: 320px; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; font-size: 14px; }
  .search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 14px; pointer-events: none; }
  .sres { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 30px -12px rgba(0,0,0,.4); padding: 4px; max-height: 340px; overflow-y: auto; min-width: 260px; }
  .sres[hidden] { display: none; }
  .sres button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: none; border-radius: 9px; padding: 9px 10px; color: var(--text); }
  .sres button:hover, .sres button.first { background: var(--panel-2); }
  .sres .av { width: 30px; height: 30px; font-size: 11.5px; }
  .sres .tx { flex: 1; min-width: 0; }
  .sres .tx b { display: block; font-size: 14px; font-weight: 600; }
  .sres .tx span { font-size: 12px; color: var(--dim); }
  .sres .n { flex: none; font-size: 12px; color: var(--dim); text-align: right; }
  .sres .none { padding: 12px; font-size: 13px; color: var(--dim); }
  @media (max-width: 640px) { .search { max-width: none; flex-basis: 100%; } }
  /* Veliye rapor */
  .share { display: flex; gap: 8px; flex-wrap: wrap; }
  .share a, .share button { flex: 1 1 120px; text-align: center; text-decoration: none; border-radius: 11px; padding: 11px 12px; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .share a.wa { background: #25D366; border-color: #25D366; color: #fff; }
  /* Kulüp yönetimi */
  .manage { margin-top: 30px; }
  .manage .coachtog .t b { font-family: 'Fraunces', Georgia, serif; font-size: 17px; }
  .mbody { background: var(--panel); border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 6px 16px 16px; margin-top: -6px; }
  .manage.open .coachtog { border-radius: var(--radius) var(--radius) 0 0; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: none; }
  .mrow .av { width: 32px; height: 32px; font-size: 12px; }
  .mrow .tx { flex: 1; min-width: 0; }
  .mrow .tx b { display: block; font-size: 14.5px; overflow-wrap: anywhere; }
  .mrow .tx span { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .danger { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; flex: none; }
  .danger:hover { border-color: var(--clay); color: var(--clay); }
  .danger.armed { border-color: var(--clay); color: var(--clay); font-weight: 600; }
  .msec { margin-top: 18px; }
  .msec:first-child { margin-top: 10px; }
  .switcher { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .switcher button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; }
  .switcher button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); font-weight: 600; }
</style>
</head>

  // ---------- Giriş (Firebase Auth REST) ----------
  function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { return null; } }
  function saveAuth(a) { try { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); } catch (e) {} }
  function authCall(method, body) {
    return fetch(FB.authBase + "/v1/accounts:" + method + "?key=" + FB.apiKey, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }
  function storeAuth(j, email, name) {
    var a = { uid: j.localId, idToken: j.idToken, refreshToken: j.refreshToken,
      exp: Date.now() + Number(j.expiresIn || 3600) * 1000, email: email || j.email || "", name: name || j.displayName || "" };
    saveAuth(a); return a;
  }
  function getToken() {
    var a = loadAuth();
    if (!a || !a.refreshToken) return Promise.reject(new Error("NO_AUTH"));
    if (a.idToken && a.exp - Date.now() > 5 * 60 * 1000) return Promise.resolve(a);
    return fetch(FB.tokenBase + "/v1/token?key=" + FB.apiKey, {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(a.refreshToken)
    }).then(function (r) { if (!r.ok) throw new Error("REFRESH"); return r.json(); })
      .then(function (j) {
        a.idToken = j.id_token; a.refreshToken = j.refresh_token; a.uid = j.user_id;
        a.exp = Date.now() + Number(j.expires_in || 3600) * 1000;
        saveAuth(a); return a;
      });
  }
  function db(method, path, body) {
    return getToken().then(function (a) {
      return fetch(FB.db + "/" + path + ".json?auth=" + encodeURIComponent(a.idToken), {
        method: method, headers: { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body)
      }).then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error("DENIED");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    });
  }
  function authErr(err) {
    var m = String((err && err.message) || "");
    if (m.indexOf("EMAIL_EXISTS") !== -1) return "Bu e-postayla zaten bir hesap var. Giriş yap.";
    if (/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return "E-posta adresi geçersiz.";
    if (/WEAK_PASSWORD|MISSING_PASSWORD/.test(m)) return "Şifre en az 6 karakter olmalı.";
    if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND|USER_DISABLED/.test(m)) return "E-posta ya da şifre hatalı.";
    if (m.indexOf("TOO_MANY_ATTEMPTS") !== -1) return "Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.";
    if (m === "DENIED") return "Bu işlem için yetkin yok.";
    return "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.";
  }

  // ---------- Durum ----------
  var S = {
    view: "login",          // login | signup | main
    msg: "", err: false, busy: false,
    loading: false,
    isOwner: false, ownerClubs: null,
    myClubs: [],            // [{id, name}]
    clubId: null, club: null,        // seçili kulüp ve verisi
    coaches: [],            // [{uid, name, email, joinedAt, data:{groups, att}|null, syncedAt, error}]
    month: ymd(new Date()).slice(0, 7),
    fCoach: "", fGroup: "",
    joinOpen: false,
    kid: null,             // açık öğrenci takvimi: {uid, gid, name}
    openCoaches: {},       // açık antrenörler
    openGroups: {},        // açık gruplar: "uid|gid"
    manageOpen: false, arm: null, mMsg: "", mErr: false, q: ""
  };

  // ---------- Yükleme ----------
  function loadMain() {
    var a = loadAuth();
    S.loading = true; render();
    var ownerP = db("GET", "owners/" + a.uid).then(function (v) { return v === true; }, function () { return false; });
    var mineP = db("GET", "userClubs/" + a.uid).then(function (v) {
      return Object.keys(v || {}).map(function (id) { return { id: id, name: (v[id] && v[id].name) || id }; })
        .sort(function (x, y) { return x.name.localeCompare(y.name, "tr"); });
    }, function () { return []; });
    return Promise.all([ownerP, mineP]).then(function (r) {
      S.isOwner = r[0]; S.myClubs = r[1];
      var keep = S.myClubs.some(function (c) { return c.id === S.clubId; });
      if (!keep) S.clubId = S.myClubs.length ? S.myClubs[0].id : null;
      var clubP = S.clubId ? loadClub(S.clubId).catch(function (e) {
        // Yöneticilikten çıkarılmışsa bu kulüp listeden düşer.
        if (String(e && e.message) !== "DENIED") throw e;
        var gone = S.clubId;
        S.myClubs = S.myClubs.filter(function (c) { return c.id !== gone; });
        S.clubId = S.myClubs.length ? S.myClubs[0].id : null; S.club = null; S.coaches = [];
        return db("DELETE", "userClubs/" + a.uid + "/" + gone).catch(function () {}).then(function () { return S.clubId ? loadClub(S.clubId) : null; });
      }) : null;
      return Promise.all([S.isOwner ? loadOwnerClubs() : null, clubP]);
    }).then(function () { S.loading = false; render(); }, function (err) {
      S.loading = false; S.err = true; S.msg = authErr(err); render();
    });
  }
  function loadOwnerClubs() {
    return db("GET", "clubs").then(function (v) {
      S.ownerClubs = Object.keys(v || {}).map(function (id) {
        var c = v[id] || {};
        return { id: id, name: c.name || id, coachCode: c.coachCode || "", adminCode: c.adminCode || "",
          members: Object.keys(c.members || {}).length, admins: Object.keys(c.admins || {}).length, createdAt: c.createdAt || 0 };
      }).sort(function (x, y) { return x.name.localeCompare(y.name, "tr"); });
    }, function () { S.ownerClubs = []; });
  }
  function loadClub(id) {
    return db("GET", "clubs/" + id).then(function (c) {
      S.club = c || {};
      var members = S.club.members || {};
      var uids = Object.keys(members);
      return Promise.all(uids.map(function (uid) {
        var m = members[uid] || {};
        var co = { uid: uid, name: m.name || "", email: m.email || "", joinedAt: m.t || 0, data: null, syncedAt: 0, error: false };
        return db("GET", "users/" + uid + "/data/" + YK_KEY).then(function (rec) {
          if (rec && typeof rec.v === "string") {
            try {
              var d = JSON.parse(rec.v) || {};
              co.data = { groups: Array.isArray(d.groups) ? d.groups : [], att: d.att && typeof d.att === "object" ? d.att : {} };
            } catch (e) { co.data = null; }
            co.syncedAt = rec.t || 0;
          }
          return co;
        }, function () { co.error = true; return co; });
      }));
    }).then(function (coaches) {
      S.coaches = coaches.sort(function (x, y) { return coachName(x).localeCompare(coachName(y), "tr"); });
      if (S.fCoach && !S.coaches.some(function (c) { return c.uid === S.fCoach; })) { S.fCoach = ""; S.fGroup = ""; }
    });
  }
  function coachName(c) { return c.name || c.email || "Antrenör"; }

  // ---------- Hesaplar ----------
  function groupKids(g) { return (Array.isArray(g.kids) ? g.kids : []).slice().sort(function (x, y) { return String(x).localeCompare(String(y), "tr"); }); }
  function groupMonth(co, g, ym) {
    var a = (co.data.att || {})[g.id] || {}, kids = groupKids(g);
    var days = Object.keys(a).filter(function (d) { return d.slice(0, 7) === ym; }).sort();
    var sessions = 0, activeDays = [];
    days.forEach(function (d) {
      var m = a[d] || {}, mx = 0;
      Object.keys(m).forEach(function (n) { if (m[n] > mx) mx = m[n]; });
      mx = Math.min(2, mx);
      if (mx) { sessions += mx; activeDays.push(d); }
    });
    var rows = kids.map(function (n) {
      var dcount = 0, s = 0;
      activeDays.forEach(function (d) { var v = (a[d] || {})[n]; v = v === 2 ? 2 : (v === 1 ? 1 : 0); if (v) { dcount++; s += v; } });
      return { name: n, days: dcount, sessions: s, rate: sessions ? Math.round(s / sessions * 100) : null };
    });
    return { sessions: sessions, activeDays: activeDays, rows: rows, att: a };
  }
  function visibleCoaches() { return S.coaches.filter(function (c) { return !S.fCoach || c.uid === S.fCoach; }); }
  function visibleGroups(co) {
    if (!co.data) return [];
    return co.data.groups.filter(function (g) { return g && g.id && (!S.fGroup || String(g.id) === S.fGroup); });
  }
  function shiftMonth(n) { var d = dayFromStr(S.month + "-01"); d.setMonth(d.getMonth() + n); S.month = ymd(d).slice(0, 7); }

  // ---------- CSV ----------
  function csvCell(v) { var s = String(v === null || v === undefined ? "" : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function downloadCsv(name, rows) {
    var text = "﻿" + rows.map(function (r) { return r.map(csvCell).join(";"); }).join("\r\n");
    var url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function fileSlug() {
    var n = (S.club && S.club.name) || "kulup";
    return n.toLocaleLowerCase("tr").replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "kulup";
  }
  function exportSummary() {
    var rows = [["Antrenör", "Grup", "Gün ve saat", "Öğrenci", "Geldiği gün", "Antrenman", "Grubun antrenmanı", "Devam oranı (%)"]];
    visibleCoaches().forEach(function (co) {
      visibleGroups(co).forEach(function (g) {
        var gm = groupMonth(co, g, S.month);
        gm.rows.forEach(function (r) { rows.push([coachName(co), g.name, g.time || "", r.name, r.days, r.sessions, gm.sessions, r.rate === null ? "" : r.rate]); });
      });
    });
    downloadCsv("courtside-" + fileSlug() + "-yoklama-ozet-" + S.month + ".csv", rows);
  }
  function exportDaily() {
    var rows = [["Antrenör", "Grup", "Öğrenci", "Tarih", "Antrenman"]];
    visibleCoaches().forEach(function (co) {
      visibleGroups(co).forEach(function (g) {
        var gm = groupMonth(co, g, S.month);
        gm.activeDays.forEach(function (d) {
          groupKids(g).forEach(function (n) {
            var v = (gm.att[d] || {})[n];
            if (v) rows.push([coachName(co), g.name, n, d, v === 2 ? 2 : 1]);
          });
        });
      });
    });
    downloadCsv("courtside-" + fileSlug() + "-yoklama-gunluk-" + S.month + ".csv", rows);
  }

  function coachSummary(co) {
    if (!co.data) return null;

    return o;
  }
  function groupRate(gm) {
    if (!gm.sessions || !gm.rows.length) return null;
    var got = gm.rows.reduce(function (s, r) { return s + r.sessions; }, 0);
    return Math.round(got / (gm.sessions * gm.rows.length) * 100);
  }
  function renderGroup(co, g) {
    var gm = groupMonth(co, g, S.month), key = co.uid + "|" + g.id;
    var open = !!S.openGroups[key] || (S.fGroup && String(g.id) === S.fGroup);
    var rate = groupRate(gm);
    var html = '<div class="group' + (open ? ' open' : '') + '"><button class="grouptog" type="button" data-grouptog="' + esc(key) + '" aria-expanded="' + !!open + '">' +
      '<span class="gt"><h3>' + esc(g.name) + '</h3>' + (g.time ? '<span class="time">' + esc(g.time) + '</span>' : '') + '</span>' +
      '<span class="nums"><div class="hide-s"><b>' + gm.rows.length + '</b><span>öğrenci</span></div><div><b>' + gm.sessions + '</b><span>antrenman</span></div>' +
        '<div><b>' + (rate === null ? '—' : '%' + rate) + '</b><span>ort. devam</span></div></span>' +
      '<span class="chev" aria-hidden="true"></span></button>';
    if (!open) return html + '</div>';

  // ---------- Öğrenci arama ----------
  function fold(v) {
    return String(v || "").toLocaleLowerCase("tr").replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/â/g, "a").replace(/î/g, "i").replace(/û/g, "u");
  }
  function searchKids(q) {
    var fq = fold(q.trim()), out = [];
    if (!fq) return out;
    S.coaches.forEach(function (co) {
      if (!co.data) return;
      co.data.groups.forEach(function (g) {
        if (!g || !g.id) return;
        var gm = null;
        groupKids(g).forEach(function (n) {
          var f = fold(n), at = f.indexOf(fq);
          if (at === -1) return;
          gm = gm || groupMonth(co, g, S.month);
          var r = gm.rows.filter(function (x) { return x.name === n; })[0] || { sessions: 0 };
          out.push({ co: co, g: g, name: n, sessions: r.sessions, starts: at === 0 || f.indexOf(" " + fq) !== -1 });
        });
      });
    });
    out.sort(function (x, y) { return (y.starts - x.starts) || x.name.localeCompare(y.name, "tr"); });
    return out.slice(0, 12);
  }
  function showSearch() {
    var inp = $("kidSearch"), box = $("sres");
    if (!inp || !box) return;
    S.q = inp.value;
    if (!S.q.trim()) { box.hidden = true; box.innerHTML = ""; return; }
    var items = searchKids(S.q);
    box.innerHTML = items.length ? items.map(function (it, i) {
      return '<button type="button" class="' + (i === 0 ? 'first' : '') + '" data-sk-uid="' + esc(it.co.uid) + '" data-sk-gid="' + esc(it.g.id) + '" data-sk-name="' + esc(it.name) + '">' +
        '<span class="av">' + esc(initials(it.name)) + '</span><span class="tx"><b>' + esc(it.name) + '</b><span>' + esc(it.g.name + " · " + coachName(it.co)) + '</span></span>' +
        '<span class="n">' + it.sessions + ' antrenman<br>' + esc(monthName(S.month).split(" ")[0]) + '</span></button>';
    }).join("") : '<div class="none">"' + esc(S.q.trim()) + '" adında öğrenci bulunamadı.</div>';

    var bs = box.querySelectorAll("[data-sk-name]");

  }

  // ---------- Olaylar ----------
  function setMsg(m, err) { S.msg = m; S.err = !!err; var e = $("msg"); if (e) { e.textContent = m; e.className = "msg" + (err ? " err" : ""); } }
  function afterAuth() { S.view = "main"; S.msg = ""; S.busy = false; loadMain(); }
  function bind() {
    var el, i, list;
    if ((el = $("toSignup"))) el.onclick = function () { S.view = "signup"; S.msg = ""; render(); };
    if ((el = $("toLogin"))) el.onclick = function () { S.view = "login"; S.msg = ""; render(); };
    var login = function () {
      var email = val("email").trim(), pass = val("pass");
      if (!email || !pass) { setMsg("E-posta ve şifreyi yaz.", true); return; }
      S.busy = true; render(); $("email").value = email;
      authCall("signInWithPassword", { email: email, password: pass, returnSecureToken: true })
        .then(function (j) { storeAuth(j, email, j.displayName); afterAuth(); }, function (e) { S.busy = false; render(); $("email").value = email; setMsg(authErr(e), true); });
    };
    var signup = function () {
      var name = val("name").replace(/\s+/g, " ").trim(), email = val("email").trim(), pass = val("pass");
      if (!name) { setMsg("Adını ve soyadını yaz.", true); return; }
      if (!email || !pass) { setMsg("E-posta ve şifreyi yaz.", true); return; }
      S.busy = true; render(); $("name").value = name; $("email").value = email;
      authCall("signUp", { email: email, password: pass, displayName: name, returnSecureToken: true })
        .then(function (j) { storeAuth(j, email, name); afterAuth(); }, function (e) { S.busy = false; render(); $("name").value = name; $("email").value = email; setMsg(authErr(e), true); });
    };
    if ((el = $("doLogin"))) el.onclick = login;
    if ((el = $("doSignup"))) el.onclick = signup;
    if ((el = $("pass"))) el.onkeydown = function (e) { if (e.key === "Enter") (S.view === "signup" ? signup : login)(); };
    if ((el = $("forgot"))) el.onclick = function () {
      var email = val("email").trim();
      if (!email) { setMsg("Önce e-posta adresini yaz.", true); return; }
      authCall("sendOobCode", { requestType: "PASSWORD_RESET", email: email })
        .then(function () { setMsg("Şifre yenileme bağlantısı e-postana gönderildi."); }, function (e) { setMsg(authErr(e), true); });
    };

    // Yönetici kodu ile kulübe bağlan
    var join = function (codeRaw) {
      var code = normCode(codeRaw);
      if (code.length < 4) { setMsg("Yönetici kodunu yaz.", true); return; }
      var a = loadAuth();
      S.busy = true; render();
      db("GET", "adminCodes/" + code).then(function (c) {
        if (!c || !c.club) throw new Error("NOT_FOUND");
        return db("PUT", "clubs/" + c.club + "/admins/" + a.uid, { code: code, name: a.name || "", email: a.email || "", t: { ".sv": "timestamp" } })
          .catch(function (e) { if (String(e.message) !== "DENIED") throw e; }) // zaten yöneticiyse kural yeniden yazmaya izin vermez
          .then(function () { return db("PUT", "userClubs/" + a.uid + "/" + c.club, { name: c.name || "" }); })
          .then(function () { S.clubId = c.club; });
      }).then(function () {
        S.busy = false; S.joinOpen = false; S.msg = ""; loadMain();
      }, function (e) {
        S.busy = false; render();
        setMsg(String(e.message) === "NOT_FOUND" ? "Bu kod bulunamadı. Kodu tekrar kontrol et." : authErr(e), true);
      });
    };
    if ((el = $("doJoin"))) el.onclick = function () { join(val("adminCode")); };
    if ((el = $("adminCode"))) el.onkeydown = function (e) { if (e.key === "Enter") join(this.value); };
    if ((el = $("openJoin"))) el.onclick = function () { S.joinOpen = true; S.msg = ""; render(); var c = $("adminCode"); if (c) c.focus(); };
    list = app.querySelectorAll("[data-selfjoin]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () { join(this.getAttribute("data-selfjoin")); };

    // Kulüp paneli
    list = app.querySelectorAll("[data-club]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () {
      S.clubId = this.getAttribute("data-club"); S.fCoach = ""; S.fGroup = "";
      S.loading = true; render();
      loadClub(S.clubId).then(function () { S.loading = false; render(); window.scrollTo(0, 0); }, function (e) { S.loading = false; S.msg = authErr(e); S.err = true; render(); });
    };
    var keepY = function (fn) { var y = window.scrollY; fn(); render(); try { window.scrollTo(0, y); } catch (e) {} };
    list = app.querySelectorAll("[data-coachtog]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () {
      var id = this.getAttribute("data-coachtog");
      if (visibleCoaches().length === 1) return;
      keepY(function () { S.openCoaches[id] = !S.openCoaches[id]; });
    };
    list = app.querySelectorAll("[data-grouptog]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () {
      var k = this.getAttribute("data-grouptog"), gid = k.split("|").slice(1).join("|");
      keepY(function () {
        if (S.fGroup && S.fGroup === gid) { S.fGroup = ""; S.openGroups[k] = false; return; }
        S.openGroups[k] = !S.openGroups[k];
      });
    };
    list = app.querySelectorAll("[data-kname]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () {
      S.kid = { uid: this.getAttribute("data-kuid"), gid: this.getAttribute("data-kgid"), name: this.getAttribute("data-kname") };
      S.kidY = window.scrollY; render(); try { window.scrollTo(0, S.kidY); } catch (e) {}
      var x = $("kidClose"); if (x) x.focus();
    };
    var closeKid = function () { var y = window.scrollY; S.kid = null; render(); try { window.scrollTo(0, y); } catch (e) {} };
    if ((el = $("kidClose"))) el.onclick = closeKid;
    if ((el = $("kidModal"))) el.onclick = function (e) { if (e.target === this) closeKid(); };
    var keepKidScroll = function (n) { var y = window.scrollY; shiftMonth(n); render(); try { window.scrollTo(0, y); } catch (e) {} };
    if ((el = $("kPrev"))) el.onclick = function () { keepKidScroll(-1); };
    if ((el = $("kNext"))) el.onclick = function () { keepKidScroll(1); };
    if ((el = $("kCopy"))) el.onclick = function () {
      var ctx = findKidCtx(); if (!ctx) return;
      var b = this, t = kidReportText(ctx.co, ctx.g, S.kid.name);
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { b.textContent = "Kopyalandı ✓"; }, function () { $("kMsg").textContent = "Kopyalanamadı."; });
    };
    if ((el = $("kPdf"))) el.onclick = function () {
      var ctx = findKidCtx(); if (!ctx) return;
      var w = null; try { w = window.open("", "_blank"); } catch (e) { w = null; }
      if (!w) { var m = $("kMsg"); m.className = "msg err"; m.textContent = "Yeni sekme engellendi; tarayıcıda açılır pencerelere izin ver."; return; }
      w.document.open(); w.document.write(kidReportHtml(ctx.co, ctx.g, S.kid.name)); w.document.close();
    };
    if ((el = $("kidSearch"))) {
      el.oninput = showSearch;
      el.onfocus = showSearch;
      el.onblur = function () { setTimeout(function () { var b = $("sres"); if (b) b.hidden = true; }, 150); };
      el.onkeydown = function (e) {
        if (e.key === "Enter") { var f = document.querySelector("#sres [data-sk-name]"); if (f) f.onclick({ preventDefault: function () {} }); }
        else if (e.key === "Escape") { this.value = ""; showSearch(); this.blur(); }
      };
    }
    if ((el = $("manageTog"))) el.onclick = function () { var y = window.scrollY; S.manageOpen = !S.manageOpen; S.arm = null; S.mMsg = ""; render(); try { window.scrollTo(0, y); } catch (e) {} };
    list = app.querySelectorAll("[data-copy]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () { copy(this.getAttribute("data-copy"), this); };
    var mDone = function (msg, err) {
      S.arm = null; S.mMsg = msg; S.mErr = !!err;
      var y = window.scrollY;
      loadClub(S.clubId).then(function () { render(); try { window.scrollTo(0, y); } catch (e) {} }, function () { loadMain(); });
    };
    list = app.querySelectorAll("[data-rm-member]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () {
      var uid = this.getAttribute("data-rm-member");
      if (S.arm !== "m:" + uid) { var y = window.scrollY; S.arm = "m:" + uid; render(); try { window.scrollTo(0, y); } catch (e) {} return; }
      this.disabled = true;
      db("DELETE", "clubs/" + S.clubId + "/members/" + uid).then(function () { mDone("Antrenör kulüpten çıkarıldı."); },
        function (e) { mDone(String(e.message) === "DENIED" ? "Yetki yok. Firebase kurallarının güncel olduğundan emin ol." : authErr(e), true); });
    };
    list = app.querySelectorAll("[data-rm-admin]");
    for (i = 0; i < list.length; i++) list[i].onclick = function () {
      var uid = this.getAttribute("data-rm-admin"), me = loadAuth().uid;
      if (S.arm !== "a:" + uid) { var y = window.scrollY; S.arm = "a:" + uid; render(); try { window.scrollTo(0, y); } catch (e) {} return; }
      this.disabled = true;
      var club = S.clubId;
      db("DELETE", "clubs/" + club + "/admins/" + uid).then(function () {
        if (uid !== me) { mDone("Yönetici çıkarıldı."); return; }
        return db("DELETE", "userClubs/" + me + "/" + club).catch(function () {}).then(function () {
          S.clubId = null; S.club = null; S.coaches = []; S.manageOpen = false; S.arm = null; loadMain();
        });
      }, function (e) { mDone(authErr(e), true); });
    };
    if ((el = $("copyCoach"))) el.onclick = function () { copy(S.club.coachCode, this); };
    if ((el = $("copyUid"))) el.onclick = function () { copy($("uidTxt").textContent, this); };
    if ((el = $("mPrev"))) el.onclick = function () { shiftMonth(-1); render(); };
    if ((el = $("mNext"))) el.onclick = function () { shiftMonth(1); render(); };
    if ((el = $("fCoach"))) el.onchange = function () { S.fCoach = this.value; S.fGroup = ""; render(); };
    if ((el = $("fGroup"))) el.onchange = function () { S.fGroup = this.value; render(); };
    if ((el = $("csvSum"))) el.onclick = exportSummary;
    if ((el = $("csvDay"))) el.onclick = exportDaily;
    if ((el = $("reload"))) el.onclick = function () { loadMain(); };

    // Sahip: kulüp oluştur
    if ((el = $("createClub"))) el.onclick = function () {
      var name = val("newClub").replace(/\s+/g, " ").trim().slice(0, 60);
      if (!name) { S.ownerMsg = "Kulübe bir ad ver."; S.err = true; render(); return; }
      var id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var coachCode = genCode(), adminCode = genCode();
      S.busy = true; render();
      db("PUT", "clubs/" + id, { name: name, coachCode: coachCode, adminCode: adminCode, createdAt: { ".sv": "timestamp" } })
        .then(function () { return db("PUT", "clubCodes/" + coachCode, { club: id, name: name }); })
        .then(function () { return db("PUT", "adminCodes/" + adminCode, { club: id, name: name }); })
        .then(function () { return loadOwnerClubs(); })
        .then(function () { S.busy = false; S.err = false; S.ownerMsg = name + " oluşturuldu. Yönetici kodu: " + adminCode; render(); },
              function (e) { S.busy = false; S.err = true; S.ownerMsg = authErr(e); render(); });
    };
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.kid) { var y = window.scrollY; S.kid = null; render(); try { window.scrollTo(0, y); } catch (er) {} }
  });

  // ---------- Açılış ----------
  if (loadAuth()) { S.view = "main"; loadMain(); } else render();
})();
</script>
</body>
</html>
