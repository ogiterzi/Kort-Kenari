<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside Kullanım</title>
<meta name="theme-color" content="#14212B">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brass: #C79A54; --clay: #C06B57; --radius: 14px;
  }
  :root:not([data-theme="light"]) {
    --bg: #14212B; --panel: #1C2C38; --panel-2: #253A48; --text: #F4F1E8; --dim: #AEBAC2; --mute: #7F8E98; --line: #34495A; --grid: #2B3E4C;
    --c-ret: #3FA56A; --c-new: #6E8FE0; --heat: 63,165,106;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #EFEAE0; --panel: #FFFFFF; --panel-2: #F6F2E8; --text: #1C2A33; --dim: #5C6A72; --mute: #85919A; --line: #DAD2C0; --grid: #ECE6DA;
      --c-ret: #23824D; --c-new: #4A6FD0; --heat: 35,130,77;
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] { --bg: #14212B; --panel: #1C2C38; --panel-2: #253A48; --text: #F4F1E8; --dim: #AEBAC2; --mute: #7F8E98; --line: #34495A; --grid: #2B3E4C; --c-ret: #3FA56A; --c-new: #6E8FE0; --heat: 63,165,106; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 56px; }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }

  .top { display: flex; align-items: center; gap: 12px; padding: 18px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .top svg { width: 40px; height: 40px; flex: none; }
  .brand { flex: 1; min-width: 0; }
  .brand b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 700; line-height: 1.1; }
  .brand span { font-size: 12.5px; color: var(--dim); }
  .ghost { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .ghost:hover { border-color: var(--brass); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .auth { max-width: 420px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; margin: 0 0 4px; line-height: 1.2; }
  h2 { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; margin: 0 0 4px; }
  .lede { color: var(--dim); font-size: 14.5px; line-height: 1.55; margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--dim); }
  input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font-size: 15px; color: var(--text); font-family: inherit; min-width: 0; }
  input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .primary { background: var(--brass); color: #1B140A; border: none; border-radius: 11px; padding: 12px 18px; font-size: 15px; font-weight: 600; }
  .msg { font-size: 13.5px; min-height: 18px; color: var(--clay); line-height: 1.5; }
  .note { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin: 0; }

  .head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .head .t { flex: 1; min-width: 220px; }
  .eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin-bottom: 4px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); cursor: pointer; user-select: none; }
  .switch input { width: 16px; height: 16px; accent-color: var(--brass); padding: 0; }

  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .n { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .l { font-size: 12.5px; color: var(--text); margin-top: 4px; font-weight: 500; }
  .tile .s { font-size: 11.5px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
  @media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles .tile:first-child { grid-column: span 2; } }

  section { margin-bottom: 26px; }
  .sub { font-size: 13px; color: var(--dim); margin: 0 0 12px; line-height: 1.5; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: var(--mute); font-size: 11px; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .base { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .hl, .chart .col:hover .hl { opacity: 1; }
  .hl { fill: var(--text); opacity: 0; pointer-events: none; }
  .tip { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 18px rgba(0,0,0,.18); white-space: nowrap; z-index: 5; display: none; }
  .tip b { font-weight: 600; }
  .tip .k { color: var(--dim); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  details.tbl { margin-top: 8px; }
  details.tbl summary { font-size: 12.5px; color: var(--dim); cursor: pointer; }
  details.tbl table { margin-top: 8px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .feat { display: grid; grid-template-columns: 120px 1fr 120px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
  .feat .bar { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .feat .bar i { display: block; height: 100%; background: var(--c-ret); border-radius: 0 5px 5px 0; }
  .feat .v { text-align: right; color: var(--dim); font-size: 12.5px; }
  .feat .v b { color: var(--text); font-weight: 600; }
  @media (max-width: 560px) { .feat { grid-template-columns: 92px 1fr 88px; } }

  .coh td.c { text-align: center; min-width: 46px; border: 2px solid var(--panel); border-radius: 6px; }
  .coh td.na { color: transparent; }

  .urow td { vertical-align: middle; }
  .uname { min-width: 150px; }
  .uname b { white-space: nowrap; }
  .gt td:last-child { white-space: nowrap; }
  .uname b { font-weight: 600; }
  .uname > span { display: block; font-size: 11.5px; color: var(--dim); }
  .strip { display: flex; gap: 2px; }
  .strip i { width: 6px; height: 14px; border-radius: 2px; background: var(--panel-2); }
  .strip i.on { background: var(--c-ret); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  tr.urow { cursor: pointer; }
  tr.urow:hover td, tr.urow.open td { background: var(--panel-2); }
  tr.urow:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
  .chev { display: inline-block; width: 7px; height: 7px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(-45deg); margin: 0 9px 2px 1px; transition: transform .15s ease; }
  tr.open .chev { transform: rotate(45deg); border-color: var(--brass); }
  tr.drow > td { padding: 4px 0 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .det { position: sticky; left: 0; width: min(1000px, calc(100vw - 66px)); display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; padding: 0 10px; }
  .db { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .db h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  .sts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
  .st b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.15; }
  .st span { font-size: 11.5px; color: var(--dim); line-height: 1.3; display: block; }
  .dl { font-size: 11.5px; color: var(--dim); margin: 12px 0 6px; }
  .wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd div { text-align: center; }
  .wd i { display: flex; align-items: center; justify-content: center; height: 24px; border-radius: 6px; font-style: normal; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); }
  .wd span { font-size: 10.5px; color: var(--dim); }
  .gt { font-size: 12.5px; }
  .gt th { font-size: 11px; padding: 4px 6px; white-space: normal; }
  .gt td { padding: 5px 6px; }
  .gt .k, .det .k { color: var(--dim); font-size: 11px; }
  .empty { color: var(--dim); font-size: 14px; padding: 20px 0; }
  .spin { color: var(--dim); padding: 40px 0; text-align: center; }
  .foot { font-size: 12px; color: var(--dim); line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg viewBox="0 0 512 512" aria-hidden="true"><defs><clipPath id="lc"><circle cx="256" cy="256" r="172"/></clipPath></defs><circle cx="256" cy="256" r="188.5" fill="none" stroke="#C79A54" stroke-width="12"/><circle cx="256" cy="256" r="172" fill="#CFE21B"/><g clip-path="url(#lc)" fill="none" stroke="#F7FBDC" stroke-width="20"><circle cx="43.4" cy="256" r="151.6"/><circle cx="468.6" cy="256" r="151.6"/></g></svg>
    <div class="brand"><b>Courtside</b><span>Kullanım istatistikleri</span></div>
    <div id="topRight"></div>
  </div>
  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";
  // Aynı Firebase projesi ve aynı giriş anahtarı: Kulüp Paneli'ne giriş yaptıysan burada da açık gelir.
  var FB = {
    apiKey: "AIzaSyCMSpN9EKOQxbkpdsodfLDAslNg9NNW-X8",
    db: "https://courtside-62f8e-default-rtdb.europe-west1.firebasedatabase.app",
    authBase: "https://identitytoolkit.googleapis.com",
    tokenBase: "https://securetoken.googleapis.com"
  };
  var AUTH_KEY = "courtside-club-auth-v1";
  var KEYS = {
    match: "courtside-match-v1", archive: "courtside-archive-v1", players: "courtside-players-v1",
    tourn: "courtside-tournaments-v1", att: "courtside-attendance-v1", lessons: "courtside-lessons-v1"
  };
  var FEATS = [
    { k: "mac", label: "Maç takibi", unit: "maç" },
    { k: "yok", label: "Yoklama", unit: "yoklama" },
    { k: "ders", label: "Özel ders", unit: "ders" },
    { k: "turnuva", label: "Turnuva", unit: "turnuva" },
    { k: "canli", label: "Canlı yayın", unit: "yayın" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseDay(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(s, n) { var d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); }
  function dayOf(ms) { ms = +ms; if (!ms || ms < 1.5e12 || ms > 4e12) return null; return ymd(new Date(ms)); }
  function validDay(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
  function weekStart(s) { var d = parseDay(s); var w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); }
  function short(s) { return parseDay(s).toLocaleDateString("tr-TR", { day: "numeric", month: "short" }).replace(".", ""); }
  function longDay(s) { return parseDay(s).toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "short" }); }
  function pj(rec) { if (!rec || typeof rec.v !== "string") return null; try { return JSON.parse(rec.v); } catch (e) { return null; } }

  // ---------- Giriş ----------
  function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { return null; } }
  function saveAuth(a) { try { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); } catch (e) {} }
  function authCall(method, body) {
    return fetch(FB.authBase + "/v1/accounts:" + method + "?key=" + FB.apiKey, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }
  function getToken() {
    var a = loadAuth();
    if (!a || !a.refreshToken) return Promise.reject(new Error("NO_AUTH"));
    if (a.idToken && a.exp - Date.now() > 5 * 60 * 1000) return Promise.resolve(a);
    return fetch(FB.tokenBase + "/v1/token?key=" + FB.apiKey, {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(a.refreshToken)
    }).then(function (r) { if (!r.ok) throw new Error("REFRESH"); return r.json(); })
      .then(function (j) {
        a.idToken = j.id_token; a.refreshToken = j.refresh_token; a.uid = j.user_id;
        a.exp = Date.now() + Number(j.expires_in || 3600) * 1000;
        saveAuth(a); return a;
      });
  }
  function db(path) {
    return getToken().then(function (a) {
      return fetch(FB.db + "/" + path + ".json?auth=" + encodeURIComponent(a.idToken)).then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error("DENIED");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    });
  }
  function authErr(err) {
    var m = String((err && err.message) || "");
    if (/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return "E-posta adresi geçersiz.";
    if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND|USER_DISABLED|MISSING_PASSWORD/.test(m)) return "E-posta ya da şifre hatalı.";
    if (m.indexOf("TOO_MANY_ATTEMPTS") !== -1) return "Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.";
    return "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.";
  }

  // ---------- Durum ----------
  var S = { view: "login", msg: "", busy: false, loading: false, users: null, live: null, me: null, excludeMe: true, loadedAt: 0, open: {} };
  try { S.excludeMe = localStorage.getItem("courtside-stats-me") !== "0"; } catch (e) {}

  function loadAll() {
    var a = loadAuth();
    S.view = "main"; S.loading = true; S.msg = ""; S.me = a.uid; render();
    db("owners/" + a.uid).then(function (v) {
      if (v !== true) throw new Error("NOT_OWNER");
      return Promise.all([db("users"), db("live").catch(function () { return null; })]);
    }).then(function (r) {
      S.users = r[0] || {}; S.live = r[1] || {}; S.loadedAt = Date.now(); S.loading = false; render();
    }).catch(function (e) {
      var m = String((e && e.message) || "");
      S.loading = false; S.users = null;
      if (m === "NOT_OWNER") S.msg = "Bu sayfa yalnızca Courtside sahibinin hesabına açık.";
      else if (m === "DENIED") S.msg = "Firebase kullanıcı verisini okumana izin vermedi. Realtime Database kurallarına sahip okuma izni eklenmemiş olabilir (scripts/firebase-kurallari.json).";
      else if (m === "NO_AUTH" || m === "REFRESH") { S.view = "login"; S.msg = "Oturumun sona ermiş, tekrar giriş yap."; }
      else S.msg = "Veriler yüklenemedi. İnternetini kontrol edip yenile.";
      render();
    });
  }

  // ---------- Analiz ----------
  // Bir kullanıcı o gün en az bir kayıt yaptıysa (maç, yoklama, özel ders, turnuva, canlı yayın) o gün "aktif" sayılır.
  function analyze() {
    var today = ymd(new Date());
    var users = [], liveByOwner = {}, anonLive = 0, anonLiveRecent = 0;
    Object.keys(S.live || {}).forEach(function (code) {
      var l = S.live[code]; if (!l || !l.owner) return;
      (liveByOwner[l.owner] = liveByOwner[l.owner] || []).push(dayOf(l.t));
    });
    Object.keys(S.users || {}).forEach(function (uid) {
      if (S.excludeMe && uid === S.me) return;
      var u = S.users[uid] || {}, data = u.data || {};
      var ev = {}, cnt = { mac: 0, yok: 0, ders: 0, turnuva: 0, canli: 0 }, extra = { grup: 0, ogr: 0, oyuncu: 0 };
      // Ayrıntı: isim yok, sadece sayılar.
      var det = { groups: [], mac: { done: 0, left: 0, last: null }, ders: { total: 0, d7: 0, d30: 0, stu30: 0, wd: [0, 0, 0, 0, 0, 0, 0], days: 0 }, turnuva: { n: 0, matches: 0 } };
      function add(day, kind) {
        if (!day || day > today) return;
        var e = ev[day] || (ev[day] = { mac: 0, yok: 0, ders: 0, turnuva: 0, canli: 0 });
        e[kind]++; cnt[kind]++;
      }
      var arch = pj(data[KEYS.archive]); var seen = {};
      if (Array.isArray(arch)) arch.forEach(function (r) {
        if (!r) return; var st = r.startedAt || +r.archiveId, d = dayOf(st); seen[st] = 1; add(d, "mac");
        if (r.abandoned) det.mac.left++; else det.mac.done++;
        if (d && (!det.mac.last || d > det.mac.last)) det.mac.last = d;
      });
      var cur = pj(data[KEYS.match]);
      if (cur && !cur.setup && Array.isArray(cur.log) && cur.log.length) {
        var st = cur.startedAt || (cur.log[cur.log.length - 1] || {}).t;
        if (st && !seen[st]) { add(dayOf(st), "mac"); det.mac.left++; }
      }
      var att = pj(data[KEYS.att]);
      if (att) {
        extra.grup = Array.isArray(att.groups) ? att.groups.length : 0;
        var gl = Array.isArray(att.groups) ? att.groups.slice() : [];
        Object.keys(att.att || {}).forEach(function (gid) { if (!gl.some(function (g) { return g && String(g.id) === gid; })) gl.push({ id: gid, kids: [], gone: true }); });
        gl.forEach(function (gr, gi) {
          if (!gr) return;
          var g = (att.att || {})[gr.id] || {}, gd = { kids: Array.isArray(gr.kids) ? gr.kids.length : 0, time: gr.gone ? "" : String(gr.time || ""), gone: !!gr.gone, days: 0, present: 0, last: null, d30: 0, wd: [0, 0, 0, 0, 0, 0, 0] };
          Object.keys(g).forEach(function (day) {
            if (!validDay(day) || day > today) return;
            var n = Object.keys(g[day] || {}).filter(function (k) { return (g[day][k] || 0) > 0; }).length;
            if (!n) return;
            add(day, "yok"); gd.days++; gd.present += n; gd.wd[(parseDay(day).getDay() + 6) % 7]++;
            if (day >= shift(today, -29)) gd.d30++;
            if (!gd.last || day > gd.last) gd.last = day;
          });
          det.groups.push(gd);
        });
      }
      var ls = pj(data[KEYS.lessons]);
      if (ls) {
        extra.ogr = Array.isArray(ls.students) ? ls.students.length : 0;
        var ldays = {}, stu = {};
        (ls.lessons || []).forEach(function (l) {
          if (!l || !validDay(l.d) || l.d > today) return;
          add(l.d, "ders"); det.ders.total++; ldays[l.d] = 1; det.ders.wd[(parseDay(l.d).getDay() + 6) % 7]++;
          if (l.d >= shift(today, -6)) det.ders.d7++;
          if (l.d >= shift(today, -29)) { det.ders.d30++; stu[l.s || l.n] = 1; }
        });
        det.ders.days = Object.keys(ldays).length; det.ders.stu30 = Object.keys(stu).length;
      }
      var tr = pj(data[KEYS.tourn]);
      if (Array.isArray(tr)) tr.forEach(function (x) { if (!x) return; add(dayOf(x.createdAt || x.id), "turnuva"); det.turnuva.n++; det.turnuva.matches += Array.isArray(x.matches) ? x.matches.length : 0; });
      var pl = pj(data[KEYS.players]); if (Array.isArray(pl)) extra.oyuncu = pl.length;

    }
    if (u.extra.oyuncu) boxes.push('<div class="db"><h4>Oyuncular</h4><div class="sts">' + stat(u.extra.oyuncu, "kayıtlı oyuncu") + "</div></div>");
    if (!u.days.length && !u.extra.ogr && !u.extra.oyuncu && !d.groups.length) boxes.push('<div class="db"><h4>Henüz bir şey yok</h4><p class="dl">Hesap açılmış ama grup, öğrenci, maç gibi hiçbir kayıt yapılmamış.</p></div>');
    return '<tr class="drow"><td colspan="5"><div class="det">' + boxes.join("") + "</div></td></tr>";
  }

  function footNote() {
    return '<p class="foot">Sadece Courtside\'a <b>hesapla giriş yapmış</b> kullanıcılar görünür; giriş yapmadan kullananların verisi telefonlarında kalır ve buraya gelmez. ' +
      "\"Aktif\" = o gün en az bir kayıt yapmış olmak (uygulamayı sadece açıp bakmak sayılmaz). Kişisel isimler gösterilmez; kullanıcılar kulüp adı ve hesap kimliğinin ilk 5 karakteriyle listelenir.</p>";
  }

  function renderLogin() {
    return '<div class="auth"><div><h1>Kullanım istatistikleri</h1><p class="lede">Kulüp Paneli\'ndeki sahip hesabınla giriş yap.</p></div>' +
      '<div class="card" style="display:flex;flex-direction:column;gap:12px">' +
      '<div class="field"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email"></div>' +
      '<div class="field"><label for="pass">Şifre</label><input id="pass" type="password" autocomplete="current-password"></div>' +
      '<p class="msg">' + esc(S.msg) + "</p>" +
      '<button class="primary" id="login"' + (S.busy ? " disabled" : "") + ">" + (S.busy ? "Giriş yapılıyor…" : "Giriş yap") + "</button></div></div>";
  }

  function render() {
    $("app").innerHTML = S.view === "login" ? renderLogin() : renderMain();
    $("topRight").innerHTML = S.view === "main" ? '<button class="ghost" id="logout">Çıkış</button>' : "";
    var el;
    if ((el = $("login"))) el.onclick = login;
    if ((el = $("pass"))) el.onkeydown = function (e) { if (e.key === "Enter") login(); };
    if ((el = $("logout"))) el.onclick = function () { try { localStorage.removeItem(AUTH_KEY); } catch (e) {} S.view = "login"; S.users = null; S.msg = ""; render(); };
    if ((el = $("refresh"))) el.onclick = loadAll;
    if ((el = $("retry"))) el.onclick = loadAll;
    Array.prototype.forEach.call(document.querySelectorAll("tr.urow"), function (tr) {
      var tog = function () { var id = tr.getAttribute("data-uid"); S.open[id] = !S.open[id]; var y = window.scrollY; render(); window.scrollTo(0, y); };
      tr.onclick = tog;
      tr.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } };
    });
    if ((el = $("excl"))) el.onchange = function () { S.excludeMe = this.checked; try { localStorage.setItem("courtside-stats-me", S.excludeMe ? "1" : "0"); } catch (e) {} render(); };
    if (S.view === "main" && S.users && !S.loading) {
      var mm = analyze();
      bindTips("cw", mm.weekly, function (r) {
        return "<b>" + short(r.ws) + " – " + short(r.we) + "</b>" + (r.partial ? ' <span class="k">(sürüyor)</span>' : "") +
          '<br><span class="k">Geri dönen</span> ' + r.ret + '<br><span class="k">Yeni</span> ' + r.nw + '<br><span class="k">Toplam</span> <b>' + r.n + "</b>";
      });
      bindTips("cd", mm.daily, function (r) {
        var parts = FEATS.filter(function (f) { return r[f.k]; }).map(function (f) { return '<br><span class="k">' + f.label + "</span> " + r[f.k] + " kişi"; }).join("");
        return "<b>" + longDay(r.d) + "</b><br>" + r.n + " aktif kullanıcı" + parts;
      });
    }
  }

  function login() {
    var email = ($("email").value || "").trim(), pass = $("pass").value || "";
    S.busy = true; S.msg = ""; render();
    authCall("signInWithPassword", { email: email, password: pass, returnSecureToken: true }).then(function (j) {
      saveAuth({ uid: j.localId, idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + Number(j.expiresIn || 3600) * 1000, email: email, name: j.displayName || "" });
      S.busy = false; loadAll();
    }, function (e) { S.busy = false; S.msg = authErr(e); render(); $("email").value = email; });
  }

  var rsT = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(rsT); rsT = setTimeout(function () { if (Math.abs(window.innerWidth - lastW) > 40 && S.view === "main" && S.users) { lastW = window.innerWidth; render(); } }, 200);
  });
  var a = loadAuth();
  if (a && a.refreshToken) loadAll(); else render();
})();
</script>
</body>
</html>
