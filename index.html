  // İstatistik sekmesindeki katlanır bölümler — varsayılan kapalı, sayfa kısa kalsın.
  var openSections = { momentum: false, shotmap: false, moments: false };

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  function markJustLogged() {
    var last = state.log[0];
    if (!last) return;
    if (state.matchOver) { pulseFlag = "match"; vibrate([25, 60, 25, 60, 60]); }
    else if (last.setWonBy) { pulseFlag = "set"; vibrate([20, 50, 40]); }
    else if (last.gameWonBy) { pulseFlag = "game"; vibrate(30); }
    else { pulseFlag = "point"; vibrate(12); }
  }

  var OUTCOME_KEY = { ace: "oAce", double_fault: "oDouble", winner: "oWinner", forced_error: "oForced", unforced_error: "oUnforced" };
  function outcomeLabel(o) { return OUTCOME_KEY[o] ? t(OUTCOME_KEY[o]) : ""; }
  var OUTCOME_POLARITY = {
    ace: "pos",
    winner: "pos",
    double_fault: "neg",
    forced_error: "neg",
    unforced_error: "neg"
  };
  var SHOT_TYPE_OUTCOMES = ["winner", "forced_error", "unforced_error"];
  // Bölge yalnızca oyuncunun yer seçtiği vuruşlarda anlamlı.
  var ZONE_ASK_OUTCOMES = ["winner", "forced_error", "unforced_error"];

  // Akış "önce ne oldu, sonra kim yaptı" olduğu için seçenekler artık
  // kazanana değil yalnızca servise ve ralliye bağlı.
  function outcomeOptions(m, secondServe, rally) {
    // 2+ vuruşluk ralli varsa ace ya da çift hata olamaz — o seçenekler kalkar.
    var rallyExcludes = (rally || 0) >= 2;
    var opts = [];
    if (!rallyExcludes) opts.push("ace");
    opts.push("winner");
    opts.push("forced_error");
    opts.push("unforced_error");
    // Çift hata sadece ikinci servis de kaçırılınca olur.
    if (secondServe && !rallyExcludes) opts.push("double_fault");
    return opts;
  }

  // Vuruşu yapan belli olduğunda puanı kimin aldığı buradan çıkar.
  function winnerFromActor(actorKey, outcome) {
    return (outcome === "winner" || outcome === "ace") ? actorKey : otherKey(actorKey);
  }
  // Ace ve çift hatayı her zaman servis atan yapar; "kim yaptı" sorulmaz.
  var SERVER_ONLY_OUTCOMES = ["ace", "double_fault"];
  function resolvedActor(m, outcome) {
    return SERVER_ONLY_OUTCOMES.indexOf(outcome) !== -1 ? m.server : pendingActor;
  }

  // ---------- Rendering ----------
  var app = document.getElementById("app");

  function render() {
    if (archiveOpen) { app.innerHTML = renderArchiveScreen() + renderShareOverlays(); bindEvents(); bindShareEvents(); return; }
    if (state.setup) {
      renderSetup();
      var overlays = renderShareOverlays();
      if (overlays) app.insertAdjacentHTML("beforeend", overlays);
      bindShareEvents();
      return;
    }
    var m = state;
    var html = "";
    if (viewingArchived) html += renderArchivedBar(m);
    html += renderHeader(m);
    html += renderTabs();
    html += "<main>";
    if (m.matchOver) html += renderMatchOverBanner(m);
    if (activeTab === "live") html += renderLiveTab(m);
    if (activeTab === "log") html += renderLogTab(m);
    if (activeTab === "stats") html += renderStatsTab(m);
    html += "</main>";
    // Servis sorusu her şeyin önünde: cevaplanmadan puan girilmemeli.
    if (m.needsServer) html += renderServerModal(m);
    else if (zonePrompt) html += renderZoneModal(m);
    html += renderShareOverlays();
    app.innerHTML = html;
    bindEvents();
    bindShareEvents();
    if (activeTab === "stats") initMomentumChartInteraction(m);
  }

  // Maç kurulduktan sonra skor ekranında sorulan servis seçimi.
  function renderServerModal(m) {
    return (
      '<div class="zone-modal" id="serverModal">' +
        '<div class="zone-card">' +
          '<p class="actor-q" style="margin-top:6px;">' + t("whoServesFirst") + '</p>' +
          '<div class="zone-sub" style="text-align:center;margin-top:-6px;">' + t("tossHint") + '</div>' +
          '<div class="winner-pick actor-pick" style="margin-top:14px;margin-bottom:0;">' +
            ["a", "b"].map(function (k) {
              return '<button data-firstserver="' + k + '" type="button">' +
                '<span class="who">' + escapeHtml(m.names[k]) + '</span></button>';
            }).join("") +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // Puanın bittiği yeri kort üzerinde işaretleten modal.
  function renderZoneModal(m) {
    var p = zonePrompt;
    var actor = pointActor(p.winner, p.outcome);
    var actorName = shortName(m, actor);
    var title;
    if (p.outcome === "winner") title = t("zqWinner", { name: actorName });
    else if (p.outcome === "forced_error") title = t("zqForced", { name: actorName });
    else if (p.outcome === "unforced_error") title = t("zqUnforced", { name: actorName });
    else title = t("zqGeneric");

    var readout = zonePick
      ? '<b>' + t("zoneN", { z: zonePick.zone }) + '</b> · ' + escapeHtml(ZONE_NAME[zonePick.zone])
      : t("tapSpot");

    return (
      '<div class="zone-modal" id="zoneModal">' +
        '<div class="zone-card">' +
          '<div class="zone-title">' + escapeHtml(title) + '</div>' +
          '<div class="zone-sub">' + escapeHtml(t("zoneSub", { name: actorName })) + '</div>' +
          '<div class="zone-courtwrap">' +
            halfCourtSVG(m, actor, { interactive: true, pick: zonePick }) +
          '</div>' +
          '<div class="zone-readout">' + readout + '</div>' +
          '<div class="zone-actions">' +
            '<button id="zoneSkip" type="button">' + t("saveNoZone") + '</button>' +
            '<button id="zoneSave" class="primary" type="button"' + (zonePick ? "" : " disabled") + '>' + t("save") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // Bekleyen puanı (varsa seçilen bölgeyle) gerçekten kaydeder.
  function commitPendingPoint(loc) {
    var p = zonePrompt;
    if (!p) return;
    zonePrompt = null; zonePick = null;
    logPoint(state, p.winner, p.outcome, null, p.rally, p.secondServe, p.shotType, null, loc || null);
    markJustLogged();
    clearPending();
    saveState();
    if (state.matchOver && !viewingArchived) archiveMatch(state);
    render();
  }

  function renderArchivedBar(m) {
    return '<div class="archived-bar">' +
      '<button id="backToArchive" type="button">' + t("backArchive") + '</button>' +
      '<span>' + escapeHtml(t("viewingArchived", { date: fmtDateTR(m.archiveId || m.startedAt) })) + '</span>' +
      '</div>';
  }

  // ---------- Arşiv ekranı ----------
  function renderArchiveScreen() {
    var arr = loadArchive();
    var tabsHtml = '<nav class="tabs">' +
      '<button data-arctab="matches" class="' + (archiveTab === "matches" ? "active" : "") + '">' + t("tabMatches") + (arr.length ? " (" + arr.length + ")" : "") + '</button>' +
      '<button data-arctab="players" class="' + (archiveTab === "players" ? "active" : "") + '">' + t("tabPlayers") + '</button>' +
      '</nav>';
    var body;
    if (!arr.length) {
      body = '<div class="empty-state">' + t("archiveEmpty") + '</div>';
    } else if (archiveTab === "matches") {
      body = arr.map(function (r) {
        var winTxt = r.matchOver
          ? '🏆 ' + escapeHtml(r.names[r.winner] || "—")
          : '<span class="arc-unfinished">' + t("unfinished") + '</span>';
        var dur = matchDuration(r);
        var meta = [fmtDateTR(r.archiveId || r.startedAt)];
        if (formatLabel(r)) meta.push(formatLabel(r));
        meta.push(t("nPoints", { n: r.log.length }));
        if (dur !== null) meta.push(fmtDuration(dur));
        if (r.imported) meta.push(t("fromShare"));
        return '<div class="arc-item">' +
          '<div class="arc-main">' +
            '<div class="arc-names">' + escapeHtml(r.names.a || "A") + ' <span class="arc-vs">vs</span> ' + escapeHtml(r.names.b || "B") + '</div>' +
            '<div class="arc-score scorefont">' + escapeHtml(setsScoreText(r)) + '</div>' +
            '<div class="arc-meta">' + winTxt + ' · ' + escapeHtml(meta.join(" · ")) + '</div>' +
          '</div>' +
          '<div class="arc-actions">' +
            '<button data-arcopen="' + r.archiveId + '" type="button">' + t("open") + '</button>' +
            '<button data-arcdel="' + r.archiveId + '" class="arc-del" type="button">' + t("del") + '</button>' +
          '</div>' +
        '</div>';
      }).join("");
    } else {
      var totals = computePlayerTotals(arr);
      var h2h = computeHeadToHead(arr);
      var h2hHtml = h2h.length
        ? '<p class="section-label" style="margin-top:22px;">' + t("h2hTitle") + '</p>' +
          h2h.map(function (p) {
            var lead = p.w1 === p.w2 ? t("tied") : t("ahead", { name: escapeHtml(p.w1 > p.w2 ? p.p1 : p.p2) });
            return '<div class="h2h-row"><span class="h2h-names">' + escapeHtml(p.p1) + ' — ' + escapeHtml(p.p2) + '</span>' +
              '<span class="h2h-score scorefont">' + p.w1 + '–' + p.w2 + '</span>' +
              '<span class="h2h-lead">' + lead + '</span></div>';
          }).join("")
        : "";
      body = '<p class="section-label">' + t("playerTotals") + '</p>' +
        '<div class="arc-table-wrap"><table class="stat-table arc-table">' +
        '<thead><tr><th>' + t("thPlayer") + '</th><th>' + t("thMatches") + '</th><th>' + t("thWL") + '</th><th>' + t("thSets") + '</th><th>' + t("thAce") + '</th><th>' + t("thWin") + '</th><th>' + t("thErr") + '</th></tr></thead><tbody>' +
        totals.map(function (p) {
          return '<tr><td>' + escapeHtml(p.name) + '</td>' +
            '<td class="num">' + p.matches + '</td>' +
            '<td class="num">' + p.wins + '–' + p.losses + '</td>' +
            '<td class="num">' + p.setsWon + '–' + p.setsLost + '</td>' +
            '<td class="num">' + p.aces + '</td>' +
            '<td class="num">' + p.winners + '</td>' +
            '<td class="num">' + p.unforcedErrors + '</td></tr>';
        }).join("") +
        '</tbody></table></div>' + h2hHtml;
    }
    return '<div class="archived-bar"><button id="archiveBack" type="button">' + t("back") + '</button><span>' + t("matchArchive") + '</span>' +
      '<button class="bar-end" data-import="1" type="button">' + t("importBtn") + '</button></div>' +
      tabsHtml + '<main>' + body + '</main>';
  }

  function renderSetup() {
    var knownNames = archivePlayerNames();
    var nameListAttr = knownNames.length ? ' list="knownPlayers" autocomplete="off"' : "";
    var knownNamesHtml = knownNames.length
      ? '<datalist id="knownPlayers">' + knownNames.map(function (n) {
          return '<option value="' + escapeAttr(n) + '"></option>';
        }).join("") + '</datalist>'
      : "";
    var archiveCount = loadArchive().length;
    app.innerHTML =
      '<div class="setup">' +
        langSwitchHtml() +
        '<div>' +
          '<h1>🎾 Courtside</h1>' +
          '<p class="lede">' + t("lede") + '</p>' +
        '</div>' +
        knownNamesHtml +
        '<div class="field"><label>' + t("playerA") + '</label><input id="nameA" type="text" placeholder="' + escapeAttr(t("phA")) + '" maxlength="24"' + nameListAttr + '></div>' +
        '<div class="field"><label>' + t("playerB") + '</label><input id="nameB" type="text" placeholder="' + escapeAttr(t("phB")) + '" maxlength="24"' + nameListAttr + '></div>' +
        '<div class="field">' +
          '<label>' + t("matchFormat") + '</label>' +
          '<div class="server-pick">' +
            '<button id="fmtStandard" aria-pressed="true" type="button">' + t("fmtStandard") + '</button>' +
            '<button id="fmtFast4" aria-pressed="false" type="button">Fast4</button>' +
            '<button id="fmtProSet" aria-pressed="false" type="button">Pro Set</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>' + t("deuceRule") + '</label>' +
          '<div class="server-pick">' +
            '<button id="ruleAd" aria-pressed="true" type="button">' + t("ruleAd") + '</button>' +
            '<button id="ruleNoAd" aria-pressed="false" type="button">' + t("ruleNoAd") + '</button>' +
          '</div>' +
          '<p style="font-size:12.5px;color:var(--text-dim);margin:2px 0 0;line-height:1.5;">' +
            escapeHtml(t("ruleHelp")) +
          '</p>' +
        '</div>' +
        '<div class="field" id="setsField">' +
          '<label>' + t("setsQ") + '</label>' +
          '<div class="server-pick">' +
            '<button id="setsThree" aria-pressed="true" type="button">' + t("sets3") + '</button>' +
            '<button id="setsFive" aria-pressed="false" type="button">' + t("sets5") + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="field" id="finalSetField">' +
          '<label>' + t("finalSetQ") + '</label>' +
          '<div class="server-pick">' +
            '<button id="finalNormal" aria-pressed="true" type="button">' + t("finalNormal") + '</button>' +
            '<button id="finalSuperTB" aria-pressed="false" type="button">' + escapeHtml(t("finalSuperTB")) + '</button>' +
          '</div>' +
        '</div>' +
        '<button class="btn-primary" id="startBtn" type="button">' + t("startMatch") + '</button>' +
        (archiveCount
          ? '<div class="archive-entry"><button id="openArchiveSetup" type="button">' + t("pastMatches", { n: archiveCount }) + '</button></div>'
          : '') +
        '<div class="archive-entry" style="margin-top:8px;"><button data-import="1" type="button">' + t("addShared") + '</button></div>' +
      '</div>';

    var noAdRule = false;
    var setsToPlayVal = 3;
    var finalSetSuperTBVal = false;
    var formatPreset = "standard";
    var FORMAT_OPTS = {
      standard: null,
      fast4: { setGamesTarget: 4, setWinByTwo: false, tbTriggerAt: 3 },
      proset: { setGamesTarget: 8, setWinByTwo: true, tbTriggerAt: 8, forceSingleSet: true }
    };
    var FORMAT_BTN_IDS = { standard: "fmtStandard", fast4: "fmtFast4", proset: "fmtProSet" };
    function selectFormat(id) {
      formatPreset = id;
      Object.keys(FORMAT_BTN_IDS).forEach(function (key) {
        document.getElementById(FORMAT_BTN_IDS[key]).setAttribute("aria-pressed", String(key === id));
      });
      var isProSet = id === "proset";
      document.getElementById("setsField").style.display = isProSet ? "none" : "";
      document.getElementById("finalSetField").style.display = isProSet ? "none" : "";
    }
    document.getElementById("fmtStandard").onclick = function () { selectFormat("standard"); };
    document.getElementById("fmtFast4").onclick = function () { selectFormat("fast4"); };
    document.getElementById("fmtProSet").onclick = function () { selectFormat("proset"); };
    document.getElementById("setsThree").onclick = function () {
      setsToPlayVal = 3;
      document.getElementById("setsThree").setAttribute("aria-pressed", "true");
      document.getElementById("setsFive").setAttribute("aria-pressed", "false");
    };
    document.getElementById("setsFive").onclick = function () {
      setsToPlayVal = 5;
      document.getElementById("setsFive").setAttribute("aria-pressed", "true");
      document.getElementById("setsThree").setAttribute("aria-pressed", "false");
    };
    document.getElementById("finalNormal").onclick = function () {
      finalSetSuperTBVal = false;
      document.getElementById("finalNormal").setAttribute("aria-pressed", "true");
      document.getElementById("finalSuperTB").setAttribute("aria-pressed", "false");
    };
    document.getElementById("finalSuperTB").onclick = function () {
      finalSetSuperTBVal = true;
      document.getElementById("finalSuperTB").setAttribute("aria-pressed", "true");
      document.getElementById("finalNormal").setAttribute("aria-pressed", "false");
    };
    document.getElementById("ruleAd").onclick = function () {
      noAdRule = false;
      document.getElementById("ruleAd").setAttribute("aria-pressed", "true");
      document.getElementById("ruleNoAd").setAttribute("aria-pressed", "false");
    };
    document.getElementById("ruleNoAd").onclick = function () {
      noAdRule = true;
      document.getElementById("ruleNoAd").setAttribute("aria-pressed", "true");
      document.getElementById("ruleAd").setAttribute("aria-pressed", "false");
    };
    var openArcSetup = document.getElementById("openArchiveSetup");
    if (openArcSetup) {
      openArcSetup.onclick = function () { openArchive(); };
    }
    document.getElementById("startBtn").onclick = function () {
      var nA = document.getElementById("nameA").value.trim() || t("playerA");
      var nB = document.getElementById("nameB").value.trim() || t("playerB");
      state = freshMatch({ a: nA, b: nB }, noAdRule, setsToPlayVal, finalSetSuperTBVal, FORMAT_OPTS[formatPreset]);
      state.setup = false;
      // Servisi kimin atacağı skor ekranında pop-up ile sorulur (kura genelde sonra belli olur).
      state.needsServer = true;
      state.startedAt = Date.now();
      saveState();
      render();
    };
  }

  function renderHeader(m) {
    var bp = isBreakPointNow(m);
    var setsRowA = m.sets.map(function (s) { return s.a; }).join(" · ");
    var setsRowB = m.sets.map(function (s) { return s.b; }).join(" · ");
    var momentum = !m.matchOver ? computeMomentum(m) : null;
    var momentumHtml = momentum
      ? '<div class="momentum-strip"><span class="dot" style="background:var(--momentum-' + momentum.key + ')"></span>' +
        '🔥 <b>' + escapeHtml(shortName(m, momentum.key)) + '</b> ' + t("momentumStrip", { n: momentum.streak }) + '</div>'
      : '';
    var pulseClass = pulseFlag ? " pulse-" + pulseFlag : "";
    pulseFlag = null;

    // Oynanan setteki oyun skoru — isimlerin yanında, içe bakan tarafta.
    // Maç bitince ve süper tie-break'te oyun sayılmadığı için gizlenir.
    var showGames = !m.matchOver && !m.superTBFinal;
    var gameCountHtml = function (k) {
      if (!showGames) return "";
      var lead = m.games[k] > m.games[otherKey(k)];
      return '<span class="game-count' + (lead ? " lead" : "") + '">' + m.games[k] + '</span>';
    };
    return (
      '<header class="matchbar"><div class="matchbar-inner">' +
        '<div class="matchbar-top">' +
          '<span class="live-dot"><span class="dot"></span>' + (m.matchOver ? t("matchOver") : t("liveTracking")) + '</span>' +
          '<span>' + (formatLabel(m) ? formatLabel(m) + " · " : "") + (m.noAd ? t("ruleNoAdShort") : t("ruleAdShort")) + ' · ' + t("nSets", { n: m.setsToPlay }) + (m.finalSetSuperTB ? t("finalSTBShort") : "") + ' · ' + t("pointsLogged", { n: m.log.length }) + '</span>' +
        '</div>' +
        '<div class="players-row">' +
          '<div class="player-name">' + (m.server === "a" && !m.matchOver ? '<span class="serve-ball"></span>' : '') +
            '<span class="txt">' + escapeHtml(m.names.a) + '</span>' + gameCountHtml("a") + '</div>' +
          '<span class="vs">vs</span>' +
          '<div class="player-name">' + gameCountHtml("b") +
            '<span class="txt">' + escapeHtml(m.names.b) + '</span>' +
            (m.server === "b" && !m.matchOver ? '<span class="serve-ball"></span>' : '') + '</div>' +
        '</div>' +
        '<div class="scorepanel">' +
          '<div class="sets-mini">' +
            (m.sets.length ? '<span class="set-chip">' + setsRowA + '</span>' : '') +
          '</div>' +
          '<div class="game-score scorefont' + (m.matchOver ? " final" : "") + pulseClass + '">' +
            (m.matchOver ? (m.sets.map(function(s){return s.superTB ? "[" + s.a + "-" + s.b + "]" : s.a + "-" + s.b;}).join("  ")) : scoreLabel(m)) +
          '</div>' +
          '<div class="sets-mini">' +
            (bp ? '<span class="bp-badge">BREAK POINT</span>' : (m.sets.length ? '<span class="set-chip">' + setsRowB + '</span>' : '<span></span>')) +
          '</div>' +
        '</div>' +
        momentumHtml +
      '</div></header>'
    );
  }

  function renderTabs() {
    function tb(id, label) {
      return '<button data-tab="' + id + '" class="' + (activeTab === id ? "active" : "") + '">' + label + '</button>';
    }
    // Arşivden bakarken puan girişi anlamsız — "Canlı" sekmesi gizlenir.
    return '<nav class="tabs">' + (viewingArchived ? "" : tb("live", t("tabLive"))) + tb("log", t("tabLog")) + tb("stats", t("tabStats")) + '</nav>';
  }

  function renderMatchOverBanner(m) {
    return (
      '<div class="match-over-banner">' +
        '<div class="win">🏆 ' + t("wonBy", { name: escapeHtml(m.names[m.winner]) }) + '</div>' +
        '<div class="sub">' + m.sets.map(function (s) { return s.superTB ? "[" + t("superTB") + " " + s.a + "–" + s.b + "]" : (s.a + "–" + s.b + (s.tb ? " (TB " + Math.min(s.tb.a,s.tb.b) + ")" : "")); }).join(" · ") + '</div>' +

        '<button class="pdf-btn" id="pdfBtnBanner" type="button">' + t("pdfBtn") + '</button>' +
        '<div class="pdf-hint">' + escapeHtml(t("pdfHint")) + '</div>' +
      '</div>'
    );

  function renderLiveTab(m) {
    if (m.matchOver) {
      return '<p class="empty-state">' + t("matchDone") + '</p>' + renderResetRow();
    }
    // Hızlı mod: tek soru — puanı kim aldı.
    var winnerPickHtml = ["a", "b"].map(function (k) {
      var role = k === m.server ? t("serving") : t("returning");
      return (
        '<button data-winner="' + k + '" aria-pressed="' + (pendingWinner === k) + '" type="button">' +
          '<span class="who">' + escapeHtml(m.names[k]) + '</span>' +
          '<span class="role">' + role + '</span>' +
        '</button>'
      );
    }).join("");

    // Detaylı mod: önce "ne oldu", sonra "kim yaptı".
    var outcomeHtml = "";
    if (!quickMode) {
      var opts = outcomeOptions(m, pendingSecondServe, pendingRally);
      outcomeHtml = '<p class="section-label">' + t("howEnded") + '</p><div class="outcome-grid">' +
        opts.map(function (o) {
          return '<button class="' + OUTCOME_POLARITY[o] + '" data-outcome="' + o + '" aria-pressed="' + (pendingOutcome === o) + '" type="button">' + outcomeLabel(o) + '</button>';
        }).join("") +
        '</div>';
    }

    var shotTypeHtml = "";
    if (!quickMode && SHOT_TYPE_OUTCOMES.indexOf(pendingOutcome) !== -1) {
      shotTypeHtml =
        '<div class="shot-type-row">' +
          '<span class="lbl">' + t("shot") + '</span>' +
          '<div class="pills">' +
            '<button data-shot="forehand" aria-pressed="' + (pendingShotType === "forehand") + '" type="button">Forehand</button>' +
            '<button data-shot="backhand" aria-pressed="' + (pendingShotType === "backhand") + '" type="button">Backhand</button>' +
          '</div>' +
        '</div>';
    }

    // "Kim yaptı?" — her seçeneğin altında puanın kime gideceği yazılı.
    var ACTOR_Q = {
      winner: t("aqWinner"),
      forced_error: t("aqForced"),
      unforced_error: t("aqUnforced")
    };
    // Ace ve çift hatada soru sorulmuyor: yapan her zaman servis atan.
    var actorHtml = "";
    if (!quickMode && pendingOutcome && SERVER_ONLY_OUTCOMES.indexOf(pendingOutcome) === -1) {
      actorHtml = '<p class="actor-q">' + ACTOR_Q[pendingOutcome] + '</p>' +
        '<div class="winner-pick actor-pick">' +
        ["a", "b"].map(function (k) {
          return '<button data-actor="' + k + '" aria-pressed="' + (pendingActor === k) + '" type="button">' +
            '<span class="who">' + escapeHtml(m.names[k]) + '</span>' +
          '</button>';
        }).join("") +
        '</div>';
    }

    var actorReady = SERVER_ONLY_OUTCOMES.indexOf(pendingOutcome) !== -1 || !!pendingActor;
    var canLog = quickMode ? !!pendingWinner : (!!pendingOutcome && actorReady);
    var servingName = shortName(m, m.server);

    var quickModeToggleHtml =
      '<div class="quickmode-row">' +
        '<span class="quickmode-lbl">' + t("quickMode") + '</span>' +
        '<button id="quickModeToggle" aria-pressed="' + quickMode + '" type="button">' + (quickMode ? t("on") : t("off")) + '</button>' +
      '</div>';

    var serveSectionHtml = quickMode ? "" : (
      '<div class="serve-row">' +
        '<span class="serve-row-label">' + escapeHtml(t("isServing", { name: servingName })) + '</span>' +
        '<div class="serve-toggle">' +
          '<button data-serve="1" aria-pressed="' + (!pendingSecondServe) + '" type="button">' + t("serve1") + '</button>' +
          '<button data-serve="2" aria-pressed="' + (pendingSecondServe) + '" type="button">' + t("serve2") + '</button>' +
        '</div>' +
      '</div>'
    );

    var rallySectionHtml = quickMode ? "" : (
      '<p class="section-label">' + t("rallyHint") + '</p>' +
      '<button class="rally-btn" id="rallyBtn" type="button">' +
        '<span class="rally-num" id="rallyNum">' + pendingRally + '</span>' +
        '<span class="rally-lbl">' + t("rallyUnit") + '</span>' +
      '</button>'
    );

    return (
      quickModeToggleHtml +
      rallySectionHtml +
      serveSectionHtml +
      (quickMode
        ? '<p class="section-label">' + t("whoWon") + '</p><div class="winner-pick">' + winnerPickHtml + '</div>'
        : outcomeHtml + shotTypeHtml + actorHtml) +
      '<button class="log-point-btn" id="logBtn" type="button" ' + (canLog ? "" : "disabled") + '>' + t("logPoint") + '</button>' +
      (m.log.length ? '<div class="undo-row"><button id="undoBtn" type="button">' + t("undo") + '</button></div>' : "")
    );
  }

  // Puan akışındaki cümle. Türkçede "3. bölgeden backhand basit hata" sırası, İngilizcede
  // "made a backhand unforced error from zone 3" sırası doğal olduğu için dile göre ayrı kuruluyor.
  function logDesc(e, winnerName, loserName) {
    var z = e.loc && e.loc.zone ? e.loc.zone : null;
    var shotW = e.shotType === "forehand" ? "forehand" : (e.shotType === "backhand" ? "backhand" : "");
    if (LANG === "tr") {
      var where = z ? z + ". bölgeden " : "";
      var shot = shotW ? shotW + " " : "";
      if (e.outcome === "ace") return '<b>' + winnerName + '</b> ace yaptı';
      if (e.outcome === "double_fault") return '<b>' + loserName + '</b> çift hata yaptı';
      if (e.outcome === "winner") return '<b>' + winnerName + '</b> ' + where + (shot ? shot + 'vuruşuyla bitirdi' : 'vuruşla puanı bitirdi');
      if (e.outcome === "forced_error") return '<b>' + loserName + '</b> ' + where + shot + 'forced error yaptı';
      if (e.outcome === "unforced_error") return '<b>' + loserName + '</b> ' + where + shot + 'basit hata yaptı';
      return '<b>' + winnerName + '</b> ' + where + 'puanı kazandı';
    }
    var whereEn = z ? " from zone " + z : "";
    function art(word) { var w = shotW ? shotW + " " + word : word; return (/^[aeiou]/i.test(w) ? "an " : "a ") + w; }
    if (e.outcome === "ace") return '<b>' + winnerName + '</b> served an ace';
    if (e.outcome === "double_fault") return '<b>' + loserName + '</b> double-faulted';
    if (e.outcome === "winner") return '<b>' + winnerName + '</b> hit ' + art("winner") + whereEn;
    if (e.outcome === "forced_error") return '<b>' + loserName + '</b> made ' + art("forced error") + whereEn;
    if (e.outcome === "unforced_error") return '<b>' + loserName + '</b> made ' + art("unforced error") + whereEn;
    return '<b>' + winnerName + '</b> won the point' + whereEn;
  }

  function renderLogTab(m) {
    if (!m.log.length) return '<p class="empty-state">' + t("logEmpty") + '</p>';
    return m.log.map(function (e) {
      var winnerName = shortName(m, e.pointWinner);
      var loserName = shortName(m, otherKey(e.pointWinner));
      var desc = logDesc(e, escapeHtml(winnerName), escapeHtml(loserName));

      var tagClass = (e.outcome === "double_fault" || e.outcome === "unforced_error" || e.outcome === "forced_error") ? "neg" : "pos";
      var tag = e.setWonBy ? (e.pointWinner === e.setWonBy ? t("tagSet") + " " + escapeHtml(winnerName) : "") : (e.gameWonBy ? t("tagGame") + " " + escapeHtml(winnerName) : "");
      if (e.breakPoint && e.gameWonBy) tag = "BREAK · " + tag;

      var metaBits = [];
      if (e.secondServe || e.outcome === "double_fault") metaBits.push(t("secondServe"));
      if (e.rally) metaBits.push(t("rallyMeta", { n: e.rally }));
      // Cümlede bölge geçmeyen sonuçlarda (ace, çift hata) bilgiyi burada göster.
      if (e.loc && e.loc.zone && (e.outcome === "ace" || e.outcome === "double_fault")) {
        metaBits.push("📍 " + t("zoneN", { z: e.loc.zone }));
      }
      if (e.hr !== null) metaBits.push("♥ " + e.hr + " bpm");

      return (
        '<div class="log-entry">' +
          '<div class="log-score scorefont">' + e.preGames + '<br><span style="font-size:12px;opacity:.7">' + escapeHtml(localScore(e.preScore)) + '</span></div>' +
          '<div class="log-body">' +
            '<div class="log-desc">' + desc + '</div>' +
            (tag ? '<span class="log-tag ' + tagClass + '">' + tag + '</span>' : '') +
            (metaBits.length ? '<div class="log-hr">' + metaBits.join(" · ") + '</div>' : '') +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function computeServeStats(m, logArr) {
    var s = { a: { first: 0, firstWon: 0, second: 0, secondWon: 0 }, b: { first: 0, firstWon: 0, second: 0, secondWon: 0 } };
    (logArr || m.log).forEach(function (e) {
      var bucket = s[e.server];
      var onSecond = e.secondServe || e.outcome === "double_fault";
      if (onSecond) {
        bucket.second++;
        if (e.pointWinner === e.server) bucket.secondWon++;
      } else {
        bucket.first++;
        if (e.pointWinner === e.server) bucket.firstWon++;
      }
    });
    return s;
  }
  function pct(won, total) { return total ? Math.round((won / total) * 100) : null; }

  function buildStatRows(m, statsOverride, logArr) {
    var st = statsOverride || m.stats;
    var sa = st.a, sb = st.b;
    var serve = computeServeStats(m, logArr);
    return [
      [t("sAce"), sa.aces, sb.aces],
      [t("sDouble"), sa.doubleFaults, sb.doubleFaults],
      [t("sWinners"), sa.winners, sb.winners],
      [t("sForced"), sa.forcedErrors, sb.forcedErrors],
      [t("sUnforced"), sa.unforcedErrors, sb.unforcedErrors],
      [t("sFH"), sa.fhWinners + " / " + sa.fhErrors, sb.fhWinners + " / " + sb.fhErrors],
      [t("sBH"), sa.bhWinners + " / " + sa.bhErrors, sb.bhWinners + " / " + sb.bhErrors],
      [t("sBPWon"), sa.breakPointsWon, sb.breakPointsWon],
      [t("sBPFaced"), sa.breakPointsFaced, sb.breakPointsFaced],
      [t("s1st"), fmtPct(serve.a.firstWon, serve.a.first), fmtPct(serve.b.firstWon, serve.b.first)],
      [t("s2nd"), fmtPct(serve.a.secondWon, serve.a.second), fmtPct(serve.b.secondWon, serve.b.second)]
    ];
  }

  // ---------- Momentum chart (cumulative point differential) ----------
  function buildMomentumChartPoints(m, logArr) {
    var chrono = (logArr || m.log).slice().reverse();
    var points = [{ idx: 0, diff: 0, entry: null }];
    var diff = 0;
    chrono.forEach(function (e, i) {
      diff += (e.pointWinner === "a" ? 1 : -1);
      points.push({ idx: i + 1, diff: diff, entry: e });
    });
    return points;
  }

  var MOM_W = 320, MOM_H = 150, MOM_PAD_TOP = 10, MOM_PAD_BOTTOM = 22, MOM_PAD_RIGHT = 40, MOM_PAD_LEFT = 6;

  function buildMomentumChartSVG(points) {
    var plotW = MOM_W - MOM_PAD_LEFT - MOM_PAD_RIGHT;
    var plotH = MOM_H - MOM_PAD_TOP - MOM_PAD_BOTTOM;
    var maxAbs = 1;
    points.forEach(function (p) { if (Math.abs(p.diff) > maxAbs) maxAbs = Math.abs(p.diff); });
    var centerY = MOM_PAD_TOP + plotH / 2;
    var n = points.length;
    function xOf(i) { return MOM_PAD_LEFT + (n > 1 ? i * (plotW / (n - 1)) : 0); }
    function yOf(d) { return centerY - (d / maxAbs) * (plotH / 2); }

    var pathD = points.map(function (p, i) {
      return (i === 0 ? "M" : "L") + xOf(i).toFixed(1) + "," + yOf(p.diff).toFixed(1);
    }).join(" ");
    var areaD = pathD + " L" + xOf(n - 1).toFixed(1) + "," + centerY.toFixed(1) +
      " L" + xOf(0).toFixed(1) + "," + centerY.toFixed(1) + " Z";

    var last = points[n - 1];
    var lastX = xOf(n - 1), lastY = yOf(last.diff);
    var endColor = last.diff > 0 ? "var(--momentum-a)" : (last.diff < 0 ? "var(--momentum-b)" : "var(--text-dim)");
    var endLabel = (last.diff > 0 ? "+" : (last.diff < 0 ? "−" : "")) + Math.abs(last.diff);

    var setDots = points.map(function (p, i) {
      if (!p.entry || !p.entry.setWonBy) return "";
      var color = p.diff >= 0 ? "var(--momentum-a)" : "var(--momentum-b)";
      return '<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(p.diff).toFixed(1) + '" r="3.5" fill="' + color + '" stroke="var(--bg)" stroke-width="1.5" />';
    }).join("");

    return (
      '<svg viewBox="0 0 ' + MOM_W + ' ' + MOM_H + '" id="momentumSvg" data-points="' + n + '">' +
        '<defs>' +
          '<clipPath id="momClipAbove"><rect x="0" y="0" width="' + MOM_W + '" height="' + centerY.toFixed(1) + '" /></clipPath>' +
          '<clipPath id="momClipBelow"><rect x="0" y="' + centerY.toFixed(1) + '" width="' + MOM_W + '" height="' + (MOM_H - centerY).toFixed(1) + '" /></clipPath>' +
        '</defs>' +
        '<path d="' + areaD + '" fill="var(--momentum-a)" opacity="0.1" clip-path="url(#momClipAbove)" />' +
        '<path d="' + areaD + '" fill="var(--momentum-b)" opacity="0.1" clip-path="url(#momClipBelow)" />' +
        '<line x1="' + MOM_PAD_LEFT + '" y1="' + centerY.toFixed(1) + '" x2="' + (MOM_W - MOM_PAD_RIGHT) + '" y2="' + centerY.toFixed(1) + '" stroke="var(--hairline)" stroke-width="1" />' +
        '<path d="' + pathD + '" fill="none" stroke="var(--momentum-a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#momClipAbove)" />' +
        '<path d="' + pathD + '" fill="none" stroke="var(--momentum-b)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#momClipBelow)" />' +
        setDots +
        '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="5" fill="' + endColor + '" stroke="var(--bg)" stroke-width="2" />' +
        '<text x="' + (lastX + 9).toFixed(1) + '" y="' + (lastY + 4).toFixed(1) + '" font-size="12" font-family="Fraunces, serif" font-weight="600" fill="var(--text)">' + endLabel + '</text>' +
        '<rect id="momHitRect" x="' + MOM_PAD_LEFT + '" y="0" width="' + plotW + '" height="' + MOM_H + '" fill="transparent" />' +
        '<line id="momCrosshair" x1="0" y1="0" x2="0" y2="' + MOM_H + '" stroke="var(--text-dim)" stroke-width="1" opacity="0" />' +
        '<circle id="momHoverDot" cx="0" cy="0" r="4" fill="var(--text)" stroke="var(--bg)" stroke-width="2" opacity="0" />' +
      '</svg>'
    );
  }

  function renderMomentumCard(m, points) {
    if (points.length <= 1) {
      return (
        '<div class="momentum-card">' +
          '<div class="momentum-card-sub">' + t("momNotEnough") + '</div>' +
        '</div>'
      );
    }
    return (
      '<div class="momentum-card">' +
        '<div class="momentum-card-sub">' + t("momSub") + '</div>' +
        '<div class="momentum-chart-wrap">' +
          buildMomentumChartSVG(points) +
          '<div class="momentum-tooltip" id="momentumTooltip"></div>' +
        '</div>' +
        '<div class="momentum-legend">' +
          '<span><span class="sw" style="background:var(--momentum-a)"></span>' + t("ahead", { name: escapeHtml(shortName(m, "a")) }) + '</span>' +
          '<span><span class="sw" style="background:var(--momentum-b)"></span>' + t("ahead", { name: escapeHtml(shortName(m, "b")) }) + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  function initMomentumChartInteraction(m) {
    var svg = document.getElementById("momentumSvg");
    if (!svg || !lastMomentumPoints) return;
    var n = lastMomentumPoints.length;
    if (parseInt(svg.getAttribute("data-points"), 10) !== n) return;
    var hitRect = document.getElementById("momHitRect");
    var crosshair = document.getElementById("momCrosshair");
    var hoverDot = document.getElementById("momHoverDot");
    var tooltip = document.getElementById("momentumTooltip");
    var wrap = svg.closest(".momentum-chart-wrap");
    if (!hitRect || !tooltip || !wrap) return;

    var plotW = MOM_W - MOM_PAD_LEFT - MOM_PAD_RIGHT;
    var plotH = MOM_H - MOM_PAD_TOP - MOM_PAD_BOTTOM;
    var centerY = MOM_PAD_TOP + plotH / 2;
    var maxAbs = 1;
    lastMomentumPoints.forEach(function (p) { if (Math.abs(p.diff) > maxAbs) maxAbs = Math.abs(p.diff); });
    function xOf(i) { return MOM_PAD_LEFT + (n > 1 ? i * (plotW / (n - 1)) : 0); }
    function yOf(d) { return centerY - (d / maxAbs) * (plotH / 2); }

    function showAt(clientX, clientY) {
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      var relX = clientX - rect.left;
      var tX = (relX / rect.width) * MOM_W;
      var frac = (tX - MOM_PAD_LEFT) / (plotW || 1);
      frac = Math.max(0, Math.min(1, frac));
      var idx = Math.round(frac * (n - 1));
      var p = lastMomentumPoints[idx];
      var px = xOf(idx), py = yOf(p.diff);

      crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px);
      crosshair.setAttribute("opacity", "0.5");
      hoverDot.setAttribute("cx", px); hoverDot.setAttribute("cy", py);
      hoverDot.setAttribute("opacity", "1");

      var wrapRect = wrap.getBoundingClientRect();
      var screenX = rect.left + (px / MOM_W) * rect.width - wrapRect.left;
      var screenY = rect.top + (py / MOM_H) * rect.height - wrapRect.top;

      var label;
      if (idx === 0 || !p.entry) {
        label = t("start");
      } else {
        var e = p.entry;
        var wn = shortName(m, e.pointWinner);
        var diffTxt = (p.diff > 0 ? "+" : (p.diff < 0 ? "−" : "")) + Math.abs(p.diff);
        label = t("tipPoint", { i: idx, name: escapeHtml(wn), g: e.preGames, s: escapeHtml(localScore(e.preScore)), d: diffTxt });
      }
      tooltip.innerHTML = label;
      tooltip.style.left = screenX + "px";
      tooltip.style.top = Math.max(20, screenY) + "px";
      tooltip.classList.add("visible");
    }
    function hide() {
      crosshair.setAttribute("opacity", "0");
      hoverDot.setAttribute("opacity", "0");
      tooltip.classList.remove("visible");
    }

    hitRect.addEventListener("pointerdown", function (ev) { showAt(ev.clientX, ev.clientY); });
    hitRect.addEventListener("pointermove", function (ev) { showAt(ev.clientX, ev.clientY); });
    hitRect.addEventListener("pointerleave", hide);
    hitRect.addEventListener("pointerup", hide);
    hitRect.addEventListener("pointercancel", hide);
  }

  // Set filtresi çubuğu — oynanmış her set için bir çip.
  function renderSetFilter(m) {
    var playedSets = m.sets.length + ((m.games.a || m.games.b || m.tiebreak || m.points.a || m.points.b) && !m.matchOver ? 1 : 0);
    if (playedSets < 2) return "";
    var chips = ['<button data-setfilter="all" aria-pressed="' + (statsSetFilter === "all") + '" type="button">' + t("wholeMatch") + '</button>'];
    for (var i = 1; i <= playedSets; i++) {
      chips.push('<button data-setfilter="' + i + '" aria-pressed="' + (String(statsSetFilter) === String(i)) + '" type="button">' + t("setN", { n: i }) + '</button>');
    }
    return '<div class="setfilter-row">' + chips.join("") + '</div>';
  }

  // Vuruş haritası + bölge kırılımı. Nokta rengi puanı KAZANANı gösterir;
  // aynı bilgi altta tablo olarak da veriliyor (bilgi renge tek başına yüklenmiyor).
  function renderShotMapCard(m, logArr) {
    var withLoc = logArr.filter(function (e) { return e.loc && e.loc.zone; });
    if (!withLoc.length) return "";
    var isErr = function (e) { return e.outcome === "forced_error" || e.outcome === "unforced_error"; };
    var marks = withLoc.map(function (e) {
      return { x: e.loc.x, y: e.loc.y, err: isErr(e) };
    });
    // Konum vuruşu YAPAN oyuncunun yeri, o yüzden kırılım oyuncuya göre.
    var counts = {};
    [1, 2, 3, 4, 5].forEach(function (z) { counts[z] = { a: { w: 0, e: 0 }, b: { w: 0, e: 0 } }; });
    withLoc.forEach(function (e) {
      var actor = pointActor(e.pointWinner, e.outcome);
      counts[e.loc.zone][actor][isErr(e) ? "e" : "w"]++;
    });

    var rows = [1, 2, 3, 4, 5].map(function (z) {
      var c = counts[z];
      return '<tr><td>' + z + '. ' + escapeHtml(ZONE_NAME[z]) + '</td>' +
        '<td class="num">' + c.a.w + ' / ' + c.a.e + '</td>' +
        '<td class="num">' + c.b.w + ' / ' + c.b.e + '</td></tr>';
    }).join("");

    // İki filtre: hangi oyuncu ve hangi sonuç. Oyuncu seçilince o oyuncunun
    // yarısı aydınlık kalır, diğeri soluklaşır — kimin ne yaptığı net olsun.
    var shown = withLoc.filter(function (e) {
      if (shotMapPlayer !== "all" && pointActor(e.pointWinner, e.outcome) !== shotMapPlayer) return false;
      if (shotMapFilter === "win") return !isErr(e);
      if (shotMapFilter === "err") return isErr(e);
      return true;
    });
    var shownMarks = shown.map(function (e) { return { x: e.loc.x, y: e.loc.y, err: isErr(e) }; });

    // Şerit koyuluğu = o bölgede kaç vuruş (görünen filtreye göre).
    var dcount = { a: {}, b: {} }, dmax = 0;
    shown.forEach(function (e) {
      var side = e.loc.side;
      dcount[side][e.loc.zone] = (dcount[side][e.loc.zone] || 0) + 1;
      if (dcount[side][e.loc.zone] > dmax) dmax = dcount[side][e.loc.zone];
    });

    var chip = function (attr, id, cur, label, swatch) {
      return '<button data-' + attr + '="' + id + '" aria-pressed="' + (cur === id) + '" type="button">' +
        (swatch ? '<i class="' + swatch + '"></i>' : '') + escapeHtml(label) + '</button>';
    };
    var nA = shortName(m, "a"), nB = shortName(m, "b");

    return '<div class="shotmap-card">' +
      '<p class="shotmap-sub">' + t("shotmapSub") +
        (shotMapPlayer === "all"
          ? t("shotmapBoth", { a: escapeHtml(nA), b: escapeHtml(nB) })
          : t("shotmapOnly", { name: escapeHtml(shortName(m, shotMapPlayer)) })) + '</p>' +
      '<div class="shotmap-filter">' +
        chip("shotplayer", "all", shotMapPlayer, t("bothPlayers"), "") +
        chip("shotplayer", "a", shotMapPlayer, nA, "") +
        chip("shotplayer", "b", shotMapPlayer, nB, "") +
      '</div>' +
      '<div class="shotmap-filter">' +
        chip("shotfilter", "all", shotMapFilter, t("allN", { n: shown.length }), "") +
        chip("shotfilter", "win", shotMapFilter, t("fWinner"), "win") +
        chip("shotfilter", "err", shotMapFilter, t("fError"), "err") +
      '</div>' +
      '<div class="shotmap-wrap' + (shotMapPlayer === "all" ? "" : " half") + '">' +
        (shotMapPlayer === "all"
          ? courtSVG(m, { marks: shownMarks, density: { counts: dcount, max: dmax } })
          : halfCourtSVG(m, shotMapPlayer, {
              marks: shownMarks,
              density: { counts: dcount[shotMapPlayer] || {}, max: dmax }
            })) +
      '</div>' +
      '<table class="stat-table" style="margin-top:14px;">' +
        '<thead><tr><th>' + t("zoneTableHead") + '</th><th>' + escapeHtml(shortName(m, "a")) + '</th><th>' + escapeHtml(shortName(m, "b")) + '</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<p class="zone-table-note">' + t("zoneTableNote") + '</p>' +
      renderZoneInsights(m, counts) +
      '</div>';
  }

  // Bölge verisini cümleye çevirir: sadece gerçekten belirgin olanları söyler.
  function renderZoneInsights(m, counts) {
    var lines = [];
    ["a", "b"].forEach(function (k) {
      var errTotal = 0, winTotal = 0;
      var byZone = [];
      [1, 2, 3, 4, 5].forEach(function (z) {
        var c = counts[z][k];
        errTotal += c.e; winTotal += c.w;
        byZone.push({ z: z, w: c.w, e: c.e });
      });
      if (errTotal + winTotal < 8) return; // veri az, yorum yapma

      var bits = [];
      // En çok hata yapılan bölge — ancak belirgin bir yoğunlaşma varsa
      if (errTotal >= 5) {
        var topErr = byZone.slice().sort(function (x, y) { return y.e - x.e; })[0];
        var share = Math.round((topErr.e / errTotal) * 100);
        if (share >= 35 && topErr.e >= 3) {
          bits.push(t("insightErr", { pct: share, zone: escapeHtml(ZONE_ABL[topErr.z]), n: topErr.e, total: errTotal }));
        }
      }
      // En verimli bölge: winner'ın hataya açık ara üstün olduğu yer
      var best = byZone.slice().filter(function (c) { return c.w >= 3 && c.w > c.e; })
        .sort(function (x, y) { return (y.w - y.e) - (x.w - x.e); })[0];
      if (best) {
        bits.push(t("insightBest", { zone: escapeHtml(ZONE_NAME[best.z].toLocaleLowerCase(locale())), w: best.w, e: best.e }));
      }
      if (bits.length) {
        lines.push('<li><b>' + escapeHtml(shortName(m, k)) + '</b> — ' + bits.join('; ') + '.</li>');
      }
    });
    if (!lines.length) return "";
    return '<ul class="zone-insights">' + lines.join("") + '</ul>';
  }

  function renderMomentsCard(m) {
    var moments = buildKeyMoments(m);
    if (!moments.length) return "";
    var MAX = 18;
    var shown = rankMoments(moments, MAX);
    return '<div class="moments-card">' +
      shown.map(function (mo) {
        return '<div class="moment t-' + mo.type + '">' +
          '<div class="ico">' + (MOMENT_ICON[mo.type] || "•") + '</div>' +
          '<div class="body"><div class="txt">' + mo.text + '</div>' +
          (mo.sub ? '<div class="sub">' + escapeHtml(mo.sub) + '</div>' : "") +
          '</div></div>';
      }).join("") +
      (moments.length > MAX ? '<div class="moments-more">' + t("momentsMore", { n: moments.length - MAX }) + '</div>' : "") +
      '</div>';
  }

  // Katlanır bölüm. Gövde yalnızca açıkken üretilir — kapalıyken ağır
  // çizimler (yüzlerce nokta, grafik) hiç oluşturulmaz.
  function renderSection(id, title, sub, bodyFn) {
    var open = !!openSections[id];
    return '<div class="sec' + (open ? " open" : "") + '">' +
      '<button class="sec-head" data-sec="' + id + '" aria-expanded="' + open + '" type="button">' +
        '<span class="sec-label"><span class="sec-title">' + escapeHtml(title) + '</span>' +
          (sub ? '<span class="sec-sub">' + escapeHtml(sub) + '</span>' : '') + '</span>' +
        '<span class="sec-caret" aria-hidden="true"></span>' +
      '</button>' +
      (open ? '<div class="sec-body">' + bodyFn() + '</div>' : '') +
    '</div>';
  }

  function renderStatsTab(m) {
    var filtered = statsSetFilter !== "all";
    var setNo = filtered ? Number(statsSetFilter) : null;
    var logArr = filtered ? m.log.filter(function (e) { return e.setIndex === setNo; }) : m.log;

    var statsSrc = m.stats;
    if (filtered) {
      var per = replayMatch(m).perSet;
      statsSrc = per[setNo] || { a: blankStats(), b: blankStats() };
    }
    var sa = statsSrc.a, sb = statsSrc.b;
    var totalA = sa.pointsWon, totalB = sb.pointsWon;
    var rows = buildStatRows(m, statsSrc, logArr);

    var withRally = logArr.filter(function (e) { return e.rally && e.rally > 0; });
    var rallyAvg = withRally.length ? Math.round((withRally.reduce(function (a, e) { return a + e.rally; }, 0) / withRally.length) * 10) / 10 : null;
    var rallyMaxEntry = withRally.length ? withRally.reduce(function (m1, e) { return e.rally > m1.rally ? e : m1; }) : null;

    // En uzun üst üste puan serisi
    var chronoAll = logArr.slice().reverse();
    var bestStreak = 0, bestKey = null, curKey = null, cur = 0;
    chronoAll.forEach(function (e) {
      if (e.pointWinner === curKey) cur++; else { curKey = e.pointWinner; cur = 1; }
      if (cur > bestStreak) { bestStreak = cur; bestKey = curKey; }
    });

    var dur = filtered ? setDuration(m, setNo) : matchDuration(m);
    var durLabel = filtered ? t("setDur", { n: setNo }) : t("matchDur");

    var chartPoints = buildMomentumChartPoints(m, logArr);
    lastMomentumPoints = openSections.momentum ? chartPoints : null;

    // Başlıklarda gösterilecek özetler (bölüm kapalıyken de bilinmeli).
    var locCount = logArr.filter(function (e) { return e.loc && e.loc.zone; }).length;
    var momentCount = (!filtered && m.log.length > 1) ? buildKeyMoments(m).length : 0;

    return (
      renderSetFilter(m) +
      '<div class="stats-summary">' +
        '<div class="card"><div class="n">' + totalA + '</div><div class="lbl">' + escapeHtml(t("totalPoints", { name: m.names.a })) + '</div></div>' +
        '<div class="card"><div class="n">' + totalB + '</div><div class="lbl">' + escapeHtml(t("totalPoints", { name: m.names.b })) + '</div></div>' +
        '<div class="card"><div class="n">' + fmtDuration(dur) + '</div><div class="lbl">' + durLabel + '</div></div>' +
        '<div class="card"><div class="n">' + (bestStreak > 1 ? bestStreak : "—") + '</div><div class="lbl">' + (bestKey && bestStreak > 1 ? t("longestStreakBy", { name: escapeHtml(shortName(m, bestKey)) }) : t("longestStreak")) + '</div></div>' +
        '<div class="card"><div class="n">' + (rallyAvg !== null ? rallyAvg : "—") + '</div><div class="lbl">' + t("avgRally") + '</div></div>' +
        '<div class="card"><div class="n">' + (rallyMaxEntry ? rallyMaxEntry.rally : "—") + '</div><div class="lbl">' + (rallyMaxEntry ? t("longestRallyBy", { name: escapeHtml(shortName(m, rallyMaxEntry.pointWinner)) }) : t("longestRally")) + '</div></div>' +
      '</div>' +
      '<table class="stat-table">' +
        '<thead><tr><th></th><th>' + escapeHtml(shortName(m,"a")) + '</th><th>' + escapeHtml(shortName(m,"b")) + '</th></tr></thead>' +
        '<tbody>' +
        rows.map(function (r) {
          return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>';
        }).join("") +
        '</tbody>' +
      '</table>' +
      '<div class="sec-group">' +
        renderSection("momentum", t("secMomentum"),
          chartPoints.length > 1 ? t("secMomentumSub") : t("notEnough"),
          function () { return renderMomentumCard(m, chartPoints); }) +
        renderSection("shotmap", t("secShotmap"),
          locCount ? t("nShotLocs", { n: locCount }) : t("noZoneData"),
          function () { return renderShotMapCard(m, logArr); }) +
        (!filtered && momentCount
          ? renderSection("moments", t("secMoments"), t("nMoments", { n: momentCount }),
              function () { return renderMomentsCard(m); })
          : "") +
      '</div>' +
      (m.log.length ? '<button class="pdf-btn" data-share="1" type="button">' + t("shareMatchBtn") + '</button>' +
        '<button class="pdf-btn" id="pdfBtnStats" type="button">' + t("pdfReportBtn") + '</button><div class="pdf-hint">' + escapeHtml(t("pdfHint")) + '</div>' +
        '<button class="csv-btn" id="csvBtn" type="button">' + t("csvBtn") + '</button>' : "") +
      (viewingArchived ? "" : '<div class="archive-entry"><button id="openArchiveStats" type="button">' + t("archiveBtn") + '</button></div>') +
      renderResetRow() +
      langSwitchHtml("justify-content:center;margin-top:18px;")
    );
  }
  function fmtPct(won, total) {
    var p = pct(won, total);
    return p === null ? "—" : p + "% (" + total + ")";
  }

  function renderResetRow() {
    if (viewingArchived) return ""; // arşiv görünümünde üst çubuktaki "← Arşiv" yeterli
    if (resetConfirmPending) {
      return (
        '<div class="reset-row reset-row-confirm">' +
          '<span class="reset-confirm-txt">' + t("resetQ") + '</span>' +
          '<button id="resetConfirmYes" class="reset-yes" type="button">' + t("resetYes") + '</button>' +
          '<button id="resetConfirmNo" class="reset-no" type="button">' + t("cancel") + '</button>' +
        '</div>'
      );
    }
    return '<div class="reset-row"><button id="resetBtn" type="button">' + t("newMatch") + '</button></div>';
  }

  // ---------- Maç sonu PDF (yazdırma) raporu ----------
  // Artifact sayfası bir sandbox iframe içinde çalışıyor; o yüzden window.print()
  // ve sonuç ekranını doğrudan bu sayfada tetiklemek yerine, raporu ayrı bir
  // sekmede (gerçek bir üst düzey pencerede) açıp yazdırma orada tetikleniyor.
  function buildPrintDocHTML(m) {
    var rows = buildStatRows(m);
    var chartPoints = buildMomentumChartPoints(m);
    var dateStr = new Date().toLocaleDateString(locale(), { day: "2-digit", month: "long", year: "numeric" });
    var ruleTxt = (formatLabel(m) ? formatLabel(m) + " · " : "") + (m.noAd ? t("ruleNoAdShort") : t("ruleAdShort")) + " · " + t("nSets", { n: m.setsToPlay }) + (m.finalSetSuperTB ? t("finalSTBShort") : "");
    var scoreTxt = m.sets.map(function (s) {
      return s.superTB ? "[" + t("superTB") + " " + s.a + "–" + s.b + "]" : (s.a + "–" + s.b + (s.tb ? " (TB " + Math.min(s.tb.a, s.tb.b) + ")" : ""));
    }).join("   ");
    var winnerTxt = m.matchOver ? t("wonBy", { name: escapeHtml(m.names[m.winner]) }) : t("stillPlaying");
    var chartHtml = chartPoints.length > 1
      ? '<h2>' + t("secMomentum") + '</h2><div style="max-width:520px">' + buildMomentumChartSVG(chartPoints) + '</div>'
      : '';

    return (
      '<!doctype html><html lang="' + LANG + '"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + t("reportTitle") + '</title>' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">' +
      '<style>' +
        ':root{--bg:#ffffff;--panel:#ffffff;--panel-2:#f6f2e8;--text:#1c2a33;--text-dim:#5c6a72;--hairline:#cfc9ba;--brass:#a9793c;--clay:#a1503c;--grass:#4f7d61;--momentum-a:#8A7350;--momentum-b:#2f5878;}' +
        '*{box-sizing:border-box;}' +
        'body{font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;color:#1c2a33;background:#fff;padding:28px;max-width:640px;margin:0 auto;}' +
        'h1{font-family:"Fraunces",Georgia,serif;font-size:24px;margin:0 0 2px;}' +
        '.pr-sub{font-size:12px;color:#5c6a72;margin-bottom:18px;}' +
        '.pr-score{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600;margin-bottom:4px;}' +
        '.pr-sets{font-size:13px;color:#5c6a72;margin-bottom:20px;}' +
        'table{width:100%;border-collapse:collapse;margin-bottom:22px;}' +
        'th,td{padding:7px 6px;text-align:center;font-size:12.5px;border-bottom:1px solid #e2dccd;}' +
        'th:first-child,td:first-child{text-align:left;color:#5c6a72;}' +
        'h2{font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:600;margin:0 0 10px;}' +
        '.pr-footer{font-size:11px;color:#8a8378;margin-top:20px;}' +
        '.pr-hint{font-size:12px;color:#8a8378;margin-top:24px;padding-top:12px;border-top:1px solid #e2dccd;}' +
        '@media print{ .pr-hint{ display:none; } body{ padding:0; } }' +
      '</style></head><body>' +
      '<h1>' + t("reportTitle") + '</h1>' +
      '<div class="pr-sub">' + dateStr + ' · ' + ruleTxt + '</div>' +
      '<div class="pr-score">' + escapeHtml(m.names.a) + ' vs ' + escapeHtml(m.names.b) + '</div>' +
      '<div class="pr-sets">' + (scoreTxt || "—") + ' — ' + winnerTxt + '</div>' +
      '<h2>' + t("statsTitle") + '</h2>' +
      '<table>' +
        '<thead><tr><th></th><th>' + escapeHtml(shortName(m, "a")) + '</th><th>' + escapeHtml(shortName(m, "b")) + '</th></tr></thead>' +
        '<tbody>' +
        rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join("") +
        '</tbody>' +
      '</table>' +
      chartHtml +
      '<div class="pr-footer">' + t("reportFooter") + '</div>' +
      '<div class="pr-hint">' + escapeHtml(t("reportHint")) + '</div>' +
      '<script>window.onload=function(){ setTimeout(function(){ try{ window.print(); }catch(e){} }, 250); };<\/script>' +
      '</body></html>'
    );
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ---------- Arşiv gezinmesi ----------
  function openArchive() {
    // Canlı (devam eden) maç varsa kaybolmasın: hem arşive yaz hem kenarda tut.
    if (!viewingArchived && !state.setup && state.log && state.log.length) {
      archiveMatch(state);
      stashedState = state;
    }
    archiveOpen = true;
    render();
  }
  function closeArchive() {
    archiveOpen = false;
    if (viewingArchived) {
      viewingArchived = false;
      state = stashedState || freshMatch();
      stashedState = null;
      activeTab = "live";
      statsSetFilter = "all";
    }
    render();
  }
  function openArchivedMatch(archiveId) {
    var rec = loadArchive().filter(function (r) { return String(r.archiveId) === String(archiveId); })[0];
    if (!rec) return;
    if (!viewingArchived) stashedState = state; // canlı maçı sakla
    viewingArchived = true;
    archiveOpen = false;
    state = JSON.parse(JSON.stringify(rec));
    state.setup = false;
    activeTab = "stats";
    statsSetFilter = "all";
    render();
  }

  function bindEvents() {
    var arcTabs = app.querySelectorAll("[data-arctab]");
    for (var at = 0; at < arcTabs.length; at++) {
      arcTabs[at].onclick = function () {
        archiveTab = this.getAttribute("data-arctab");
        render();
      };
    }
    var arcBack = document.getElementById("archiveBack");
    if (arcBack) arcBack.onclick = function () { closeArchive(); };
    var backToArchive = document.getElementById("backToArchive");
    if (backToArchive) backToArchive.onclick = function () { archiveOpen = true; render(); };
    var arcOpenBtns = app.querySelectorAll("[data-arcopen]");
    for (var ao = 0; ao < arcOpenBtns.length; ao++) {
      arcOpenBtns[ao].onclick = function () { openArchivedMatch(this.getAttribute("data-arcopen")); };
    }
    var arcDelBtns = app.querySelectorAll("[data-arcdel]");
    for (var ad = 0; ad < arcDelBtns.length; ad++) {
      arcDelBtns[ad].onclick = function () {
        var id = this.getAttribute("data-arcdel");
        if (this.getAttribute("data-confirm") === "1") {
          deleteArchived(isNaN(Number(id)) ? id : Number(id));
          render();
        } else {
          this.setAttribute("data-confirm", "1");
          this.textContent = t("areYouSure");
        }
      };
    }
    var openArcStats = document.getElementById("openArchiveStats");
    if (openArcStats) openArcStats.onclick = function () { openArchive(); };

    var secHeads = app.querySelectorAll("[data-sec]");
    for (var sh = 0; sh < secHeads.length; sh++) {
      secHeads[sh].onclick = function () {
        var id = this.getAttribute("data-sec");
        openSections[id] = !openSections[id];
        render();
      };
    }

    var shotFilterBtns = app.querySelectorAll("[data-shotfilter]");
    for (var sfb = 0; sfb < shotFilterBtns.length; sfb++) {
      shotFilterBtns[sfb].onclick = function () {
        shotMapFilter = this.getAttribute("data-shotfilter");
        render();
      };
    }
    var shotPlayerBtns = app.querySelectorAll("[data-shotplayer]");
    for (var spb = 0; spb < shotPlayerBtns.length; spb++) {
      shotPlayerBtns[spb].onclick = function () {
        shotMapPlayer = this.getAttribute("data-shotplayer");
        render();
      };
    }

    var setFilterBtns = app.querySelectorAll("[data-setfilter]");
    for (var sf = 0; sf < setFilterBtns.length; sf++) {
      setFilterBtns[sf].onclick = function () {
        var v = this.getAttribute("data-setfilter");
        statsSetFilter = (v === "all") ? "all" : Number(v);
        render();
      };
    }

    var csvBtn = document.getElementById("csvBtn");
    if (csvBtn) {
      csvBtn.onclick = function () { exportCSV(this); };
    }

    var tabButtons = app.querySelectorAll("[data-tab]");
    for (var i = 0; i < tabButtons.length; i++) {
      tabButtons[i].onclick = function () {
        activeTab = this.getAttribute("data-tab");
        pendingWinner = null; pendingActor = null; pendingOutcome = null; pendingShotType = null;
        resetConfirmPending = false;
        render();
      };
    }
    var winnerButtons = app.querySelectorAll("[data-winner]");
    for (var j = 0; j < winnerButtons.length; j++) {
      winnerButtons[j].onclick = function () {
        var k = this.getAttribute("data-winner");
        pendingWinner = (pendingWinner === k) ? null : k;
        render();
      };
    }
    var actorButtons = app.querySelectorAll("[data-actor]");
    for (var ac = 0; ac < actorButtons.length; ac++) {
      actorButtons[ac].onclick = function () {
        var k = this.getAttribute("data-actor");
        pendingActor = (pendingActor === k) ? null : k;
        render();
      };
    }
    var outcomeButtons = app.querySelectorAll("[data-outcome]");
    for (var o = 0; o < outcomeButtons.length; o++) {
      outcomeButtons[o].onclick = function () {
        var v = this.getAttribute("data-outcome");
        pendingOutcome = (pendingOutcome === v) ? null : v;
        pendingShotType = null;
        pendingActor = null; // sonuç değişince "kim yaptı" yeniden sorulur
        render();
      };
    }
    var shotButtons = app.querySelectorAll("[data-shot]");
    for (var st = 0; st < shotButtons.length; st++) {
      shotButtons[st].onclick = function () {
        var v = this.getAttribute("data-shot");
        pendingShotType = (pendingShotType === v) ? null : v;
        render();
      };
    }
    var rallyBtn = document.getElementById("rallyBtn");
    if (rallyBtn) {
      rallyBtn.onclick = function () {
        pendingRally++;
        if (pendingRally === 2) {
          // Ralli 2 vuruşa ulaştı: ace/çift hata artık mümkün değil, o seçenekler kalkıyor.
          if (pendingOutcome === "ace" || pendingOutcome === "double_fault") pendingOutcome = null;
          render();
          return;
        }
        var numEl = document.getElementById("rallyNum");
        if (numEl) numEl.textContent = pendingRally;
      };
    }
    var serveButtons = app.querySelectorAll("[data-serve]");
    for (var sv = 0; sv < serveButtons.length; sv++) {
      serveButtons[sv].onclick = function () {
        var toSecond = this.getAttribute("data-serve") === "2";
        pendingSecondServe = toSecond;
        // Çift hata sadece ikinci serviste geçerli; 1. servise dönülünce temizle.
        if (!toSecond && pendingOutcome === "double_fault") pendingOutcome = null;
        render();
      };
    }
    var logBtn = document.getElementById("logBtn");
    if (logBtn) {
      logBtn.onclick = function () {
        var winnerKey;
        if (quickMode) {
          if (!pendingWinner) return;
          winnerKey = pendingWinner;
        } else {
          if (!pendingOutcome) return;
          var actor = resolvedActor(state, pendingOutcome);
          if (!actor) return;
          // Puanı kimin aldığı, vuruşu yapan + sonuçtan çıkıyor.
          winnerKey = winnerFromActor(actor, pendingOutcome);
        }
        // Bölge takibi hızlı modda ve ace/çift hatada sorulmuyor.
        if (!quickMode && ZONE_ASK_OUTCOMES.indexOf(pendingOutcome) !== -1) {
          zonePrompt = {
            winner: winnerKey, outcome: pendingOutcome, rally: pendingRally,
            secondServe: pendingSecondServe, shotType: pendingShotType
          };
          zonePick = null;
          render();
          return;
        }
        logPoint(state, winnerKey, quickMode ? null : pendingOutcome, null, pendingRally, pendingSecondServe, quickMode ? null : pendingShotType);
        markJustLogged();
        clearPending();
        saveState();
        if (state.matchOver && !viewingArchived) archiveMatch(state);
        render();
      };
    }
    var firstServerBtns = app.querySelectorAll("[data-firstserver]");
    for (var fs = 0; fs < firstServerBtns.length; fs++) {
      firstServerBtns[fs].onclick = function () {
        state.server = this.getAttribute("data-firstserver");
        state.needsServer = false;
        saveState();
        render();
      };
    }

    var zoneCourt = document.getElementById("zoneCourt");
    if (zoneCourt) {
      zoneCourt.onclick = function (ev) {
        var p = svgPointFromEvent(this, ev, HCRT.W, HCRT.H);
        if (!p || !zonePrompt) return;
        zonePick = zoneFromHalfPoint(p.x, p.y, pointActor(zonePrompt.winner, zonePrompt.outcome));
        render();
      };
    }
    var zoneSave = document.getElementById("zoneSave");
    if (zoneSave) zoneSave.onclick = function () { if (zonePick) commitPendingPoint(zonePick); };
    var zoneSkip = document.getElementById("zoneSkip");
    if (zoneSkip) zoneSkip.onclick = function () { commitPendingPoint(null); };
    var zoneModal = document.getElementById("zoneModal");
    if (zoneModal) {
      zoneModal.onclick = function (ev) {
        // Karartılmış alana dokunmak vazgeçer (puan kaydedilmez, seçimler durur).
        if (ev.target === this) { zonePrompt = null; zonePick = null; render(); }
      };
    }
    var quickModeToggle = document.getElementById("quickModeToggle");
    if (quickModeToggle) {
      quickModeToggle.onclick = function () {
        quickMode = !quickMode;
        saveQuickMode(quickMode);
        pendingOutcome = null; pendingShotType = null; pendingSecondServe = false;
        render();
      };
    }
    var undoBtn = document.getElementById("undoBtn");
    if (undoBtn) { undoBtn.onclick = function () { undoLastPoint(); saveState(); }; }

    var pdfHandler = function () {
      var docHtml = buildPrintDocHTML(state);
      var win = null;
      try { win = window.open("", "_blank"); } catch (e) { win = null; }
      if (win) {
        win.document.open();
        win.document.write(docHtml);
        win.document.close();
      } else {
        // Yeni sekme engellendiyse kullanıcıyı bilgilendir.
        var hintEl = document.querySelector(".pdf-hint");
        if (hintEl) hintEl.textContent = t("popupBlocked");
      }
    };
    var pdfBtnBanner = document.getElementById("pdfBtnBanner");
    if (pdfBtnBanner) pdfBtnBanner.onclick = pdfHandler;
    var pdfBtnStats = document.getElementById("pdfBtnStats");
    if (pdfBtnStats) pdfBtnStats.onclick = pdfHandler;

    var resetBtn = document.getElementById("resetBtn");
    if (resetBtn) {
      resetBtn.onclick = function () {
        resetConfirmPending = true;
        render();
      };
    }
    var resetYes = document.getElementById("resetConfirmYes");
    if (resetYes) {
      resetYes.onclick = function () {
        resetConfirmPending = false;
        // Yeni maça geçmeden önce mevcut maçı arşive al — hiçbir kayıt kaybolmasın.
        if (!viewingArchived && state.log && state.log.length) archiveMatch(state);
        viewingArchived = false;
        stashedState = null;
        state = freshMatch();
        activeTab = "live";
        statsSetFilter = "all";
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        render();
      };
    }
    var resetNo = document.getElementById("resetConfirmNo");
    if (resetNo) {
      resetNo.onclick = function () {
        resetConfirmPending = false;
        render();
      };
    }
  }

  applyDocLang();
  checkLaunchLink();
  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
