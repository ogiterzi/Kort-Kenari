    } catch (e) { return []; }
  }
  function writeArchive(arr) {
    try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr)); return true; }
    catch (e) { return false; } // kota dolarsa sessizce geç
  }
  // Biten (ya da yarıda bırakılan) maçı arşive yazar. Aynı maç tekrar yazılırsa günceller.
  function archiveMatch(m) {
    if (!m || m.setup || !m.log || !m.log.length) return;
    var arr = loadArchive();
    var stamp = m.startedAt || (m.log.length ? m.log[m.log.length - 1].t : Date.now());
    var rec = JSON.parse(JSON.stringify(m));
    rec.archiveId = stamp;
    rec.archivedAt = Date.now();
    rec.abandoned = !m.matchOver;
    var existing = -1;
    for (var i = 0; i < arr.length; i++) { if (arr[i].archiveId === stamp) { existing = i; break; } }
    if (existing >= 0) arr[existing] = rec; else arr.unshift(rec);
    arr.sort(function (x, y) { return (y.startedAt || +y.archiveId || 0) - (x.startedAt || +x.archiveId || 0); });
    if (arr.length > ARCHIVE_MAX) arr = arr.slice(0, ARCHIVE_MAX);
    writeArchive(arr);
  }
  function deleteArchived(archiveId) {
    var arr = loadArchive().filter(function (r) { return r.archiveId !== archiveId; });
    writeArchive(arr);
  }
  // ---------- Kayıtlı oyuncular ----------
  var PLAYERS_KEY = "courtside-players-v1";
  function loadPlayers() {
    try {
      var arr = JSON.parse(localStorage.getItem(PLAYERS_KEY) || "[]");
      return Array.isArray(arr) ? arr.filter(function (p) { return p && typeof p.name === "string" && p.name.trim(); }) : [];
    } catch (e) { return []; }
  }
  function writePlayers(arr) { try { localStorage.setItem(PLAYERS_KEY, JSON.stringify(arr)); } catch (e) {} }
  function findSavedPlayer(name) {
    var k = String(name || "").trim().toLocaleLowerCase("tr");
    if (!k) return -1;
    var arr = loadPlayers();
    for (var i = 0; i < arr.length; i++) if (arr[i].name.trim().toLocaleLowerCase("tr") === k) return i;
    return -1;
  }
  function toggleSavedPlayer(name) {
    name = String(name || "").trim().slice(0, 32);
    if (!name) return false;
    var arr = loadPlayers(), i = findSavedPlayer(name);
    if (i >= 0) { arr.splice(i, 1); writePlayers(arr); return false; }
    arr.push({ name: name, createdAt: Date.now() });
    arr.sort(function (x, y) { return x.name.localeCompare(y.name, "tr"); });
    writePlayers(arr);
    return true;
  }

  // Arşivdeki isimlerden benzersiz oyuncu listesi (kurulum ekranındaki otomatik tamamlama için)
  function archivePlayerNames() {
    var seen = {}, out = [];
    loadArchive().forEach(function (r) {
      ["a", "b"].forEach(function (k) {
        var n = (r.names && r.names[k] || "").trim();
        if (n && !seen[n.toLowerCase()]) { seen[n.toLowerCase()] = 1; out.push(n); }
      });
    });
    return out.sort();
  }

  // Arşivi oyuncu bazında toplar: kaç maç, kaç galibiyet, set farkı ve kariyer istatistikleri.
  function computePlayerTotals(archive) {
    var byName = {};
    function slot(name) {
      var key = name.trim().toLowerCase();
      if (!byName[key]) {
        byName[key] = { name: name.trim(), matches: 0, wins: 0, losses: 0,
                        setsWon: 0, setsLost: 0, pointsWon: 0, pointsLost: 0,
                        aces: 0, doubleFaults: 0, winners: 0, unforcedErrors: 0 };
      }
      return byName[key];
    }
    archive.forEach(function (r) {
      if (!r.names || r.special === "bye") return;
      ["a", "b"].forEach(function (k) {
        var nm = (r.names[k] || "").trim();
        if (!nm) return;
        var p = slot(nm), o = otherKey(k);
        p.matches++;
        if (r.matchOver && r.winner === k) p.wins++;
        else if (r.matchOver) p.losses++;
        (r.sets || []).forEach(function (s) {
          if (s[k] > s[o]) p.setsWon++; else if (s[o] > s[k]) p.setsLost++;
        });
        var st = (r.stats && r.stats[k]) || null;
        var so = (r.stats && r.stats[o]) || null;
        if (st) {
          p.pointsWon += st.pointsWon || 0;
          p.aces += st.aces || 0;
          p.doubleFaults += st.doubleFaults || 0;
          p.winners += st.winners || 0;
          p.unforcedErrors += st.unforcedErrors || 0;
        }
        if (so) p.pointsLost += so.pointsWon || 0;
      });
    });
    return Object.keys(byName).map(function (k) { return byName[k]; })
      .sort(function (x, y) { return y.matches - x.matches || y.wins - x.wins; });
  }

  // İki oyuncunun birbirine karşı geçmişi (yalnızca tamamlanmış maçlar).
  function computeHeadToHead(archive) {
    var pairs = {};
    archive.forEach(function (r) {
      if (!r.matchOver || !r.names || r.special === "bye") return;
      var nA = (r.names.a || "").trim(), nB = (r.names.b || "").trim();
      if (!nA || !nB) return;
      var ordered = [nA, nB].slice().sort(function (x, y) { return x.toLowerCase() < y.toLowerCase() ? -1 : 1; });
      var key = ordered[0].toLowerCase() + "\u0000" + ordered[1].toLowerCase();
      if (!pairs[key]) pairs[key] = { p1: ordered[0], p2: ordered[1], w1: 0, w2: 0, total: 0 };
      var winnerName = (r.names[r.winner] || "").trim();
      pairs[key].total++;
      if (winnerName.toLowerCase() === ordered[0].toLowerCase()) pairs[key].w1++; else pairs[key].w2++;
    });
    return Object.keys(pairs).map(function (k) { return pairs[k]; })
      .filter(function (p) { return p.total > 0; })
      .sort(function (x, y) { return y.total - x.total; });
  }

  // ---------- Scoring engine ----------
  function otherKey(k) { return k === "a" ? "b" : "a"; }
  function checkGameWin(pWin, pOther) { return pWin >= 4 && (pWin - pOther) >= 2; }

  function freshMatch(names, noAd, setsToPlay, finalSetSuperTB, formatOpts) {
    var stp = (setsToPlay === 5) ? 5 : 3;
    var fmt = formatOpts || {};
    var gamesTarget = fmt.setGamesTarget || 6;
    var winByTwo = fmt.setWinByTwo !== undefined ? !!fmt.setWinByTwo : true;
    var tbTriggerAt = fmt.tbTriggerAt || gamesTarget;
    if (fmt.forceSingleSet) stp = 1;
    return {
      setup: true,
      // Eski kayıtlarda alan yok: onlar detaylı sayılır.
      mode: fmt.mode === "simple" ? "simple" : "detailed",
      names: names || { a: t("playerA"), b: t("playerB") },
      noAd: !!noAd,
      setsToPlay: stp,
      setsNeeded: Math.ceil(stp / 2),
      finalSetSuperTB: !!finalSetSuperTB,
      setGamesTarget: gamesTarget,
      setWinByTwo: winByTwo,
      tbTriggerAt: tbTriggerAt,
      server: "a",
      points: { a: 0, b: 0 },
      games: { a: 0, b: 0 },
      sets: [],
      tiebreak: false,
      tb: { a: 0, b: 0 },
      tbTarget: 7,
      superTBFinal: false,
      matchOver: false,
      winner: null,
      startedAt: null,
      log: [],
      stats: {
        a: blankStats(), b: blankStats()
      }
    };
  }
  // Mevcut maçın format ayarları (yeniden oynatma için). Pro Set tek set olduğundan
  // setsToPlay=1 ayrıca belirtilmeli; yoksa freshMatch onu 3 sete çevirir.
  function formatOptsOf(m) {
    return { setGamesTarget: m.setGamesTarget, setWinByTwo: m.setWinByTwo,
             tbTriggerAt: m.tbTriggerAt, forceSingleSet: m.setsToPlay === 1, mode: m.mode };
  }
  // Tie-break servis sırası: ilk puanı biri atar, sonra her iki puanda bir değişir
  // (A, B B, A A, B B …). playedPoints = şimdiye kadar oynanan tie-break puanı.
  function tiebreakServer(firstServer, playedPoints) {
    return Math.floor((playedPoints + 1) / 2) % 2 === 0 ? firstServer : otherKey(firstServer);
  }
  function blankStats() {
    return { aces: 0, doubleFaults: 0, winners: 0, forcedErrors: 0, unforcedErrors: 0,
              pointsWon: 0, breakPointsWon: 0, breakPointsFaced: 0, returnErrors: 0, errors: 0,
              fhWinners: 0, bhWinners: 0, fhErrors: 0, bhErrors: 0 };
  }

  function isBreakPointNow(m) {
    if (m.tiebreak || m.matchOver) return false;
    var returner = otherKey(m.server);
    var rp = m.points[returner], sp = m.points[m.server];
    if (m.noAd && rp === 3 && sp === 3) return true; // karar puanı: her iki yön için de belirleyici
    return checkGameWin(rp + 1, sp);
  }

  function scoreLabel(m) {
    var labels = ["0", "15", "30", "40"];
    if (m.tiebreak) return m.tb.a + "–" + m.tb.b;
    var pa = m.points.a, pb = m.points.b;
    if (pa >= 3 && pb >= 3) {
      if (pa === pb) return m.noAd ? t("decidingPoint") : "Deuce";
      if (pa - pb === 1) return "Ad " + shortName(m, "a");
      if (pb - pa === 1) return "Ad " + shortName(m, "b");
    }
    return labels[pa] + "–" + labels[pb];
  }
  function shortName(m, k) {
    var n = m.names[k] || (k === "a" ? "A" : "B");
    return n.split(" ")[0];
  }
  function formatLabel(m) {
    if (m.setGamesTarget === 4) return "Fast4";
    if (m.setGamesTarget === 8) return "Pro Set";
    return null;
  }

  function computeMomentum(m) {
    if (!m.log.length) return null;
    var leader = m.log[0].pointWinner;
    var streak = 0;
    for (var i = 0; i < m.log.length; i++) {
      if (m.log[i].pointWinner === leader) streak++;
      else break;
    }
    if (streak < 3) return null;
    return { key: leader, streak: streak };
  }

  function applyOutcomeStats(m, pointWinnerKey, outcome, shotType) {
    var loserKey = otherKey(pointWinnerKey);
    var ws = m.stats[pointWinnerKey], ls = m.stats[loserKey];
    ws.pointsWon++;
    if (outcome === "ace") ws.aces++;
    else if (outcome === "double_fault") ls.doubleFaults++;
    else if (outcome === "winner") {
      ws.winners++;
      if (shotType === "forehand") ws.fhWinners++;
      else if (shotType === "backhand") ws.bhWinners++;
    } else if (outcome === "forced_error") {
      ls.forcedErrors++;
      if (shotType === "forehand") ls.fhErrors++;
      else if (shotType === "backhand") ls.bhErrors++;
    } else if (outcome === "error") {
      // Basit mod: türü belirtilmemiş hata.
      ls.errors = (ls.errors || 0) + 1;
    } else if (outcome === "return_error") {
      // Return hatası ayrı tutulur; basit/forced hata sayılarına karışmaz.
      ls.returnErrors = (ls.returnErrors || 0) + 1;
    } else if (outcome === "unforced_error") {
      ls.unforcedErrors++;
      if (shotType === "forehand") ls.fhErrors++;
      else if (shotType === "backhand") ls.bhErrors++;
    }
  }

  function logPoint(m, pointWinnerKey, outcome, hr, rally, secondServe, shotType, ts, loc) {
    if (m.matchOver) return m;
    var wasBreakPoint = isBreakPointNow(m);
    var server = m.server;
    var setIndex = m.sets.length + 1;
    var preScoreLabel = scoreLabel(m);
    var preGames = m.games.a + "–" + m.games.b;

    applyOutcomeStats(m, pointWinnerKey, outcome, shotType);

    var gameWonBy = null, setWonBy = null, tbSet = false;

    if (m.tiebreak) {
      // Tie-break'i ilk puanda servis atan. Eski kayıtlarda alan yok; o sürümde
      // servis tie-break boyunca değişmediği için m.server zaten ilk servis atandır.
      var tbFirst = m.tbFirstServer || m.server;
      m.tb[pointWinnerKey]++;
      if (m.tb[pointWinnerKey] >= m.tbTarget && (m.tb[pointWinnerKey] - m.tb[otherKey(pointWinnerKey)]) >= 2) {
        gameWonBy = pointWinnerKey;
        if (m.superTBFinal) {
          m.sets.push({ a: m.tb.a, b: m.tb.b, superTB: true });
        } else {
          var tbSnapshot = { a: m.tb.a, b: m.tb.b };
          var tbHi = (m.tbTriggerAt || 6) + 1, tbLo = m.tbTriggerAt || 6; // 7-6, Fast4'te 5-4, Pro sette 9-8
          m.sets.push({ a: pointWinnerKey === "a" ? tbHi : tbLo, b: pointWinnerKey === "b" ? tbHi : tbLo, tb: tbSnapshot });
        }
        setWonBy = pointWinnerKey; tbSet = true;
        m.games = { a: 0, b: 0 }; m.tb = { a: 0, b: 0 }; m.tiebreak = false;
        m.tbTarget = 7; m.superTBFinal = false;
        // Sonraki setin ilk oyununu, tie-break'e karşılayarak başlayan oyuncu açar.
        m.server = otherKey(tbFirst);
        m.tbFirstServer = null;
      } else {
        m.tbFirstServer = tbFirst;
        m.server = tiebreakServer(tbFirst, m.tb.a + m.tb.b);
      }
    } else {
      var preWin = m.points[pointWinnerKey], preOther = m.points[otherKey(pointWinnerKey)];
      var isDecidingPoint = m.noAd && preWin === 3 && preOther === 3;
      m.points[pointWinnerKey]++;
      if (isDecidingPoint || checkGameWin(m.points[pointWinnerKey], m.points[otherKey(pointWinnerKey)])) {
        gameWonBy = pointWinnerKey;
        if (wasBreakPoint && pointWinnerKey !== server) {
          m.stats[pointWinnerKey].breakPointsWon++;
          m.stats[server].breakPointsFaced++;
        }
        m.games[pointWinnerKey]++;
        m.points = { a: 0, b: 0 };
        m.server = otherKey(m.server);
        var wG = m.games[pointWinnerKey], oG = m.games[otherKey(pointWinnerKey)];
        var reachedSetTarget = wG >= m.setGamesTarget && (!m.setWinByTwo || (wG - oG) >= 2);
        if (reachedSetTarget) {
          m.sets.push({ a: m.games.a, b: m.games.b });
          setWonBy = pointWinnerKey;
          m.games = { a: 0, b: 0 };
        } else if (m.games.a === m.tbTriggerAt && m.games.b === m.tbTriggerAt) {
          m.tiebreak = true;
          m.tbFirstServer = m.server; // sırası gelen oyuncu tie-break'i açar
        }
      }
    }

    if (setWonBy) {
      var setsWon = m.sets.filter(function (s) { return (s.a > s.b ? "a" : "b") === setWonBy; }).length;
      if (setsWon >= m.setsNeeded) {
        m.matchOver = true; m.winner = setWonBy;
      } else if (m.finalSetSuperTB && m.sets.length === m.setsToPlay - 1) {
        // Belirleyici (son) set süper tie-break olarak oynanacak.
        m.tiebreak = true;
        m.tbTarget = 10;
        m.superTBFinal = true;
        m.tbFirstServer = m.server;
      }
    }

    m.log.unshift({
      id: Date.now() + Math.random(),
      t: ts || Date.now(), // puanın kaydedildiği an — süre hesapları için
      setIndex: setIndex,
      preGames: preGames,
      preScore: preScoreLabel,
      server: server,
      pointWinner: pointWinnerKey,
      outcome: outcome,
      hr: (hr !== null && hr !== undefined && hr !== "") ? Number(hr) : null,
      rally: (rally && rally > 0) ? rally : null,
      secondServe: !!secondServe,
      shotType: shotType || null,
      loc: loc || null, // puanın bittiği kort konumu: {zone, side, x, y}
      gameWonBy: gameWonBy,
      setWonBy: setWonBy,
      breakPoint: wasBreakPoint && pointWinnerKey !== server
    });

    return m;
  }

  function undoLastPoint() {
    // Simplest reliable undo: replay log minus the last point.
    if (!state.log.length) return;
    var entries = state.log.slice(1).slice().reverse();
    var names = state.names;
    var noAd = state.noAd;
    var setsToPlay = state.setsToPlay;
    var finalSetSuperTB = state.finalSetSuperTB;
    var startedAt = state.startedAt;
    var live = state.live; // canlı yayın geri almadan sonra da sürsün
    // Maça ilk servisi atan: log'un en eski kaydı.
    var firstServer = state.log[state.log.length - 1].server || "a";
    state = freshMatch(names, noAd, setsToPlay, finalSetSuperTB, formatOptsOf(state));
    state.setup = false;
    state.startedAt = startedAt;
    state.server = firstServer;
    if (live) state.live = live;
    entries.forEach(function (e) {
      logPoint(state, e.pointWinner, e.outcome, e.hr, e.rally, e.secondServe, e.shotType, e.t, e.loc);
    });
    render();
  }

  // Basit mod: son puanın nasıl bittiğini sonradan işaretler. Skor değişmez,
  // istatistikler tutarlı kalsın diye maç kayıttan yeniden kurulur.
  function setLastOutcome(outcome) {
    if (!state.log.length) return;
    var last = state.log[0];
    last.outcome = outcome;
    last.secondServe = outcome === "double_fault";
    var entries = state.log.slice().reverse();
    var keep = { startedAt: state.startedAt, archiveId: state.archiveId };
    var firstServer = entries[0].server || "a";
    state = freshMatch(state.names, state.noAd, state.setsToPlay, state.finalSetSuperTB, formatOptsOf(state));
    state.setup = false;
    state.startedAt = keep.startedAt;
    if (keep.archiveId) state.archiveId = keep.archiveId;
    state.server = firstServer;
    entries.forEach(function (e) {
      logPoint(state, e.pointWinner, e.outcome, e.hr, e.rally, e.secondServe, e.shotType, e.t, e.loc);
    });
    // id'ler korunur ki aynı puan olarak kalsın
    for (var i = 0; i < entries.length; i++) state.log[entries.length - 1 - i].id = entries[i].id;
  }

  // Log'u baştan oynatarak her puandan ÖNCEKİ maç durumunu üretir.
  // Set/maç sayısı tespiti ve set bazlı istatistik kırılımı bunun üzerine kurulu.
  function replayMatch(m) {
    var chrono = m.log.slice().reverse();
    var sim = freshMatch(m.names, m.noAd, m.setsToPlay, m.finalSetSuperTB, formatOptsOf(m));
    sim.setup = false;
    sim.server = chrono.length ? chrono[0].server : m.server;
    var steps = [];
    var perSet = {};
    chrono.forEach(function (e) {
      var setIdx = sim.sets.length + 1;
      var before = JSON.parse(JSON.stringify({
        points: sim.points, games: sim.games, sets: sim.sets, tiebreak: sim.tiebreak,
        tb: sim.tb, tbTarget: sim.tbTarget, superTBFinal: sim.superTBFinal, server: sim.server,
        tbFirstServer: sim.tbFirstServer || null
      }));
      var statsBefore = JSON.parse(JSON.stringify(sim.stats));
      steps.push({ entry: e, setIndex: setIdx, before: before, sim: sim });
      logPoint(sim, e.pointWinner, e.outcome, e.hr, e.rally, e.secondServe, e.shotType, e.t, e.loc);
      if (!perSet[setIdx]) perSet[setIdx] = { a: blankStats(), b: blankStats() };
      ["a", "b"].forEach(function (k) {
        Object.keys(sim.stats[k]).forEach(function (f) {
          perSet[setIdx][k][f] += (sim.stats[k][f] - statsBefore[k][f]);
        });
      });
    });
    return { steps: steps, perSet: perSet, sim: sim };
  }

  // Bu puan, verilen oyuncu için set/maç sayısı mı? (durumu klonlayıp bir puan oynatarak sınar)
  function pointImportance(beforeState, m, key) {
    var clone = freshMatch(m.names, m.noAd, m.setsToPlay, m.finalSetSuperTB, formatOptsOf(m));
    clone.setup = false;
    clone.points = { a: beforeState.points.a, b: beforeState.points.b };
    clone.games = { a: beforeState.games.a, b: beforeState.games.b };
    clone.sets = beforeState.sets.slice();
    clone.tiebreak = beforeState.tiebreak;
    clone.tb = { a: beforeState.tb.a, b: beforeState.tb.b };
    clone.tbTarget = beforeState.tbTarget;
    clone.superTBFinal = beforeState.superTBFinal;
    clone.server = beforeState.server;
    clone.tbFirstServer = beforeState.tbFirstServer || null;
    var setsBefore = clone.sets.length;
    logPoint(clone, key, null, null, 0, false, null);
    return { setPoint: clone.sets.length > setsBefore, matchPoint: !!clone.matchOver };
  }

  // ---------- Kort bölgeleri ----------
  // Gerçek kort ölçüleri, 1 metre = 20 birim. Bölgeler fileden uzaklığa göre:
  //   1) 0–3.2 m      vole bölgesi
  //   2) 3.2–6.40 m   mini kort (servis çizgisine kadar)
  //   3) 6.40–9.14 m  kort ortası (derin bölgenin ön yarısı)
  //   4) 9.14–11.885 m baseline önü (derin bölgenin arka yarısı)
  //   5) 11.885 m ötesi baseline arkası
  var CRT = {
    W: 279.4, H: 595.4,        // toplam çizim alanı
    NET: 297.7,                // file (dikey ortada)
    SCALE: 20,                 // px / metre
    mX: 30, mY: 60,            // kort dışı pay (1.5 m yan, 3 m arka)
    xDoubL: 30, xSingL: 57.4, xMid: 139.7, xSingR: 222, xDoubR: 249.4,
    yBaseTop: 60, yMidTop: 114.9, ySvcTop: 169.7, yVolTop: 233.7,
    yVolBot: 361.7, ySvcBot: 425.7, yMidBot: 480.5, yBaseBot: 535.4
  };
  // Dil değişince güncel kalsın diye nesne yerine okuma anında çözülür.
  var ZONE_NAME = {};
  [1, 2, 3, 4, 5].forEach(function (z) {
    Object.defineProperty(ZONE_NAME, z, { get: function () { return t("zone" + z); }, enumerable: true });
  });
  // -den hâli; Türkçe ek uyumu kurala bağlanmasın diye açıkça yazıldı.
  var ZONE_ABL = {};
  [1, 2, 3, 4, 5].forEach(function (z) {
    Object.defineProperty(ZONE_ABL, z, { get: function () { return t("zoneAbl" + z); }, enumerable: true });
  });
  var ZONE_BOUNDS_M = [3.2, 6.40, 9.14, 11.885]; // fileden uzaklık eşikleri

  // Kort üzerindeki bir noktayı bölgeye çevirir. side = noktanın hangi oyuncunun yarısında olduğu.
  function zoneFromPoint(px, py) {
    var x = Math.max(0, Math.min(CRT.W, px));
    var y = Math.max(0, Math.min(CRT.H, py));
    var distM = Math.abs(y - CRT.NET) / CRT.SCALE;
    var zone = 5;
    for (var i = 0; i < ZONE_BOUNDS_M.length; i++) {
      if (distM <= ZONE_BOUNDS_M[i]) { zone = i + 1; break; }
    }
    return { zone: zone, side: y < CRT.NET ? "a" : "b", x: x / CRT.W, y: y / CRT.H };
  }

  // ---------- Yarım kort (bölge seçme ekranı) ----------
  // Oyuncu her zaman kendi yarısında olduğu için seçim ekranında tek yarı yeterli.
  // File üstte (y=0), baseline aşağıda: tribünden oyuncunun arkasından bakış.
  // Genişlik tam kortla aynı tutuldu ki nokta tam korta birebir çevrilebilsin.
  var HCRT = {
    W: 279.4, H: 297.7, SCALE: 20,
    yVol: 64, ySvc: 128, yMid: 182.8, yBase: 237.7,
    xDoubL: 30, xSingL: 57.4, xMid: 139.7, xSingR: 222, xDoubR: 249.4
  };

  // Yarım korttaki noktayı bölgeye + TAM KORT koordinatına çevirir.
  // Böylece kayıt biçimi değişmez; vuruş haritası ve eski maçlar aynen çalışır.
  function zoneFromHalfPoint(px, py, actorSide) {
    var x = Math.max(0, Math.min(HCRT.W, px));
    // Tam file çizgisine (y=0) dokunulursa nokta tam kortta orta çizgiye düşer ve
    // hangi yarıda olduğu belirsizleşir; yarım birim içeri alıyoruz.
    var y = Math.max(0.5, Math.min(HCRT.H, py));
    var distM = y / HCRT.SCALE;
    var zone = 5;
    for (var i = 0; i < ZONE_BOUNDS_M.length; i++) {
      if (distM <= ZONE_BOUNDS_M[i]) { zone = i + 1; break; }
    }
    var fullY = actorSide === "a" ? (CRT.NET - y) : (CRT.NET + y);
    return { zone: zone, side: actorSide, x: x / CRT.W, y: fullY / CRT.H };
  }

  // Tam kort koordinatını yarım kort koordinatına geri çevirir (seçili noktayı göstermek için).
  function halfPointFromLoc(loc, actorSide) {
    if (!loc) return null;
    var fullY = loc.y * CRT.H;
    var d = actorSide === "a" ? (CRT.NET - fullY) : (fullY - CRT.NET);
    return { x: loc.x * CRT.W, y: Math.max(0, Math.min(HCRT.H, d)) };
  }

  // opts: {pick, marks, density, interactive}
  // Seçim ekranında tıklanabilir; vuruş haritasında tek oyuncu seçiliyken
  // aynı çizim noktaları ve yoğunluğu gösterir (boş yarıyı çizmeye gerek kalmaz).
  function halfCourtSVG(m, actorSide, opts) {
    var o = opts || {};
    var dens = o.density || null;
    var band = function (y1, y2, zoneNo) {
      var rect;
      if (dens) {
        var n = dens.counts[zoneNo] || 0;
        var op = dens.max ? (0.05 + 0.75 * (n / dens.max)) : 0;
        rect = '<rect class="zband zdens" style="opacity:' + op.toFixed(3) + '" x="0" y="' + y1 +
          '" width="' + HCRT.W + '" height="' + (y2 - y1) + '"></rect>';
      } else {
        rect = '<rect class="zband z' + zoneNo + '" x="0" y="' + y1 + '" width="' + HCRT.W + '" height="' + (y2 - y1) + '"></rect>';
      }
      return rect + '<text class="zlabel" x="' + (HCRT.W - 9) + '" y="' + ((y1 + y2) / 2 + 7) + '" text-anchor="end">' + zoneNo + '</text>';
    };
    var bands =
      band(0, HCRT.yVol, 1) + band(HCRT.yVol, HCRT.ySvc, 2) +
      band(HCRT.ySvc, HCRT.yMid, 3) + band(HCRT.yMid, HCRT.yBase, 4) +
      band(HCRT.yBase, HCRT.H, 5);

    var lines =
      // yan çizgiler ve baseline
      '<line class="cline" x1="' + HCRT.xDoubL + '" y1="0" x2="' + HCRT.xDoubL + '" y2="' + HCRT.yBase + '"></line>' +
      '<line class="cline" x1="' + HCRT.xDoubR + '" y1="0" x2="' + HCRT.xDoubR + '" y2="' + HCRT.yBase + '"></line>' +
      '<line class="cline" x1="' + HCRT.xSingL + '" y1="0" x2="' + HCRT.xSingL + '" y2="' + HCRT.yBase + '"></line>' +
      '<line class="cline" x1="' + HCRT.xSingR + '" y1="0" x2="' + HCRT.xSingR + '" y2="' + HCRT.yBase + '"></line>' +
      '<line class="cline" x1="' + HCRT.xDoubL + '" y1="' + HCRT.yBase + '" x2="' + HCRT.xDoubR + '" y2="' + HCRT.yBase + '"></line>' +
      // servis çizgisi ve orta servis çizgisi
      '<line class="cline" x1="' + HCRT.xSingL + '" y1="' + HCRT.ySvc + '" x2="' + HCRT.xSingR + '" y2="' + HCRT.ySvc + '"></line>' +
      '<line class="cline" x1="' + HCRT.xMid + '" y1="0" x2="' + HCRT.xMid + '" y2="' + HCRT.ySvc + '"></line>' +
      // file
      '<line class="cnet" x1="0" y1="2.5" x2="' + HCRT.W + '" y2="2.5"></line>';

    var labels =
      '<text class="cnetlabel" x="' + (HCRT.W / 2) + '" y="19" text-anchor="middle">' + t("netLabel") + '</text>' +
      '<text class="cname" x="10" y="' + (HCRT.H - 11) + '" text-anchor="start">' + escapeHtml(shortName(m, actorSide)) + '</text>';

    var marksHtml = (o.marks || []).map(function (mk) {
      var hp2 = halfPointFromLoc(mk, actorSide);
      if (!hp2) return "";
      return '<circle class="shot ' + (mk.err ? "s-err" : "s-win") + '" cx="' + hp2.x.toFixed(1) +
        '" cy="' + hp2.y.toFixed(1) + '" r="' + (mk.err ? 5 : 5.4) + '"></circle>';
    }).join("");

    var hp = halfPointFromLoc(o.pick, actorSide);
    var pickHtml = hp ? '<circle class="pickdot" cx="' + hp.x.toFixed(1) + '" cy="' + hp.y.toFixed(1) + '" r="10"></circle>' : "";

    return '<svg class="court' + (o.interactive ? " court-tap" : "") + '"' +
      (o.interactive ? ' id="zoneCourt"' : '') +
      ' width="' + HCRT.W + '" height="' + HCRT.H + '" ' +
      'viewBox="0 0 ' + HCRT.W + ' ' + HCRT.H + '" preserveAspectRatio="xMidYMid meet" role="img" ' +
      'aria-label="' + escapeAttr(t("ariaHalfCourt")) + '">' +
      '<rect class="csurface" x="0" y="0" width="' + HCRT.W + '" height="' + HCRT.H + '"></rect>' +
      bands + lines + labels + marksHtml + pickHtml +
      '</svg>';
  }

  // Puanı bitiren vuruşu kim yaptı: winner'ı/ace'i kazanan attı, hatayı kaybeden yaptı.
  function pointActor(pointWinnerKey, outcome) {
    if (outcome === "winner" || outcome === "ace" || !outcome) return pointWinnerKey;
    return otherKey(pointWinnerKey);
  }
  // Dokunma noktasını SVG'nin kendi koordinat sistemine çevirir.
  // getScreenCTM, SVG ölçeklenmiş ya da kenarlarda boşluk kalmış olsa bile doğru sonuç verir;
  // desteklenmediği durumda kutu oranına düşülür.
  function svgPointFromEvent(svg, ev, vbW, vbH) {
    var W = vbW || CRT.W, H = vbH || CRT.H;
    var cx = ev.clientX, cy = ev.clientY;
    if (cx === undefined && ev.changedTouches && ev.changedTouches.length) {
      cx = ev.changedTouches[0].clientX; cy = ev.changedTouches[0].clientY;
    }
    if (cx === undefined) return null;
    try {
      if (svg.getScreenCTM) {
        var ctm = svg.getScreenCTM();
        if (ctm && typeof ctm.inverse === "function") {
          var pt = svg.createSVGPoint ? svg.createSVGPoint() : new DOMPoint();
          pt.x = cx; pt.y = cy;
          var out = pt.matrixTransform(ctm.inverse());
          if (isFinite(out.x) && isFinite(out.y)) return { x: out.x, y: out.y };
        }
      }
    } catch (e) {}
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
  }

  function locLabel(m, loc) {
    if (!loc || !loc.zone) return "";
    return t("locLabel", { z: loc.zone, name: shortName(m, loc.side) });
  }

  // Ortak kort çizimi. opts: {interactive, marks, names, showZoneLabels, pick}
  function courtSVG(m, opts) {
    var o = opts || {};
    // Yoğunluk verilirse şeritler ısı haritasına dönüşür: aynı rengin koyuluğu
    // o bölgede kaç vuruş yapıldığını anlatır. Ayrı bir kontrol gerekmiyor.
    var dens = o.density || null;
    var L = function (y1, y2, sideKey, zoneNo) {
      var mid = (y1 + y2) / 2;
      var rect;
      if (dens) {
        var n = (dens.counts[sideKey] && dens.counts[sideKey][zoneNo]) || 0;
        var op = dens.max ? (0.05 + 0.75 * (n / dens.max)) : 0;
        rect = '<rect class="zband zdens" style="opacity:' + op.toFixed(3) + '" x="0" y="' + y1 +
          '" width="' + CRT.W + '" height="' + (y2 - y1) + '"></rect>';
      } else {
        rect = '<rect class="zband z' + zoneNo + '" x="0" y="' + y1 + '" width="' + CRT.W + '" height="' + (y2 - y1) + '"></rect>';
      }
      return rect + (o.showZoneLabels
        ? '<text class="zlabel" x="' + (CRT.W - 8) + '" y="' + (mid + 5) + '" text-anchor="end">' + zoneNo + '</text>'
        : '');
    };
    var bands =
      // üst yarı (a tarafı): dıştan file'a doğru 5,4,3,2,1
      L(0, CRT.yBaseTop, "a", 5) + L(CRT.yBaseTop, CRT.yMidTop, "a", 4) +
      L(CRT.yMidTop, CRT.ySvcTop, "a", 3) + L(CRT.ySvcTop, CRT.yVolTop, "a", 2) +
      L(CRT.yVolTop, CRT.NET, "a", 1) +
      // alt yarı (b tarafı)
      L(CRT.NET, CRT.yVolBot, "b", 1) + L(CRT.yVolBot, CRT.ySvcBot, "b", 2) +
      L(CRT.ySvcBot, CRT.yMidBot, "b", 3) + L(CRT.yMidBot, CRT.yBaseBot, "b", 4) +
      L(CRT.yBaseBot, CRT.H, "b", 5);

    var lines =
      // dış (dubl) kort dikdörtgeni
      '<rect class="cline" x="' + CRT.xDoubL + '" y="' + CRT.yBaseTop + '" width="' + (CRT.xDoubR - CRT.xDoubL) + '" height="' + (CRT.yBaseBot - CRT.yBaseTop) + '" fill="none"></rect>' +
      // tek kişilik yan çizgiler
      '<line class="cline" x1="' + CRT.xSingL + '" y1="' + CRT.yBaseTop + '" x2="' + CRT.xSingL + '" y2="' + CRT.yBaseBot + '"></line>' +
      '<line class="cline" x1="' + CRT.xSingR + '" y1="' + CRT.yBaseTop + '" x2="' + CRT.xSingR + '" y2="' + CRT.yBaseBot + '"></line>' +
      // servis çizgileri
      '<line class="cline" x1="' + CRT.xSingL + '" y1="' + CRT.ySvcTop + '" x2="' + CRT.xSingR + '" y2="' + CRT.ySvcTop + '"></line>' +
      '<line class="cline" x1="' + CRT.xSingL + '" y1="' + CRT.ySvcBot + '" x2="' + CRT.xSingR + '" y2="' + CRT.ySvcBot + '"></line>' +
      // orta servis çizgisi
      '<line class="cline" x1="' + CRT.xMid + '" y1="' + CRT.ySvcTop + '" x2="' + CRT.xMid + '" y2="' + CRT.ySvcBot + '"></line>' +
      // file
      '<line class="cnet" x1="' + (CRT.xDoubL - 12) + '" y1="' + CRT.NET + '" x2="' + (CRT.xDoubR + 12) + '" y2="' + CRT.NET + '"></line>';

    var nameTxt = o.names === false ? "" : (
      '<text class="cname" x="10" y="26" text-anchor="start">' + escapeHtml(shortName(m, "a")) + '</text>' +
      '<text class="cname" x="10" y="' + (CRT.H - 14) + '" text-anchor="start">' + escapeHtml(shortName(m, "b")) + '</text>'
    );

    // Vuruşu yapan oyuncunun bulunmadığı yarı soluklaştırılır — "nereden yaptı"
    // sorusunda doğru yarının neresi olduğu bakışta anlaşılsın diye.
    var dimHtml = "";
    if (o.activeSide === "a") {
      dimHtml = '<rect class="halfdim" x="0" y="' + CRT.NET + '" width="' + CRT.W + '" height="' + (CRT.H - CRT.NET) + '"></rect>';
    } else if (o.activeSide === "b") {
      dimHtml = '<rect class="halfdim" x="0" y="0" width="' + CRT.W + '" height="' + CRT.NET + '"></rect>';
    }

    // Renk sonucu, ŞEKİL de sonucu anlatır (dolu = winner, halka = hata):
    // yeşil/kırmızı ikilisi renk körlüğünde zayıf ayrıştığı için ikinci bir kodlama şart.
    var marksHtml = (o.marks || []).map(function (mk) {
      return '<circle class="shot ' + (mk.err ? "s-err" : "s-win") + '" cx="' + (mk.x * CRT.W).toFixed(1) +
        '" cy="' + (mk.y * CRT.H).toFixed(1) + '" r="' + (mk.err ? 4.2 : 4.6) + '"></circle>';
    }).join("");

    var pickHtml = o.pick
      ? '<circle class="pickdot" cx="' + (o.pick.x * CRT.W).toFixed(1) + '" cy="' + (o.pick.y * CRT.H).toFixed(1) + '" r="9"></circle>'
      : "";

    // width/height öznitelikleri şart: Safari, sadece viewBox'ı olan bir SVG'yi
    // width:auto ile sıfır boyuta düşürebiliyor. Bunlar içsel en-boy oranını verir.
    return '<svg class="court' + (o.interactive ? " court-tap" : "") + '" id="' + (o.id || "courtSvg") + '" ' +
      'width="' + CRT.W + '" height="' + CRT.H + '" ' +
      'viewBox="0 0 ' + CRT.W + ' ' + CRT.H + '" preserveAspectRatio="xMidYMid meet" role="img" ' +
      'aria-label="' + escapeAttr(t("ariaCourt")) + '">' +
      '<rect class="csurface" x="0" y="0" width="' + CRT.W + '" height="' + CRT.H + '"></rect>' +
      bands + lines + nameTxt + dimHtml + marksHtml + pickHtml +
      '</svg>';
  }

  // ---------- Süre yardımcıları ----------
  function entryTime(e) {
    if (e && typeof e.t === "number") return e.t;
    // Eski kayıtlarda t yok; id yaklaşık bir zaman damgasıdır.
    if (e && typeof e.id === "number" && e.id > 1e12) return Math.floor(e.id);
    return null;
  }
  function fmtDuration(ms) {
    if (ms === null || ms === undefined || !isFinite(ms) || ms < 0) return "—";
    // Uygulama açık unutulmuş / araya gün girmiş kayıtlarda anlamsız süre gösterme.
    if (ms > 12 * 3600 * 1000) return "—";
    var totalMin = Math.round(ms / 60000);
    if (totalMin < 1) return t("durLess1");
    var h = Math.floor(totalMin / 60), mnt = totalMin % 60;
    return h ? t("durHM", { h: h, m: mnt }) : t("durM", { m: mnt });
  }
  function matchDuration(m) {
    if (!m.log || !m.log.length) return null;
    var chrono = m.log.slice().reverse();
    var first = m.startedAt || entryTime(chrono[0]);
    var last = entryTime(chrono[chrono.length - 1]);
    if (first === null || last === null) return null;
    return last - first;
  }
  function setDuration(m, setIndex) {
    var inSet = m.log.slice().reverse().filter(function (e) { return e.setIndex === setIndex; });
    if (!inSet.length) return null;
    var startRef;
    if (setIndex === 1) startRef = m.startedAt || entryTime(inSet[0]);
    else {
      var prev = m.log.slice().reverse().filter(function (e) { return e.setIndex === setIndex - 1; });
      startRef = prev.length ? entryTime(prev[prev.length - 1]) : entryTime(inSet[0]);
    }
    var end = entryTime(inSet[inSet.length - 1]);
    if (startRef === null || end === null) return null;
    return end - startRef;
  }
  function fmtDateTR(ts) {
    if (!ts) return "—";
    try {
      return new Date(ts).toLocaleDateString(locale(), { day: "2-digit", month: "short", year: "numeric" });
    } catch (e) { return new Date(ts).toISOString().slice(0, 10); }
  }
  function setsScoreText(m) {
    if (!m.sets || !m.sets.length) return "—";
    return m.sets.map(function (s) {
      if (s.superTB) return "[" + s.a + "-" + s.b + "]";
      return s.a + "-" + s.b + (s.tb ? "(" + Math.min(s.tb.a, s.tb.b) + ")" : "");
    }).join(" ");
  }

  // ---------- Dönüm noktaları ----------
  // Maçı baştan oynatıp kritik anları çıkarır: kurtarılan maç/set sayıları,
  // kırılan servisler, uzun puan serileri ve en uzun ralli.
  var _momentsCache = { key: null, value: null };
  function buildKeyMoments(m) {
    if (!m.log || m.log.length < 2) return [];
    var cacheKey = (m.startedAt || 0) + ":" + m.log.length + ":" + (m.log[0] && m.log[0].id);
    if (_momentsCache.key === cacheKey) return _momentsCache.value;
    var out = buildKeyMomentsUncached(m);
    _momentsCache = { key: cacheKey, value: out };
    return out;
  }
  function buildKeyMomentsUncached(m) {
    var replay = replayMatch(m);
    var moments = [];
    var streaks = [];
    var streakKey = null, streakLen = 0, streakStart = 0;
    var longest = { rally: 0, entry: null, idx: 0 };

    replay.steps.forEach(function (step, i) {
      var e = step.entry;
      var loser = otherKey(e.pointWinner);
      var imp = pointImportance(step.before, m, loser); // kaybeden için fırsat mıydı?
      if (imp.matchPoint) {
        moments.push({ i: i, type: "saved-mp", setIndex: step.setIndex,
          text: t("mSavedMP", { name: escapeHtml(shortName(m, e.pointWinner)) }),
          sub: "Set " + step.setIndex + " · " + e.preGames + " (" + localScore(e.preScore) + ")" });
      } else if (imp.setPoint) {
        moments.push({ i: i, type: "saved-sp", setIndex: step.setIndex,
          text: t("mSavedSP", { name: escapeHtml(shortName(m, e.pointWinner)) }),
          sub: "Set " + step.setIndex + " · " + e.preGames + " (" + localScore(e.preScore) + ")" });
      }
      if (e.breakPoint && e.gameWonBy === e.pointWinner) {
        moments.push({ i: i, type: "break", setIndex: step.setIndex,
          text: t("mBreak", { name: escapeHtml(shortName(m, e.pointWinner)) }),
          sub: "Set " + step.setIndex + " · " + e.preGames + " (" + localScore(e.preScore) + ")" });
      }
      if (e.setWonBy) {
        var sIdx = step.setIndex - 1;
        var s = m.sets[sIdx];
        moments.push({ i: i, type: "set", setIndex: step.setIndex,
          text: t("mSet", { name: escapeHtml(shortName(m, e.setWonBy)), n: step.setIndex }),
          sub: s ? (s.superTB ? t("superTB") + " " + s.a + "–" + s.b : s.a + "–" + s.b + (s.tb ? " (TB " + s.tb.a + "–" + s.tb.b + ")" : "")) : "" });
      }
      if (e.rally && e.rally > longest.rally) longest = { rally: e.rally, entry: e, idx: i, setIndex: step.setIndex };
      if (e.pointWinner === streakKey) { streakLen++; }
      else {
        pushStreak();
        streakKey = e.pointWinner; streakLen = 1; streakStart = i;
      }
    });
    pushStreak();
    function pushStreak() {
      if (streakLen < 6 || !streakKey) return;
      streaks.push({ i: streakStart, type: "streak", len: streakLen, setIndex: replay.steps[streakStart].setIndex,
        text: t("mStreak", { name: escapeHtml(shortName(m, streakKey)), n: streakLen }),
        sub: "Set " + replay.steps[streakStart].setIndex });
    }
    // Seriler çok sık olabiliyor — sadece en uzun birkaçı gösterilir.
    streaks.sort(function (x, y) { return y.len - x.len; });
    moments = moments.concat(streaks.slice(0, 3));

    if (longest.entry) {
      moments.push({ i: longest.idx, type: "rally", setIndex: longest.setIndex,
        text: t("mRally", { name: escapeHtml(shortName(m, longest.entry.pointWinner)) }),
        sub: t("mRallySub", { n: longest.rally, s: longest.setIndex }) });
    }
    moments.sort(function (x, y) { return x.i - y.i; });
    return moments;
  }

  // Kırpma gerektiğinde önemsiz anlar önce düşsün diye öncelik sırası.
  var MOMENT_PRIORITY = { "saved-mp": 0, "set": 1, "saved-sp": 2, "break": 3, "rally": 4, "streak": 5 };
  function rankMoments(moments, max) {
    if (moments.length <= max) return moments;
    var ranked = moments.slice().sort(function (x, y) {
      var d = (MOMENT_PRIORITY[x.type] || 9) - (MOMENT_PRIORITY[y.type] || 9);
      return d !== 0 ? d : x.i - y.i;
    }).slice(0, max);
    return ranked.sort(function (x, y) { return x.i - y.i; });
  }

  var MOMENT_ICON = { "saved-mp": "🛡", "saved-sp": "🛡", "break": "⚡", "set": "🎾", "streak": "🔥", "rally": "↔" };

  // ---------- CSV dışa aktarma ----------
  function csvCell(v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    if (/[",;\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function buildCSV(m) {
    var head = t("csvHead");
    var rows = [head.map(csvCell).join(";")];
    var chrono = m.log.slice().reverse();
    chrono.forEach(function (e, i) {
      rows.push([
        i + 1,
        e.setIndex,
        e.preGames,
        localScore(e.preScore),
        m.names[e.server] || e.server,
        m.names[e.pointWinner] || e.pointWinner,
        e.outcome ? (outcomeLabel(e.outcome) || e.outcome).replace(/^[^\w\uFFFD\u00C0-\u024F]+\s*/, "") : "",
        e.shotType === "forehand" ? "Forehand" : (e.shotType === "backhand" ? "Backhand" : ""),
        e.rally || "",
        e.secondServe ? t("yes") : t("no"),
        e.breakPoint ? t("yes") : t("no"),
        e.loc && e.loc.zone ? e.loc.zone : "",
        e.loc && e.loc.zone ? ZONE_NAME[e.loc.zone] : "",
        e.loc && e.loc.side ? (m.names[e.loc.side] || e.loc.side) : "",
        e.gameWonBy ? (m.names[e.gameWonBy] || e.gameWonBy) : "",
        e.setWonBy ? (m.names[e.setWonBy] || e.setWonBy) : ""
      ].map(csvCell).join(";"));
    });
    return rows.join("\r\n");
  }
  function csvFileName(m) {
    function slug(s) {
      return (s || t("fileSlug")).toLowerCase()
        .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
        .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 20) || t("fileSlug");
    }
    var d = new Date(m.startedAt || Date.now());
    var stamp = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);

  var liveView = null;   // { code, status: "connecting"|"live"|"ended"|"notfound"|"reconnecting", hasData, raw }

  function extractLiveCode(hash) {
    var h = String(hash || ""), i = h.indexOf(LIVE_PREFIX);
    if (i < 0) return null;

  function applyLiveData(obj) {
    if (!obj || !obj.c) { liveView.status = liveView.hasData ? "ended" : "notfound"; render(); return; }
    var raw = obj.c, ended = !!obj.ended;
    if (raw === liveView.raw) {
      if (ended && liveView.status !== "ended") { liveView.status = "ended"; render(); }
      return;
    }
    if (raw.charAt(0) === "E") { applyEventLiveData(raw, ended); return; }
    decodeMatch(raw, true).then(function (m) {
      var prevLen = liveView.hasData ? state.log.length : -1;
      liveView.raw = raw;
      liveView.status = ended ? "ended" : "live";
      state = m; state.setup = false; state.archiveId = m.startedAt;
      viewingArchived = true;
      if (!liveView.hasData) { liveView.hasData = true; activeTab = "log"; }
      // Bağlantı yavaşsa birkaç puan birlikte gelebilir: son puana göre bildirim göster.
      if (prevLen >= 0 && state.log.length > prevLen && state.log.length - prevLen <= 6) markJustLogged();
      else if (prevLen >= 0 && state.log.length < prevLen) clearOverlays();

  function startLiveViewer(code) {

  function connectLiveStream() {
    if (typeof EventSource !== "function") { liveView.status = "notfound"; render(); return; }

    var es = new EventSource(FB.db + "/live/" + liveView.code + ".json");
    liveES = es;
    function onEvt(kind) {
      return function (ev) {
        var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }

        var path = msg.path || "/", data = msg.data;

          if (data === null) delete liveView.data[key]; else liveView.data[key] = data;
        }
        applyLiveData(liveView.data);

    }
    es.addEventListener("put", onEvt("put"));
    es.addEventListener("patch", onEvt("patch"));
    es.addEventListener("cancel", function () { liveView.status = liveView.hasData ? "ended" : "notfound"; render(); });

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}

  function markJustLogged() {
    var last = state.log[0];
    if (!last) return;
    if (state.matchOver) { pulseFlag = "match"; vibrate([25, 60, 25, 60, 60]); }
    else if (last.setWonBy) { pulseFlag = "set"; vibrate([20, 50, 40]); }
    else if (last.gameWonBy) { pulseFlag = "game"; vibrate(30); }
    else { pulseFlag = "point"; vibrate(12); }
    // Önce kutlama, sonra yer değişimi: ikisi aynı oyunda olabilir.
    var bk = detectBreak(state);
    if (bk) queueOverlay(function (done) { showBreakCelebration(bk, done); });
    var co = detectChangeover(state);
    if (co) queueOverlay(function (done) { showChangeover(co, done); });
  }

  // Teniste yer değişimi: setteki toplam oyun tek sayı olunca (1, 3, 5…), set sonunda
  // toplam oyun tek ise, tie-break'te her 6 puanda bir. Mola: setin ilk oyunundan sonra
  // ve tie-break'te yok, diğerlerinde 90 sn, set arasında 120 sn.
  function detectChangeover(m) {
    var e = m.log[0];
    if (!e || m.matchOver) return null;
    if (e.setWonBy) {
      var st = m.sets[m.sets.length - 1];
      if (!st || st.superTB) return null;
      return (st.a + st.b) % 2 === 1 ? { rest: "set", ga: st.a, gb: st.b } : null;
    }
    if (e.gameWonBy) {
      var tot = m.games.a + m.games.b;
      return tot % 2 === 1 ? { rest: tot === 1 ? "none" : "90", ga: m.games.a, gb: m.games.b } : null;
    }
    if (m.tiebreak) {
      var tt = m.tb.a + m.tb.b;
      return (tt > 0 && tt % 6 === 0) ? { rest: "tb", ta: m.tb.a, tb: m.tb.b } : null;
    }
    return null;
  }

  // Servis kırıldı mı; kırıldıysa ne tür: sıfıra, geri alma, set getiren.
  function detectBreak(m) {
    var e = m.log[0];
    if (!e || !e.breakPoint || !e.gameWonBy || m.matchOver) return null;
    var breaker = e.pointWinner, lost = 0, i = 1;
    while (i < m.log.length && !m.log[i].gameWonBy) { if (m.log[i].pointWinner !== breaker) lost++; i++; }
    var prev = i < m.log.length ? m.log[i] : null;
    var back = !!(prev && prev.breakPoint && prev.gameWonBy === prev.pointWinner &&
      prev.pointWinner === otherKey(breaker) && prev.setIndex === e.setIndex);
    var sc = e.setWonBy ? m.sets[m.sets.length - 1] : m.games;
    var kind = e.setWonBy ? "set" : (back ? "back" : (lost === 0 ? "love" : "break"));
    return { kind: kind, breaker: breaker, ga: sc.a, gb: sc.b };
  }

  var OUTCOME_KEY = { ace: "oAce", double_fault: "oDouble", winner: "oWinner", forced_error: "oForced", unforced_error: "oUnforced", return_error: "oReturn", error: "oError" };

      document.getElementById("ruleNoAd").setAttribute("aria-pressed", "false");
    };
    document.getElementById("ruleNoAd").onclick = function () {
      noAdRule = true;
      document.getElementById("ruleNoAd").setAttribute("aria-pressed", "true");
      document.getElementById("ruleAd").setAttribute("aria-pressed", "false");
    };
    // --- Kayıtlı oyuncular: ☆ ile kaydet, çipe dokunarak seç ---
    var lastNameField = "nameA";
    var spEditing = false;
    function nameEl(id) { return document.getElementById(id); }
    function updateStar(id) {
      var inp = nameEl(id), btn = app.querySelector('[data-star="' + id + '"]');
      if (!inp || !btn) return;
      var v = inp.value.trim(), saved = findSavedPlayer(v) >= 0;
      btn.disabled = !v;
      btn.classList.toggle("on", saved);
      btn.textContent = saved ? "★" : "☆";
      btn.setAttribute("aria-pressed", String(saved));
    }
    function renderSavedChips() {
      var box = nameEl("savedPlayers");
      if (!box) return;
      var players = loadPlayers();
      if (!players.length) { box.innerHTML = '<div class="sp-hint">' + escapeHtml(t("savedHint")) + '</div>'; spEditing = false; return; }
      var used = [nameEl("nameA").value.trim().toLowerCase(), nameEl("nameB").value.trim().toLowerCase()];
      box.innerHTML =
        '<div class="sp-head"><span>' + t("savedPlayers") + '</span><button type="button" id="spEdit">' + (spEditing ? t("doneEdit") : t("editSaved")) + '</button></div>' +
        '<div class="sp-chips">' + players.map(function (p) {
          var isUsed = used.indexOf(p.name.toLowerCase()) !== -1;
          return '<button type="button" class="pchip' + (isUsed && !spEditing ? ' used' : '') + '" data-pname="' + escapeAttr(p.name) + '">' +
            escapeHtml(p.name) + (spEditing ? '<span class="x">×</span>' : '') + '</button>';
        }).join("") + '</div>';
      nameEl("spEdit").onclick = function () { spEditing = !spEditing; renderSavedChips(); };
      var chips = box.querySelectorAll("[data-pname]");
      for (var c = 0; c < chips.length; c++) {
        chips[c].onclick = function () {
          var nm = this.getAttribute("data-pname");
          if (spEditing) { toggleSavedPlayer(nm); updateStar("nameA"); updateStar("nameB"); renderSavedChips(); return; }
          var a = nameEl("nameA"), b = nameEl("nameB");
          // Zaten seçiliyse bir daha yazma; önce boş alanı, yoksa son dokunulan alanı doldur.
          if (a.value.trim().toLowerCase() === nm.toLowerCase() || b.value.trim().toLowerCase() === nm.toLowerCase()) return;
          var target = !a.value.trim() ? a : (!b.value.trim() ? b : nameEl(lastNameField));
          target.value = nm;
          lastNameField = target.id === "nameA" ? "nameB" : "nameA";
          updateStar("nameA"); updateStar("nameB"); renderSavedChips();
        };
      }
    }
    ["nameA", "nameB"].forEach(function (id) {
      var inp = nameEl(id);
      inp.addEventListener("focus", function () { lastNameField = id; });
      inp.addEventListener("input", function () { updateStar(id); renderSavedChips(); });
      updateStar(id);
    });
    var stars = app.querySelectorAll("[data-star]");
    for (var si = 0; si < stars.length; si++) {
      stars[si].onclick = function () {
        var id = this.getAttribute("data-star"), btn = this;
        if (!nameEl(id).value.trim()) return;
        toggleSavedPlayer(nameEl(id).value);
        updateStar("nameA"); updateStar("nameB"); renderSavedChips();
        btn.classList.add("pop"); setTimeout(function () { btn.classList.remove("pop"); }, 160);
      };
    }
    renderSavedChips();

    document.getElementById("setupBack").onclick = function () { homeView = "hub"; render(); };
    var openArcSetup = document.getElementById("openArchiveSetup");
    if (openArcSetup) {
      openArcSetup.onclick = function () { openArchive(); };
    }
    document.getElementById("startBtn").onclick = function () {
      retireCurrentMatch();
      homeOpen = false; homeView = "hub";
      var nA = document.getElementById("nameA").value.trim() || t("playerA");
      var nB = document.getElementById("nameB").value.trim() || t("playerB");
      saveMode(modeVal);
      var fo = {}, base = FORMAT_OPTS[formatPreset] || {};
      Object.keys(base).forEach(function (k) { fo[k] = base[k]; });
      fo.mode = modeVal;
      state = freshMatch({ a: nA, b: nB }, noAdRule, setsToPlayVal, finalSetSuperTBVal, fo);
      state.setup = false;
      // Servisi kimin atacağı skor ekranında pop-up ile sorulur (kura genelde sonra belli olur).
      state.needsServer = true;
      state.startedAt = Date.now();
      saveState();
      render();
    };
  }

  // Puan akışındaki cümle. Türkçede "3. bölgeden backhand basit hata" sırası, İngilizcede
  // "made a backhand unforced error from zone 3" sırası doğal olduğu için dile göre ayrı kuruluyor.
  function logDesc(e, winnerName, loserName) {
    var z = e.loc && e.loc.zone ? e.loc.zone : null;
    var shotW = e.shotType === "forehand" ? "forehand" : (e.shotType === "backhand" ? "backhand" : "");
    if (LANG === "tr") {
      var where = z ? z + ". bölgeden " : "";
      var shot = shotW ? shotW + " " : "";
      if (e.outcome === "ace") return '<b>' + winnerName + '</b> ace yaptı';
      if (e.outcome === "double_fault") return '<b>' + loserName + '</b> çift hata yaptı';
      if (e.outcome === "winner") return '<b>' + winnerName + '</b> ' + where + (shot ? shot + 'vuruşuyla bitirdi' : 'vuruşla puanı bitirdi');
      if (e.outcome === "forced_error") return '<b>' + loserName + '</b> ' + where + shot + 'forced error yaptı';
      if (e.outcome === "unforced_error") return '<b>' + loserName + '</b> ' + where + shot + 'basit hata yaptı';
      if (e.outcome === "return_error") return '<b>' + loserName + '</b> return hatası yaptı';
      if (e.outcome === "error") return '<b>' + loserName + '</b> hata yaptı';
      return '<b>' + winnerName + '</b> ' + where + 'puanı kazandı';
    }
    var whereEn = z ? " from zone " + z : "";
    function art(word) { var w = shotW ? shotW + " " + word : word; return (/^[aeiou]/i.test(w) ? "an " : "a ") + w; }
    if (e.outcome === "ace") return '<b>' + winnerName + '</b> served an ace';
    if (e.outcome === "double_fault") return '<b>' + loserName + '</b> double-faulted';
    if (e.outcome === "winner") return '<b>' + winnerName + '</b> hit ' + art("winner") + whereEn;
    if (e.outcome === "forced_error") return '<b>' + loserName + '</b> made ' + art("forced error") + whereEn;
    if (e.outcome === "unforced_error") return '<b>' + loserName + '</b> made ' + art("unforced error") + whereEn;
    if (e.outcome === "return_error") return '<b>' + loserName + '</b> made a return error';
    if (e.outcome === "error") return '<b>' + loserName + '</b> made an error';
    return '<b>' + winnerName + '</b> won the point' + whereEn;
  }

  function renderLogTab(m) {
    if (!m.log.length) return '<p class="empty-state">' + t("logEmpty") + '</p>';
    return m.log.map(function (e) {
      var winnerName = shortName(m, e.pointWinner);
      var loserName = shortName(m, otherKey(e.pointWinner));
      var desc = logDesc(e, escapeHtml(winnerName), escapeHtml(loserName));

      var tagClass = (e.outcome === "double_fault" || e.outcome === "unforced_error" || e.outcome === "forced_error" || e.outcome === "return_error" || e.outcome === "error") ? "neg" : "pos";
      var tag = e.setWonBy ? (e.pointWinner === e.setWonBy ? t("tagSet") + " " + escapeHtml(winnerName) : "") : (e.gameWonBy ? t("tagGame") + " " + escapeHtml(winnerName) : "");
      if (e.breakPoint && e.gameWonBy) tag = "BREAK · " + tag;

      var metaBits = [];
      if (e.secondServe || e.outcome === "double_fault") metaBits.push(t("secondServe"));
      if (e.rally) metaBits.push(t("rallyMeta", { n: e.rally }));
      // Cümlede bölge geçmeyen sonuçlarda (ace, çift hata) bilgiyi burada göster.
      if (e.loc && e.loc.zone && (e.outcome === "ace" || e.outcome === "double_fault")) {
        metaBits.push("📍 " + t("zoneN", { z: e.loc.zone }));
      }
      if (e.hr !== null) metaBits.push("♥ " + e.hr + " bpm");

      return (
        '<div class="log-entry">' +
          '<div class="log-score scorefont">' + e.preGames + '<br><span style="font-size:12px;opacity:.7">' + escapeHtml(localScore(e.preScore)) + '</span></div>' +
          '<div class="log-body">' +
            '<div class="log-desc">' + desc + '</div>' +
            (tag ? '<span class="log-tag ' + tagClass + '">' + tag + '</span>' : '') +
            (metaBits.length ? '<div class="log-hr">' + metaBits.join(" · ") + '</div>' : '') +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function computeServeStats(m, logArr) {
    var s = { a: { first: 0, firstWon: 0, second: 0, secondWon: 0 }, b: { first: 0, firstWon: 0, second: 0, secondWon: 0 } };
    (logArr || m.log).forEach(function (e) {
      var bucket = s[e.server];
      var onSecond = e.secondServe || e.outcome === "double_fault";
      if (onSecond) {
        bucket.second++;
        if (e.pointWinner === e.server) bucket.secondWon++;
      } else {
        bucket.first++;
        if (e.pointWinner === e.server) bucket.firstWon++;
      }
    });
    return s;
  }
  function pct(won, total) { return total ? Math.round((won / total) * 100) : null; }

  function buildStatRows(m, statsOverride, logArr) {
    var st = statsOverride || m.stats;
    var sa = st.a, sb = st.b;
    var serve = computeServeStats(m, logArr);
    var bpc = computeBreakChances(m, logArr);
    if (m.mode === "simple") {
      // Basit modda servis/vuruş/bölge verisi yok; sıfır gösterip yanıltmamak için o satırlar çıkar.
      return [
        [t("sPoints"), sa.pointsWon, sb.pointsWon],
        [t("sAce"), sa.aces, sb.aces],
        [t("sDouble"), sa.doubleFaults, sb.doubleFaults],
        [t("sWinners"), sa.winners, sb.winners],
        [t("sErrors"), sa.errors || 0, sb.errors || 0],
        [t("sBPChances"), bpc.a.won + "/" + bpc.a.chances, bpc.b.won + "/" + bpc.b.chances]
      ];
    }
    return [
      [t("sPoints"), sa.pointsWon, sb.pointsWon],
      [t("s1stIn"), fmtPct(serve.a.first, serve.a.first + serve.a.second), fmtPct(serve.b.first, serve.b.first + serve.b.second)],
      [t("s1st"), fmtPct(serve.a.firstWon, serve.a.first), fmtPct(serve.b.firstWon, serve.b.first)],
      [t("s2nd"), fmtPct(serve.a.secondWon, serve.a.second), fmtPct(serve.b.secondWon, serve.b.second)],
      [t("sDouble"), sa.doubleFaults, sb.doubleFaults],
      [t("sAce"), sa.aces, sb.aces],
      [t("sWinners"), sa.winners, sb.winners],
      [t("sForced"), sa.forcedErrors, sb.forcedErrors],
      [t("sUnforced"), sa.unforcedErrors, sb.unforcedErrors],
      [t("sReturnErr"), sa.returnErrors || 0, sb.returnErrors || 0],
      // Yayınlardaki gibi "kırılan/şans": 3/7 = 7 servis kırma şansının 3'ü değerlendirildi.
      [t("sBPChances"), bpc.a.won + "/" + bpc.a.chances, bpc.b.won + "/" + bpc.b.chances],
      [t("sFH"), sa.fhWinners + " / " + sa.fhErrors, sb.fhWinners + " / " + sb.fhErrors],
      [t("sBH"), sa.bhWinners + " / " + sa.bhErrors, sb.bhWinners + " / " + sb.bhErrors]
    ];
  }

  // Karşılayan oyuncunun servis kırma şansları: maç baştan oynatılır ve her puandan
  // önceki durumda break point olup olmadığına bakılır. Eski maçlarda da çalışır.
  function computeBreakChances(m, logArr) {
    var res = { a: { chances: 0, won: 0 }, b: { chances: 0, won: 0 } };
    var arr = logArr || m.log;
    if (!arr.length) return res;
    var ids = {};
    arr.forEach(function (e) { ids[e.id] = 1; });
    replayMatch(m).steps.forEach(function (step) {
      var e = step.entry, b = step.before;
      if (!ids[e.id]) return;
      var isBp = isBreakPointNow({ tiebreak: b.tiebreak, matchOver: false, server: b.server, points: b.points, noAd: m.noAd });
      if (!isBp) return;
      var ret = otherKey(b.server);
      res[ret].chances++;
      if (e.pointWinner === ret) res[ret].won++;
    });
    return res;
  }

  // ---------- Momentum chart (cumulative point differential) ----------
  function buildMomentumChartPoints(m, logArr) {
    var chrono = (logArr || m.log).slice().reverse();
    var points = [{ idx: 0, diff: 0, entry: null }];
    var diff = 0;
    chrono.forEach(function (e, i) {
      diff += (e.pointWinner === "a" ? 1 : -1);
      points.push({ idx: i + 1, diff: diff, entry: e });
    });
    return points;
  }

  var MOM_W = 320, MOM_H = 150, MOM_PAD_TOP = 10, MOM_PAD_BOTTOM = 22, MOM_PAD_RIGHT = 40, MOM_PAD_LEFT = 6;

  function buildMomentumChartSVG(points) {
    var plotW = MOM_W - MOM_PAD_LEFT - MOM_PAD_RIGHT;
    var plotH = MOM_H - MOM_PAD_TOP - MOM_PAD_BOTTOM;
    var maxAbs = 1;
    points.forEach(function (p) { if (Math.abs(p.diff) > maxAbs) maxAbs = Math.abs(p.diff); });
    var centerY = MOM_PAD_TOP + plotH / 2;
    var n = points.length;
    function xOf(i) { return MOM_PAD_LEFT + (n > 1 ? i * (plotW / (n - 1)) : 0); }
    function yOf(d) { return centerY - (d / maxAbs) * (plotH / 2); }

    var pathD = points.map(function (p, i) {
      return (i === 0 ? "M" : "L") + xOf(i).toFixed(1) + "," + yOf(p.diff).toFixed(1);
    }).join(" ");
    var areaD = pathD + " L" + xOf(n - 1).toFixed(1) + "," + centerY.toFixed(1) +
      " L" + xOf(0).toFixed(1) + "," + centerY.toFixed(1) + " Z";

    var last = points[n - 1];
    var lastX = xOf(n - 1), lastY = yOf(last.diff);
    var endColor = last.diff > 0 ? "var(--momentum-a)" : (last.diff < 0 ? "var(--momentum-b)" : "var(--text-dim)");
    var endLabel = (last.diff > 0 ? "+" : (last.diff < 0 ? "−" : "")) + Math.abs(last.diff);

    var setDots = points.map(function (p, i) {
      if (!p.entry || !p.entry.setWonBy) return "";
      var color = p.diff >= 0 ? "var(--momentum-a)" : "var(--momentum-b)";
      return '<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(p.diff).toFixed(1) + '" r="3.5" fill="' + color + '" stroke="var(--bg)" stroke-width="1.5" />';
    }).join("");

    return (
      '<svg viewBox="0 0 ' + MOM_W + ' ' + MOM_H + '" id="momentumSvg" data-points="' + n + '">' +
        '<defs>' +
          '<clipPath id="momClipAbove"><rect x="0" y="0" width="' + MOM_W + '" height="' + centerY.toFixed(1) + '" /></clipPath>' +
          '<clipPath id="momClipBelow"><rect x="0" y="' + centerY.toFixed(1) + '" width="' + MOM_W + '" height="' + (MOM_H - centerY).toFixed(1) + '" /></clipPath>' +
        '</defs>' +
        '<path d="' + areaD + '" fill="var(--momentum-a)" opacity="0.1" clip-path="url(#momClipAbove)" />' +
        '<path d="' + areaD + '" fill="var(--momentum-b)" opacity="0.1" clip-path="url(#momClipBelow)" />' +
        '<line x1="' + MOM_PAD_LEFT + '" y1="' + centerY.toFixed(1) + '" x2="' + (MOM_W - MOM_PAD_RIGHT) + '" y2="' + centerY.toFixed(1) + '" stroke="var(--hairline)" stroke-width="1" />' +
        '<path d="' + pathD + '" fill="none" stroke="var(--momentum-a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#momClipAbove)" />' +
        '<path d="' + pathD + '" fill="none" stroke="var(--momentum-b)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#momClipBelow)" />' +
        setDots +
        '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="5" fill="' + endColor + '" stroke="var(--bg)" stroke-width="2" />' +
        '<text x="' + (lastX + 9).toFixed(1) + '" y="' + (lastY + 4).toFixed(1) + '" font-size="12" font-family="Fraunces, serif" font-weight="600" fill="var(--text)">' + endLabel + '</text>' +
        '<rect id="momHitRect" x="' + MOM_PAD_LEFT + '" y="0" width="' + plotW + '" height="' + MOM_H + '" fill="transparent" />' +
        '<line id="momCrosshair" x1="0" y1="0" x2="0" y2="' + MOM_H + '" stroke="var(--text-dim)" stroke-width="1" opacity="0" />' +
        '<circle id="momHoverDot" cx="0" cy="0" r="4" fill="var(--text)" stroke="var(--bg)" stroke-width="2" opacity="0" />' +
      '</svg>'
    );
  }

  function renderMomentumCard(m, points) {
    if (points.length <= 1) {
      return (
        '<div class="momentum-card">' +
          '<div class="momentum-card-sub">' + t("momNotEnough") + '</div>' +
        '</div>'
      );
    }
    return (
      '<div class="momentum-card">' +
        '<div class="momentum-card-sub">' + t("momSub") + '</div>' +
        '<div class="momentum-chart-wrap">' +
          buildMomentumChartSVG(points) +
          '<div class="momentum-tooltip" id="momentumTooltip"></div>' +
        '</div>' +
        '<div class="momentum-legend">' +
          '<span><span class="sw" style="background:var(--momentum-a)"></span>' + t("ahead", { name: escapeHtml(shortName(m, "a")) }) + '</span>' +
          '<span><span class="sw" style="background:var(--momentum-b)"></span>' + t("ahead", { name: escapeHtml(shortName(m, "b")) }) + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  function initMomentumChartInteraction(m) {
    var svg = document.getElementById("momentumSvg");
    if (!svg || !lastMomentumPoints) return;
    var n = lastMomentumPoints.length;
    if (parseInt(svg.getAttribute("data-points"), 10) !== n) return;
    var hitRect = document.getElementById("momHitRect");
    var crosshair = document.getElementById("momCrosshair");
    var hoverDot = document.getElementById("momHoverDot");
    var tooltip = document.getElementById("momentumTooltip");
    var wrap = svg.closest(".momentum-chart-wrap");
    if (!hitRect || !tooltip || !wrap) return;

    var plotW = MOM_W - MOM_PAD_LEFT - MOM_PAD_RIGHT;
    var plotH = MOM_H - MOM_PAD_TOP - MOM_PAD_BOTTOM;
    var centerY = MOM_PAD_TOP + plotH / 2;
    var maxAbs = 1;
    lastMomentumPoints.forEach(function (p) { if (Math.abs(p.diff) > maxAbs) maxAbs = Math.abs(p.diff); });
    function xOf(i) { return MOM_PAD_LEFT + (n > 1 ? i * (plotW / (n - 1)) : 0); }
    function yOf(d) { return centerY - (d / maxAbs) * (plotH / 2); }

    function showAt(clientX, clientY) {
      var rect = svg.getBoundingClientRect();
      if (!rect.width) return;
      var relX = clientX - rect.left;
      var tX = (relX / rect.width) * MOM_W;
      var frac = (tX - MOM_PAD_LEFT) / (plotW || 1);
      frac = Math.max(0, Math.min(1, frac));
      var idx = Math.round(frac * (n - 1));
      var p = lastMomentumPoints[idx];
      var px = xOf(idx), py = yOf(p.diff);

      crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px);
      crosshair.setAttribute("opacity", "0.5");
      hoverDot.setAttribute("cx", px); hoverDot.setAttribute("cy", py);
      hoverDot.setAttribute("opacity", "1");

      var wrapRect = wrap.getBoundingClientRect();
      var screenX = rect.left + (px / MOM_W) * rect.width - wrapRect.left;
      var screenY = rect.top + (py / MOM_H) * rect.height - wrapRect.top;

      var label;
      if (idx === 0 || !p.entry) {
        label = t("start");
      } else {
        var e = p.entry;
        var wn = shortName(m, e.pointWinner);
        var diffTxt = (p.diff > 0 ? "+" : (p.diff < 0 ? "−" : "")) + Math.abs(p.diff);
        label = t("tipPoint", { i: idx, name: escapeHtml(wn), g: e.preGames, s: escapeHtml(localScore(e.preScore)), d: diffTxt });
      }
      tooltip.innerHTML = label;
      tooltip.style.left = screenX + "px";
      tooltip.style.top = Math.max(20, screenY) + "px";
      tooltip.classList.add("visible");
    }
    function hide() {
      crosshair.setAttribute("opacity", "0");
      hoverDot.setAttribute("opacity", "0");
      tooltip.classList.remove("visible");
    }

    hitRect.addEventListener("pointerdown", function (ev) { showAt(ev.clientX, ev.clientY); });
    hitRect.addEventListener("pointermove", function (ev) { showAt(ev.clientX, ev.clientY); });
    hitRect.addEventListener("pointerleave", hide);
    hitRect.addEventListener("pointerup", hide);
    hitRect.addEventListener("pointercancel", hide);
  }

  // Set filtresi çubuğu — oynanmış her set için bir çip.
  function renderSetFilter(m) {
    var playedSets = m.sets.length + ((m.games.a || m.games.b || m.tiebreak || m.points.a || m.points.b) && !m.matchOver ? 1 : 0);
    if (playedSets < 2) return "";
    var chips = ['<button data-setfilter="all" aria-pressed="' + (statsSetFilter === "all") + '" type="button">' + t("wholeMatch") + '</button>'];
    for (var i = 1; i <= playedSets; i++) {
      chips.push('<button data-setfilter="' + i + '" aria-pressed="' + (String(statsSetFilter) === String(i)) + '" type="button">' + t("setN", { n: i }) + '</button>');
    }
    return '<div class="setfilter-row">' + chips.join("") + '</div>';
  }

  // Vuruş haritası + bölge kırılımı. Nokta rengi puanı KAZANANı gösterir;
  // aynı bilgi altta tablo olarak da veriliyor (bilgi renge tek başına yüklenmiyor).
  function renderShotMapCard(m, logArr) {
    var withLoc = logArr.filter(function (e) { return e.loc && e.loc.zone; });
    if (!withLoc.length) return "";
    var isErr = function (e) { return e.outcome === "forced_error" || e.outcome === "unforced_error"; };
    var marks = withLoc.map(function (e) {
      return { x: e.loc.x, y: e.loc.y, err: isErr(e) };
    });
    // Konum vuruşu YAPAN oyuncunun yeri, o yüzden kırılım oyuncuya göre.
    var counts = {};
    [1, 2, 3, 4, 5].forEach(function (z) { counts[z] = { a: { w: 0, e: 0 }, b: { w: 0, e: 0 } }; });
    withLoc.forEach(function (e) {
      var actor = pointActor(e.pointWinner, e.outcome);
      counts[e.loc.zone][actor][isErr(e) ? "e" : "w"]++;
    });

    var rows = [1, 2, 3, 4, 5].map(function (z) {
      var c = counts[z];
      return '<tr><td>' + z + '. ' + escapeHtml(ZONE_NAME[z]) + '</td>' +
        '<td class="num">' + c.a.w + ' / ' + c.a.e + '</td>' +
        '<td class="num">' + c.b.w + ' / ' + c.b.e + '</td></tr>';
    }).join("");

    // İki filtre: hangi oyuncu ve hangi sonuç. Oyuncu seçilince o oyuncunun
    // yarısı aydınlık kalır, diğeri soluklaşır — kimin ne yaptığı net olsun.
    var shown = withLoc.filter(function (e) {
      if (shotMapPlayer !== "all" && pointActor(e.pointWinner, e.outcome) !== shotMapPlayer) return false;
      if (shotMapFilter === "win") return !isErr(e);
      if (shotMapFilter === "err") return isErr(e);
      return true;
    });
    var shownMarks = shown.map(function (e) { return { x: e.loc.x, y: e.loc.y, err: isErr(e) }; });

    // Şerit koyuluğu = o bölgede kaç vuruş (görünen filtreye göre).
    var dcount = { a: {}, b: {} }, dmax = 0;
    shown.forEach(function (e) {
      var side = e.loc.side;
      dcount[side][e.loc.zone] = (dcount[side][e.loc.zone] || 0) + 1;
      if (dcount[side][e.loc.zone] > dmax) dmax = dcount[side][e.loc.zone];
    });

    var chip = function (attr, id, cur, label, swatch) {
      return '<button data-' + attr + '="' + id + '" aria-pressed="' + (cur === id) + '" type="button">' +
        (swatch ? '<i class="' + swatch + '"></i>' : '') + escapeHtml(label) + '</button>';
    };
    var nA = shortName(m, "a"), nB = shortName(m, "b");

    return '<div class="shotmap-card">' +
      '<p class="shotmap-sub">' + t("shotmapSub") +
        (shotMapPlayer === "all"
          ? t("shotmapBoth", { a: escapeHtml(nA), b: escapeHtml(nB) })
          : t("shotmapOnly", { name: escapeHtml(shortName(m, shotMapPlayer)) })) + '</p>' +
      '<div class="shotmap-filter">' +
        chip("shotplayer", "all", shotMapPlayer, t("bothPlayers"), "") +
        chip("shotplayer", "a", shotMapPlayer, nA, "") +
        chip("shotplayer", "b", shotMapPlayer, nB, "") +
      '</div>' +
      '<div class="shotmap-filter">' +
        chip("shotfilter", "all", shotMapFilter, t("allN", { n: shown.length }), "") +
        chip("shotfilter", "win", shotMapFilter, t("fWinner"), "win") +
        chip("shotfilter", "err", shotMapFilter, t("fError"), "err") +
      '</div>' +
      '<div class="shotmap-wrap' + (shotMapPlayer === "all" ? "" : " half") + '">' +
        (shotMapPlayer === "all"
          ? courtSVG(m, { marks: shownMarks, density: { counts: dcount, max: dmax } })
          : halfCourtSVG(m, shotMapPlayer, {
              marks: shownMarks,
              density: { counts: dcount[shotMapPlayer] || {}, max: dmax }
            })) +
      '</div>' +
      '<table class="stat-table" style="margin-top:14px;">' +
        '<thead><tr><th>' + t("zoneTableHead") + '</th><th>' + escapeHtml(shortName(m, "a")) + '</th><th>' + escapeHtml(shortName(m, "b")) + '</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<p class="zone-table-note">' + t("zoneTableNote") + '</p>' +
      renderZoneInsights(m, counts) +
      '</div>';
  }

  // Bölge verisini cümleye çevirir: sadece gerçekten belirgin olanları söyler.
  function renderZoneInsights(m, counts) {
    var lines = [];
    ["a", "b"].forEach(function (k) {
      var errTotal = 0, winTotal = 0;
      var byZone = [];
      [1, 2, 3, 4, 5].forEach(function (z) {
        var c = counts[z][k];
        errTotal += c.e; winTotal += c.w;
        byZone.push({ z: z, w: c.w, e: c.e });
      });
      if (errTotal + winTotal < 8) return; // veri az, yorum yapma

      var bits = [];
      // En çok hata yapılan bölge — ancak belirgin bir yoğunlaşma varsa
      if (errTotal >= 5) {
        var topErr = byZone.slice().sort(function (x, y) { return y.e - x.e; })[0];
        var share = Math.round((topErr.e / errTotal) * 100);
        if (share >= 35 && topErr.e >= 3) {
          bits.push(t("insightErr", { pct: share, zone: escapeHtml(ZONE_ABL[topErr.z]), n: topErr.e, total: errTotal }));
        }
      }
      // En verimli bölge: winner'ın hataya açık ara üstün olduğu yer
      var best = byZone.slice().filter(function (c) { return c.w >= 3 && c.w > c.e; })
        .sort(function (x, y) { return (y.w - y.e) - (x.w - x.e); })[0];
      if (best) {
        bits.push(t("insightBest", { zone: escapeHtml(ZONE_NAME[best.z].toLocaleLowerCase(locale())), w: best.w, e: best.e }));
      }
      if (bits.length) {
        lines.push('<li><b>' + escapeHtml(shortName(m, k)) + '</b> — ' + bits.join('; ') + '.</li>');
      }
    });
    if (!lines.length) return "";
    return '<ul class="zone-insights">' + lines.join("") + '</ul>';
  }

  function renderMomentsCard(m) {
    var moments = buildKeyMoments(m);
    if (!moments.length) return "";
    var MAX = 18;
    var shown = rankMoments(moments, MAX);
    return '<div class="moments-card">' +
      shown.map(function (mo) {
        return '<div class="moment t-' + mo.type + '">' +
          '<div class="ico">' + (MOMENT_ICON[mo.type] || "•") + '</div>' +
          '<div class="body"><div class="txt">' + mo.text + '</div>' +
          (mo.sub ? '<div class="sub">' + escapeHtml(mo.sub) + '</div>' : "") +
          '</div></div>';
      }).join("") +
      (moments.length > MAX ? '<div class="moments-more">' + t("momentsMore", { n: moments.length - MAX }) + '</div>' : "") +
      '</div>';
  }

  // Katlanır bölüm. Gövde yalnızca açıkken üretilir — kapalıyken ağır
  // çizimler (yüzlerce nokta, grafik) hiç oluşturulmaz.
  function renderSection(id, title, sub, bodyFn) {
    var open = !!openSections[id];
    return '<div class="sec' + (open ? " open" : "") + '">' +
      '<button class="sec-head" data-sec="' + id + '" aria-expanded="' + open + '" type="button">' +
        '<span class="sec-label"><span class="sec-title">' + escapeHtml(title) + '</span>' +
          (sub ? '<span class="sec-sub">' + escapeHtml(sub) + '</span>' : '') + '</span>' +
        '<span class="sec-caret" aria-hidden="true"></span>' +
      '</button>' +
      (open ? '<div class="sec-body">' + bodyFn() + '</div>' : '') +
    '</div>';
  }

  function renderStatsTab(m) {
    var filtered = statsSetFilter !== "all";
    var setNo = filtered ? Number(statsSetFilter) : null;
    var logArr = filtered ? m.log.filter(function (e) { return e.setIndex === setNo; }) : m.log;

    var statsSrc = m.stats;
    if (filtered) {
      var per = replayMatch(m).perSet;
      statsSrc = per[setNo] || { a: blankStats(), b: blankStats() };
    }
    var sa = statsSrc.a, sb = statsSrc.b;
    var totalA = sa.pointsWon, totalB = sb.pointsWon;
    var rows = buildStatRows(m, statsSrc, logArr);

    var withRally = logArr.filter(function (e) { return e.rally && e.rally > 0; });
    var rallyAvg = withRally.length ? Math.round((withRally.reduce(function (a, e) { return a + e.rally; }, 0) / withRally.length) * 10) / 10 : null;
    var rallyMaxEntry = withRally.length ? withRally.reduce(function (m1, e) { return e.rally > m1.rally ? e : m1; }) : null;

    // En uzun üst üste puan serisi
    var chronoAll = logArr.slice().reverse();
    var bestStreak = 0, bestKey = null, curKey = null, cur = 0;
    chronoAll.forEach(function (e) {
      if (e.pointWinner === curKey) cur++; else { curKey = e.pointWinner; cur = 1; }
      if (cur > bestStreak) { bestStreak = cur; bestKey = curKey; }
    });

    var dur = filtered ? setDuration(m, setNo) : matchDuration(m);
    var durLabel = filtered ? t("setDur", { n: setNo }) : t("matchDur");

    var chartPoints = buildMomentumChartPoints(m, logArr);
    lastMomentumPoints = openSections.momentum ? chartPoints : null;

    // Başlıklarda gösterilecek özetler (bölüm kapalıyken de bilinmeli).
    var locCount = logArr.filter(function (e) { return e.loc && e.loc.zone; }).length;
    var momentCount = (!filtered && m.log.length > 1) ? buildKeyMoments(m).length : 0;

    return (
      renderSetFilter(m) +
      '<div class="stats-summary">' +
        '<div class="card"><div class="n">' + totalA + '</div><div class="lbl">' + escapeHtml(t("totalPoints", { name: m.names.a })) + '</div></div>' +
        '<div class="card"><div class="n">' + totalB + '</div><div class="lbl">' + escapeHtml(t("totalPoints", { name: m.names.b })) + '</div></div>' +
        '<div class="card"><div class="n">' + fmtDuration(dur) + '</div><div class="lbl">' + durLabel + '</div></div>' +
        '<div class="card"><div class="n">' + (bestStreak > 1 ? bestStreak : "—") + '</div><div class="lbl">' + (bestKey && bestStreak > 1 ? t("longestStreakBy", { name: escapeHtml(shortName(m, bestKey)) }) : t("longestStreak")) + '</div></div>' +
        (m.mode === "simple" ? '' :
        '<div class="card"><div class="n">' + (rallyAvg !== null ? rallyAvg : "—") + '</div><div class="lbl">' + t("avgRally") + '</div></div>' +
        '<div class="card"><div class="n">' + (rallyMaxEntry ? rallyMaxEntry.rally : "—") + '</div><div class="lbl">' + (rallyMaxEntry ? t("longestRallyBy", { name: escapeHtml(shortName(m, rallyMaxEntry.pointWinner)) }) : t("longestRally")) + '</div></div>') +
      '</div>' +
      '<table class="stat-table">' +
        '<thead><tr><th></th><th>' + escapeHtml(shortName(m,"a")) + '</th><th>' + escapeHtml(shortName(m,"b")) + '</th></tr></thead>' +
        '<tbody>' +
        rows.map(function (r) {
          return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>';
        }).join("") +
        '</tbody>' +
      '</table>' +
      '<div class="sec-group">' +
        renderSection("momentum", t("secMomentum"),
          chartPoints.length > 1 ? t("secMomentumSub") : t("notEnough"),
          function () { return renderMomentumCard(m, chartPoints); }) +
        renderSection("shotmap", t("secShotmap"),
          locCount ? t("nShotLocs", { n: locCount }) : t("noZoneData"),
          function () { return renderShotMapCard(m, logArr); }) +
        (!filtered && momentCount
          ? renderSection("moments", t("secMoments"), t("nMoments", { n: momentCount }),
              function () { return renderMomentsCard(m); })
          : "") +
      '</div>' +
      (m.log.length ? '<button class="pdf-btn" data-share="1" type="button">' + t("shareMatchBtn") + '</button>' +
        (IS_NATIVE ? '' : '<button class="pdf-btn" id="pdfBtnStats" type="button">' + t("pdfReportBtn") + '</button><div class="pdf-hint">' + escapeHtml(t("pdfHint")) + '</div>') +
        '<button class="csv-btn" id="csvBtn" type="button">' + t("csvBtn") + '</button>' : "") +
      (viewingArchived ? "" : '<div class="archive-entry"><button id="openArchiveStats" type="button">' + t("archiveBtn") + '</button></div>') +
      renderResetRow() +
      langSwitchHtml("justify-content:center;margin-top:18px;")
    );
  }
  function fmtPct(won, total) {
    var p = pct(won, total);
    return p === null ? "—" : p + "% (" + total + ")";
  }

  function renderResetRow() {
    if (viewingArchived) return ""; // arşiv görünümünde üst çubuktaki "← Arşiv" yeterli
    if (resetConfirmPending) {
      return (
        '<div class="reset-row reset-row-confirm">' +

          '<button id="resetConfirmNo" class="reset-no" type="button">' + t("cancel") + '</button>' +
