  // ---------- Maç sonu PDF (yazdırma) raporu ----------
  // Artifact sayfası bir sandbox iframe içinde çalışıyor; o yüzden window.print()
  // ve sonuç ekranını doğrudan bu sayfada tetiklemek yerine, raporu ayrı bir
  // sekmede (gerçek bir üst düzey pencerede) açıp yazdırma orada tetikleniyor.
  function buildPrintDocHTML(m) {
    var rows = buildStatRows(m);
    var chartPoints = buildMomentumChartPoints(m);
    var dateStr = new Date().toLocaleDateString(locale(), { day: "2-digit", month: "long", year: "numeric" });
    var ruleTxt = (formatLabel(m) ? formatLabel(m) + " · " : "") + (m.noAd ? t("ruleNoAdShort") : t("ruleAdShort")) + " · " + t("nSets", { n: m.setsToPlay }) + (m.finalSetSuperTB ? t("finalSTBShort") : "");
    var scoreTxt = m.sets.map(function (s) {
      return s.superTB ? "[" + t("superTB") + " " + s.a + "–" + s.b + "]" : (s.a + "–" + s.b + (s.tb ? " (TB " + Math.min(s.tb.a, s.tb.b) + ")" : ""));
    }).join("   ");
    var winnerTxt = m.matchOver ? t("wonBy", { name: escapeHtml(m.names[m.winner]) }) : t("stillPlaying");
    var chartHtml = chartPoints.length > 1
      ? '<h2>' + t("secMomentum") + '</h2><div style="max-width:520px">' + buildMomentumChartSVG(chartPoints) + '</div>'
      : '';

    return (
      '<!doctype html><html lang="' + LANG + '"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + t("reportTitle") + '</title>' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">' +
      '<style>' +
        ':root{--bg:#ffffff;--panel:#ffffff;--panel-2:#f6f2e8;--text:#1c2a33;--text-dim:#5c6a72;--hairline:#cfc9ba;--brass:#a9793c;--clay:#a1503c;--grass:#4f7d61;--momentum-a:#8A7350;--momentum-b:#2f5878;}' +
        '*{box-sizing:border-box;}' +
        'body{font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;color:#1c2a33;background:#fff;padding:28px;max-width:640px;margin:0 auto;}' +
        'h1{font-family:"Fraunces",Georgia,serif;font-size:24px;margin:0 0 2px;}' +
        '.pr-sub{font-size:12px;color:#5c6a72;margin-bottom:18px;}' +
        '.pr-score{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600;margin-bottom:4px;}' +
        '.pr-sets{font-size:13px;color:#5c6a72;margin-bottom:20px;}' +
        'table{width:100%;border-collapse:collapse;margin-bottom:22px;}' +
        'th,td{padding:7px 6px;text-align:center;font-size:12.5px;border-bottom:1px solid #e2dccd;}' +
        'th:first-child,td:first-child{text-align:left;color:#5c6a72;}' +
        'h2{font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:600;margin:0 0 10px;}' +
        '.pr-footer{font-size:11px;color:#8a8378;margin-top:20px;}' +
        '.pr-hint{font-size:12px;color:#8a8378;margin-top:24px;padding-top:12px;border-top:1px solid #e2dccd;}' +
        '@media print{ .pr-hint{ display:none; } body{ padding:0; } }' +
      '</style></head><body>' +
      '<h1>' + t("reportTitle") + '</h1>' +
      '<div class="pr-sub">' + dateStr + ' · ' + ruleTxt + '</div>' +
      '<div class="pr-score">' + escapeHtml(m.names.a) + ' vs ' + escapeHtml(m.names.b) + '</div>' +
      '<div class="pr-sets">' + (scoreTxt || "—") + ' — ' + winnerTxt + '</div>' +
      '<h2>' + t("statsTitle") + '</h2>' +
      '<table>' +
        '<thead><tr><th></th><th>' + escapeHtml(shortName(m, "a")) + '</th><th>' + escapeHtml(shortName(m, "b")) + '</th></tr></thead>' +
        '<tbody>' +
        rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join("") +
        '</tbody>' +
      '</table>' +
      chartHtml +
      '<div class="pr-footer">' + t("reportFooter") + '</div>' +
      '<div class="pr-hint">' + escapeHtml(t("reportHint")) + '</div>' +
      '<script>window.onload=function(){ setTimeout(function(){ try{ window.print(); }catch(e){} }, 250); };<\/script>' +
      '</body></html>'
    );

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ---------- Arşiv gezinmesi ----------
  function openArchive() {
    // Canlı (devam eden) maç varsa kaybolmasın: hem arşive yaz hem kenarda tut.
    if (!viewingArchived && !state.setup && state.log && state.log.length) {
      archiveMatch(state);
      stashedState = state;
    }
    archiveOpen = true;
    render();
  }
  function closeArchive() {
    archiveOpen = false;
    if (viewingArchived) {
      viewingArchived = false;
      state = stashedState || freshMatch();
      stashedState = null;
      activeTab = "live";
      statsSetFilter = "all";
    }
    render();
  }
  function openArchivedMatch(archiveId) {
    var rec = loadArchive().filter(function (r) { return String(r.archiveId) === String(archiveId); })[0];
    if (!rec) return;
    if (!viewingArchived) stashedState = state; // canlı maçı sakla
    viewingArchived = true;
    archiveOpen = false;
    state = JSON.parse(JSON.stringify(rec));
    state.setup = false;
    activeTab = "stats";
    statsSetFilter = "all";
    render();
  }

  function startNewMatch() {
    clearOverlays();
    if (state.live && !viewingArchived) {
      var endedCode = state.live.code, endedSnap = JSON.parse(JSON.stringify(state));
      putLive(endedCode, endedSnap, true).catch(function () {});
      liveStatus = null; liveModalOpen = false;
    }
    resetConfirmPending = false;
    newMatchConfirm = false;
    // Yeni maça geçmeden önce mevcut maçı arşive al — hiçbir kayıt kaybolmasın.
    if (!viewingArchived && state.log && state.log.length) archiveMatch(state);
    viewingArchived = false;
    stashedState = null;
    zonePrompt = null; zonePick = null;
    clearPending();
    state = freshMatch();
    homeView = "setup";
    activeTab = "live";
    statsSetFilter = "all";
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    render();
  }

      };

      shotPlayerBtns[spb].onclick = function () {

      };

    var setFilterBtns = app.querySelectorAll("[data-setfilter]");

    var csvBtn = document.getElementById("csvBtn");

      csvBtn.onclick = function () { exportCSV(this); };
    }

    var tabButtons = app.querySelectorAll("[data-tab]");
    for (var i = 0; i < tabButtons.length; i++) {
      tabButtons[i].onclick = function () {
        activeTab = this.getAttribute("data-tab");
        pendingWinner = null; pendingActor = null; pendingOutcome = null; pendingShotType = null;
        resetConfirmPending = false;
        render();
      };
    }
    var winnerButtons = app.querySelectorAll("[data-winner]");
    for (var j = 0; j < winnerButtons.length; j++) {
      winnerButtons[j].onclick = function () {
        var k = this.getAttribute("data-winner");
        pendingWinner = (pendingWinner === k) ? null : k;
        render();
      };
    }
    var actorButtons = app.querySelectorAll("[data-actor]");
    for (var ac = 0; ac < actorButtons.length; ac++) {
      actorButtons[ac].onclick = function () {
        pendingActor = this.getAttribute("data-actor");
        if (pendingOutcome) { logCurrentPoint(); return; }
        render();
      };
    }
    var outcomeButtons = app.querySelectorAll("[data-outcome]");
    for (var o = 0; o < outcomeButtons.length; o++) {
      outcomeButtons[o].onclick = function () {
        var v = this.getAttribute("data-outcome");
        pendingOutcome = (pendingOutcome === v) ? null : v;
        pendingShotType = null;
        pendingActor = null; // sonuç değişince "kim yaptı" yeniden sorulur
        // Ace ve çift hatayı her zaman servis atan yapar: başka soru yok, hemen kaydet.
        if (pendingOutcome && AUTO_ACTOR_OUTCOMES.indexOf(pendingOutcome) !== -1) { logCurrentPoint(); return; }
        render();
      };
    }
    var shotButtons = app.querySelectorAll("[data-shot]");
    for (var st = 0; st < shotButtons.length; st++) {
      shotButtons[st].onclick = function () {
        var v = this.getAttribute("data-shot");
        pendingShotType = (pendingShotType === v) ? null : v;
        render();
      };
    }
    var rallyBtn = document.getElementById("rallyBtn");
    if (rallyBtn) {
      rallyBtn.onclick = function () {
        pendingRally++;
        if (pendingRally === 2) {
          // Ralli 2 vuruşa ulaştı: ace/çift hata artık mümkün değil, o seçenekler kalkıyor.
          if (pendingOutcome === "ace" || pendingOutcome === "double_fault") pendingOutcome = null;
          render();
          return;
        }
        if (pendingRally === 3) {
          // Return oynandı: return hatası seçeneği kalkar.
          if (pendingOutcome === "return_error") pendingOutcome = null;
          render();
          return;
        }
        var numEl = document.getElementById("rallyNum");
        if (numEl) numEl.textContent = pendingRally;
      };
    }
    var serveButtons = app.querySelectorAll("[data-serve]");
    for (var sv = 0; sv < serveButtons.length; sv++) {
      serveButtons[sv].onclick = function () {
        var toSecond = this.getAttribute("data-serve") === "2";
        // 1. servisten 2. servise geçilince ralli sayacı sıfırlanır (1. serviste sayılan vuruşlar geçersiz).
        if (toSecond && !pendingSecondServe) pendingRally = 0;
        pendingSecondServe = toSecond;
        // Çift hata sadece ikinci serviste geçerli; 1. servise dönülünce temizle.
        if (!toSecond && pendingOutcome === "double_fault") pendingOutcome = null;
        render();
      };
    }
    // "Puanı kaydet" düğmesi yok: son gerekli seçim yapılınca puan kendiliğinden kaydedilir.
    function logCurrentPoint() {
      (function () {
        if (!pendingOutcome) return;
        var actor = resolvedActor(state, pendingOutcome);
        if (!actor) return;
        // Puanı kimin aldığı, vuruşu yapan + sonuçtan çıkıyor.
        var winnerKey = winnerFromActor(actor, pendingOutcome);
        // Bölge takibi hızlı modda ve ace/çift hatada sorulmuyor.
        if (!quickMode && ZONE_ASK_OUTCOMES.indexOf(pendingOutcome) !== -1) {
          zonePrompt = {
            winner: winnerKey, outcome: pendingOutcome, rally: pendingRally,
            secondServe: pendingSecondServe, shotType: pendingShotType
          };
          zonePick = null;
          render();
          return;
        }
        logPoint(state, winnerKey, pendingOutcome, null, pendingRally, pendingSecondServe, quickMode ? null : pendingShotType);
        markJustLogged();
        clearPending();
        saveState();
        if (state.matchOver && !viewingArchived) archiveMatch(state);
        render();
      })();
    }
    var simpleBtns = app.querySelectorAll("[data-simplewin]");
    for (var sw = 0; sw < simpleBtns.length; sw++) {
      simpleBtns[sw].onclick = function () {
        logPoint(state, this.getAttribute("data-simplewin"), null, null, 0, false, null);
        markJustLogged();
        clearPending();
        saveState();
        if (state.matchOver && !viewingArchived) archiveMatch(state);
        render();
      };
    }
    var lastOutBtns = app.querySelectorAll("[data-lastout]");
    for (var lo = 0; lo < lastOutBtns.length; lo++) {
      lastOutBtns[lo].onclick = function () {
        var o = this.getAttribute("data-lastout");
        setLastOutcome(state.log[0] && state.log[0].outcome === o ? null : o);
        saveState();
        render();
      };
    }
    var firstServerBtns = app.querySelectorAll("[data-firstserver]");
    for (var fs = 0; fs < firstServerBtns.length; fs++) {
      firstServerBtns[fs].onclick = function () {
        state.server = this.getAttribute("data-firstserver");
        state.needsServer = false;
        saveState();
        render();
      };
    }

    var zoneCourt = document.getElementById("zoneCourt");
    if (zoneCourt) {
      zoneCourt.onclick = function (ev) {
        var p = svgPointFromEvent(this, ev, HCRT.W, HCRT.H);
        if (!p || !zonePrompt) return;
        if (zoneSaving) return;
        zonePick = zoneFromHalfPoint(p.x, p.y, pointActor(zonePrompt.winner, zonePrompt.outcome));
        render();
        // Seçilen nokta bir an görünsün, pencere hızlıca solsun, sonra kaydet.
        zoneSaving = true;
        var promptAtTap = zonePrompt;
        setTimeout(function () {
          var mdl = document.getElementById("zoneModal");
          if (mdl && zonePrompt === promptAtTap) mdl.classList.add("fading");
        }, 220);
        setTimeout(function () {
          zoneSaving = false;
          if (zonePrompt === promptAtTap && zonePick) commitPendingPoint(zonePick);
        }, 520);
      };
    }

    var zoneSkip = document.getElementById("zoneSkip");
    if (zoneSkip) zoneSkip.onclick = function () { commitPendingPoint(null); };
    var zoneModal = document.getElementById("zoneModal");
    if (zoneModal) {
      zoneModal.onclick = function (ev) {
        // Karartılmış alana dokunmak vazgeçer (puan kaydedilmez, seçimler durur).
        if (ev.target === this) { zonePrompt = null; zonePick = null; render(); }
      };
    }
    var quickModeToggle = document.getElementById("quickModeToggle");
    if (quickModeToggle) {
      quickModeToggle.onclick = function () {
        quickMode = !quickMode;
        saveQuickMode(quickMode);
        pendingShotType = null;
        render();
      };
    }
    var undoBtn = document.getElementById("undoBtn");
    if (undoBtn) { undoBtn.onclick = function () { clearOverlays(); undoLastPoint(); saveState(); }; }

    var pdfHandler = function () {
      var docHtml = buildPrintDocHTML(state);
      var win = null;
      try { win = window.open("", "_blank"); } catch (e) { win = null; }
      if (win) {
        win.document.open();
        win.document.write(docHtml);
        win.document.close();
      } else {
        // Yeni sekme engellendiyse kullanıcıyı bilgilendir.
        var hintEl = document.querySelector(".pdf-hint");
        if (hintEl) hintEl.textContent = t("popupBlocked");
      }
    };
    var pdfBtnBanner = document.getElementById("pdfBtnBanner");
    if (pdfBtnBanner) pdfBtnBanner.onclick = pdfHandler;
    var pdfBtnStats = document.getElementById("pdfBtnStats");
    if (pdfBtnStats) pdfBtnStats.onclick = pdfHandler;

    var resetBtn = document.getElementById("resetBtn");
    if (resetBtn) {
      resetBtn.onclick = function () {
        resetConfirmPending = true;
        render();
      };
    }
    var resetYes = document.getElementById("resetConfirmYes");
    if (resetYes) {
      resetYes.onclick = function () { startNewMatch(); };
    }
    var goHomeBtn = document.getElementById("goHomeBtn");
    if (goHomeBtn) goHomeBtn.onclick = function () { homeOpen = true; homeView = "hub"; zonePrompt = null; zonePick = null; render(); };
    var newBtns = app.querySelectorAll("[data-newmatch]");
    for (var nb = 0; nb < newBtns.length; nb++) {
      newBtns[nb].onclick = function () {
        // Yanlışlıkla dokunmaya karşı her durumda onay sorulur.
        newMatchConfirm = true;
        render();
      };
    }
    var nmYes = document.getElementById("newMatchYes");
    if (nmYes) nmYes.onclick = function () { startNewMatch(); };
    var nmNo = document.getElementById("newMatchNo");
    if (nmNo) nmNo.onclick = function () { newMatchConfirm = false; render(); };
    var nmModal = document.getElementById("newMatchModal");
    if (nmModal) nmModal.onclick = function (ev) { if (ev.target === this) { newMatchConfirm = false; render(); } };
    var resetNo = document.getElementById("resetConfirmNo");
    if (resetNo) {
      resetNo.onclick = function () {
        resetConfirmPending = false;
        render();
      };
    }
  }


  // ---------- Açılış animasyonu ----------
  function showIntro() {
    if (!IS_NATIVE) return;
    var reduce = false;
    try { reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    var el = document.createElement("div");
    el.className = "intro";
    el.setAttribute("aria-hidden", "true");
    // Uygulama ikonuyla aynı çizim (512'lik koordinatlarda).
    el.innerHTML =
      '<svg class="intro-ball" viewBox="0 0 512 512">' +
        '<defs><clipPath id="introClip"><circle cx="256" cy="256" r="172"/></clipPath></defs>' +
        '<circle cx="256" cy="256" r="188.5" fill="none" stroke="#C79A54" stroke-width="7"/>' +
        '<circle cx="256" cy="256" r="172" fill="#CFE21B"/>' +
        '<g clip-path="url(#introClip)" fill="none" stroke="#F7FBDC" stroke-width="18">' +
          '<circle cx="43.4" cy="256" r="151.6"/><circle cx="468.6" cy="256" r="151.6"/>' +
        '</g>' +
      '</svg>' +
      '<div class="intro-word">Courtside</div>';
    document.body.appendChild(el);
    var done = false;
    function finish() {
      if (done) return; done = true;
      el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
    }
    el.addEventListener("click", finish);
    setTimeout(finish, reduce ? 500 : 1450);
  }

  // ================= Turlar ve sonuç raporu (görsel + PDF) =================
  // Tur, tablodaki aşama olarak saklanır (Son 32, Çeyrek final…). "Kaçıncı tur" olduğu ana
  // tablonun büyüklüğüne göre hesaplanır: 32'lik tabloda Son 32 = 1. Tur, 64'lükte 2. Tur.
  // r1/r2/r3 önceki sürümden kalan eski kayıtlar için.
  var DRAW_SIZES = [8, 16, 32, 64, 128, "wk"]; // "wk": hafta sonu turnuvası, her oyuncu 4 maç
  var STAGE_SIZE = { r128: 128, r64: 64, r32: 32, r16: 16, qf: 8, sf: 4, f: 2 };
  var ROUND_ORDER = { m1: 1, m2: 2, m3: 3, m4: 4, q: -1, grp: 0, r1: 1, r2: 2, r3: 3, r128: 1, r64: 2, r32: 3, r16: 4, qf: 5, sf: 6, p3: 6.5, f: 7 };
  var ROUND_KEY = { m1: "rdM1", m2: "rdM2", m3: "rdM3", m4: "rdM4", q: "rdQ", grp: "rdGrp", r1: "rdR1", r2: "rdR2", r3: "rdR3", r128: "rdR128", r64: "rdR64", r32: "rdR32", r16: "rdR16", qf: "rdQF", sf: "rdSF", p3: "rdP3", f: "rdF" };
  function roundsForDraw(draw) {
    if (draw === "wk") return ["m1", "m2", "m3", "m4"];
    var out = ["q", "grp"];
    ["r128", "r64", "r32", "r16", "qf", "sf"].forEach(function (k) { if (!draw || STAGE_SIZE[k] <= draw) out.push(k); });
    return out.concat(["p3", "f"]);
  }
  function roundLabel(r, draw) {
    if (!ROUND_KEY[r]) return "";
    var base = t(ROUND_KEY[r]);
    if (draw && STAGE_SIZE[r] && STAGE_SIZE[r] >= 16 && STAGE_SIZE[r] <= draw) {
      var n = Math.round(Math.log(draw / STAGE_SIZE[r]) / Math.LN2) + 1;
      return t("rdNth", { n: n }) + " · " + base;
    }
    return base;
  }
  function roundShort(r, draw) { // seçim düğmeleri için kısa hali
    if (draw && STAGE_SIZE[r] && STAGE_SIZE[r] >= 16 && STAGE_SIZE[r] <= draw) return t("rdNth", { n: Math.round(Math.log(draw / STAGE_SIZE[r]) / Math.LN2) + 1 }) + " (" + STAGE_SIZE[r] + ")";
    return roundLabel(r);
  }
  function validRound(r) { return ROUND_KEY.hasOwnProperty(r) ? r : ""; }
  function drawOf(m) {
    return (m && m.rules && m.rules.draw) || (m && m.draw) ||
      (eventState && eventState.rules && eventState.rules.draw) ||

      });

  // --- Tek sayfalık PDF (içinde JPEG) ---
  function b64ToBytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

    push("%PDF-1.4\n%âãÏÓ\n");

    obj(2, function () { push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"); });
    obj(3, function () { push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pw + " " + ph + "] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>"); });

  // --- Paylaşma penceresi ---
  var repModal = null; // { data, png, cv, busy, status }
  function reportFileBase(data) {
    return "courtside-" + String(data.title || "rapor").toLocaleLowerCase("tr").replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + ymd(new Date());
  }
  function openReport(data) {

  function renderReportModal() {

  function setRepStatus(msg) { if (!repModal) return; repModal.status = msg; var s = document.getElementById("repStatus"); if (s) s.textContent = msg; }
  function shareReportFile(kind) {
    if (!repModal || !repModal.cv) return;
    var base = reportFileBase(repModal.data), name, b64, mime;
    if (kind === "pdf") {
      var jpg = repModal.cv.toDataURL("image/jpeg", 0.92).split(",")[1];
      var pdf = jpegToPdf(b64ToBytes(jpg), repModal.cv.width, repModal.cv.height);
      name = base + ".pdf"; b64 = bytesToB64(pdf); mime = "application/pdf";
    } else {
      name = base + ".png"; b64 = repModal.png.split(",")[1]; mime = "image/png";
    }

    // iOS uygulaması: dosyayı yaz, paylaşım menüsünü aç
    var fs = nativePlugin("Filesystem"), sh = nativePlugin("Share");

      fs.writeFile({ path: name, data: b64, directory: "CACHE" }).then(function (res) {

      }).catch(function (err) { if (!isShareCancel(err)) setRepStatus(t("fileSaveFail")); });

  // ================= Oyuncularım: antrenörün oyuncuları ve profil raporu =================
  // Oyuncu listesi kayıtlı oyuncularla aynıdır. Profil, arşivdeki bütün maçları (maç takibi

  var playersOpen = false;      // Oyuncularım ekranları açık mı

  function nameKey(n) { return String(n || "").trim().toLocaleLowerCase("tr"); }

      .filter(Boolean)
      .sort(function (x, y) { return (y.r.startedAt || 0) - (x.r.startedAt || 0); });
  }
  function playerSummary(list) {
    var o = { n: 0, w: 0, l: 0, sw: 0, sl: 0, unfinished: 0, tours: {}, byes: 0 };
    list.forEach(function (it) {
      var r = it.r, k = it.k, ok = otherKey(k);
      if (r.eventName) o.tours[r.eventName] = 1;
      if (r.special === "bye") { o.byes++; return; } // bye maç sayılmaz
      o.n++;
      if (r.matchOver) { if (r.winner === k) o.w++; else o.l++; } else o.unfinished++;
      (r.sets || []).forEach(function (s) { if (s[k] > s[ok]) o.sw++; else if (s[ok] > s[k]) o.sl++; });
      if (r.eventName) o.tours[r.eventName] = 1;
    });
    o.pct = (o.w + o.l) ? Math.round(o.w / (o.w + o.l) * 100) : null;

  var CAL_URL = "https://raw.githubusercontent.com/ogiterzi/Kort-Kenari/main/data/takvim.json";

  try { calFavs = JSON.parse(localStorage.getItem(CAL_FAV_KEY) || "[]").map(String); } catch (e) { calFavs = []; }
  function calIsFav(id) { return calFavs.indexOf(String(id)) !== -1; }

  var calCities = [], calCityOpen = false, calAnnId = null;

  // adresin özeti tutulur. Yeni bir hesap eklemek için: calHash("adres@ornek.com") sonucunu listeye ekle.
  var CAL_ANN_ALLOWED = [7613280157632713, 8326836595582892, 7576876386092043];
  function calHash(str) { // cyrb53
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57, ch;
    for (var i = 0; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  // ================= Turnuva modu: birden çok maçı oyun oyun takip et =================
  // Yönetici turnuvayı adı ve kurallarıyla kurar, günlere maç programı girer (ileri tarih
  // dahil), maç sırasında her oyunda tek dokunuşla skor işler. Turnuva başına tek canlı
  // link: veliler bütün günleri ve kortları görür. Biten maçlar arşive düşer.
  var TOURN_KEY = "courtside-tournaments-v1";
  var OLD_EVENT_KEY = "courtside-event-v1";
  var FAV_KEY = "courtside-evfav-v1";
  var DEFAULT_RULES = { preset: "standard", noAd: false, sets: 3, finalSTB: false };

  function rulesFmt(r) {
    r = r || DEFAULT_RULES;
    if (r.preset === "proset") return { sets: 1, target: 8, tbAt: 8, stb: false };
    var tgt = r.preset === "fast4" ? 4 : 6; // Fast4: 3-3'te set 5'e uzar, 4-4'te 7'lik tie-break
    return { sets: r.sets === 5 ? 5 : 3, target: tgt, tbAt: tgt, stb: !!r.finalSTB };
  }
  function rulesLabel(r) {
    r = r || DEFAULT_RULES;
    var bits = [r.preset === "fast4" ? "Fast4" : (r.preset === "proset" ? "Pro Set" : t("rStandard"))];
    if (r.preset !== "proset") { bits.push(t("rSets", { n: r.sets === 5 ? 5 : 3 })); if (r.finalSTB) bits.push(t("rFinalSTB")); }
    if (r.draw) bits.push(r.draw === "wk" ? t("rDrawWk") : t("rDraw", { n: r.draw }));
    return bits.join(" · ");
  }
  function evFmt(m) { return rulesFmt(m.rules || (eventState && eventState.rules)); }

  // --- Tarih yardımcıları (yerel gün, "YYYY-AA-GG") ---
  function ymd(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function todayStr() { return ymd(new Date()); }
  function dayFromStr(s) { var p = String(s || "").split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
  function dayOffset(s) { return Math.round((dayFromStr(s) - dayFromStr(todayStr())) / 86400000); }
  function dayLabel(s) {
    var off = dayOffset(s);
    if (off === 0) return t("evToday");
    if (off === 1) return t("evTomorrow");
    if (off === -1) return t("evYesterday");
    try { return dayFromStr(s).toLocaleDateString(locale(), { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return s; }
  }
  function validDay(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }

  // --- Kalıcı kayıt ---
  function loadTournaments() {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(TOURN_KEY) || "[]"); } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    // Önceki "Maç günü" sürümünden kalan etkinliği turnuvaya çevir.
    try {
      var old = JSON.parse(localStorage.getItem(OLD_EVENT_KEY) || "null");
      if (old && Array.isArray(old.matches)) {
        var d = ymd(new Date(old.createdAt || Date.now()));
        old.name = old.name || "Turnuva"; old.rules = old.rules || DEFAULT_RULES;
        old.matches.forEach(function (m) { m.date = m.date || d; m.rules = m.rules || DEFAULT_RULES; delete m.fmt; });
        arr.push(old);
        localStorage.setItem(TOURN_KEY, JSON.stringify(arr));
        localStorage.removeItem(OLD_EVENT_KEY);
      }
    } catch (e) {}
    return arr.filter(function (x) { return x && Array.isArray(x.matches); });
  }
  var tournaments = loadTournaments();
  var eventState = null;        // açık turnuva (tournaments içindeki nesne)
  var eventOpen = false;        // Turnuva ekranları açık mı
  var evRulesForm = null;       // {mode:"create"|"edit", d:{name, preset, noAd, sets, finalSTB}, err}
  var evDay = todayStr();       // yöneticinin baktığı gün
  var evModal = null;           // {kind:"add"|"edit"|"tb"|"live"|"stop"|"finish", ...}
  var evPush = {};              // turnuva id → {timer, retry, busy, again}
  var evStatus = {};            // turnuva id → null | "starting" | "ok" | "offline" | "error"

  function saveTournaments() {
    try { localStorage.setItem(TOURN_KEY, JSON.stringify(tournaments)); } catch (e) {}
  }
  function saveEvent() {
    saveTournaments();
    if (eventState && eventState.live) scheduleEventPush(eventState);
  }
  function evName(ev) { return (ev && ev.name || "").trim() || t("evTitle"); }
  function evFind(id) {
    if (!eventState) return null;
    for (var i = 0; i < eventState.matches.length; i++) if (String(eventState.matches[i].id) === String(id)) return eventState.matches[i];
    return null;
  }

  // --- Skor motoru (oyun seviyesinde) ---
  function evSetsWon(m, k) { return m.sets.filter(function (s) { return s[k] > s[otherKey(k)]; }).length; }
  function evInTB(m) {
    var f = evFmt(m);
    return !m.stbNow && m.status === "live" && m.g.a === f.tbAt && m.g.b === f.tbAt;
  }
  function evSnapshot(m) {
    m.hist = m.hist || [];
    m.hist.push(JSON.stringify({ sets: m.sets, g: m.g, p: m.p, stbNow: m.stbNow, status: m.status, winner: m.winner, special: m.special || "", retG: m.retG || null, b: m.b }));
    if (m.hist.length > 40) m.hist.shift();
  }
  function evAfterSet(m) {
    var f = evFmt(m), need = Math.ceil(f.sets / 2);
    m.g = { a: 0, b: 0 }; m.p = { a: 0, b: 0 }; m.stbNow = false;
    ["a", "b"].forEach(function (k) { if (evSetsWon(m, k) >= need) { m.status = "done"; m.winner = k; } });
    if (m.status === "done") { m.endedAt = Date.now(); return; }
    if (f.stb && m.sets.length === f.sets - 1 && evSetsWon(m, "a") === evSetsWon(m, "b")) m.stbNow = true;
  }
  function evAddGame(m, k, tbLoser) {
    if (m.status === "done") return;
    var f = evFmt(m), o = otherKey(k);
    evSnapshot(m);
    if (m.status !== "live") { m.status = "live"; m.startedAt = m.startedAt || Date.now(); }
    if (m.stbNow) {
      m.p[k]++;
      if (m.p[k] >= 10 && m.p[k] - m.p[o] >= 2) { m.sets.push({ a: m.p.a, b: m.p.b, superTB: true }); evAfterSet(m); }
    } else if (evInTB(m)) {
      var s = { a: m.g.a, b: m.g.b }; s[k]++;
      if (tbLoser !== null && tbLoser !== undefined) { var tb = {}; tb[o] = tbLoser; tb[k] = Math.max(7, tbLoser + 2); s.tb = tb; }
      m.sets.push(s); evAfterSet(m);
    } else {
      m.g[k]++;
      if (m.g[k] >= f.target && m.g[k] - m.g[o] >= 2) { m.sets.push({ a: m.g.a, b: m.g.b }); evAfterSet(m); }
    }
    m.updatedAt = Date.now();
    evAfterChange(m);
  }
  function evUndo(m) {
    if (!m.hist || !m.hist.length) return;
    var wasDone = m.status === "done";
    var s = JSON.parse(m.hist.pop());
    m.sets = s.sets; m.g = s.g; m.p = s.p; m.stbNow = s.stbNow; m.status = s.status; m.winner = s.winner;
    m.special = s.special || ""; m.retG = s.retG || null; if (s.b !== undefined) m.b = s.b;
    if (m.status !== "done") m.endedAt = null;
    m.updatedAt = Date.now();
    if (wasDone && m.status !== "done") deleteArchived(evArchiveId(m));
    evAfterChange(m);
  }
  function evAfterChange(m) {
    if (m.status === "done") evArchive(m);
    saveEvent();
  }

  // "6-4 3-2", "7-6(5) 6-7(3) 10-8" gibi yazılmış skoru çözer. Hatalıysa null.
  function evParseScore(str, rules) {
    var f = rulesFmt(rules);
    var toks = String(str || "").trim().split(/[\s,;]+/).filter(Boolean);
    var m = { rules: rules, sets: [], g: { a: 0, b: 0 }, p: { a: 0, b: 0 }, stbNow: false, status: "sched", winner: null };
    if (!toks.length) return m;
    m.status = "live";
    for (var i = 0; i < toks.length; i++) {
      if (m.status === "done") return null;
      var mt = /^\[?(\d{1,2})[-–:/](\d{1,2})\]?(?:\((\d{1,2})\))?$/.exec(toks[i]);
      if (!mt) return null;
      var a = +mt[1], b = +mt[2], tbp = mt[3] !== undefined ? +mt[3] : null;
      var last = i === toks.length - 1;
      var hi = Math.max(a, b), lo = Math.min(a, b), k = a > b ? "a" : "b";
      if (m.stbNow) {
        if (hi >= 10 && hi - lo >= 2) { m.sets.push({ a: a, b: b, superTB: true }); evAfterSet(m); continue; }
        if (!last) return null;
        m.p = { a: a, b: b }; continue;
      }
      var isTB = hi === f.tbAt + 1 && lo === f.tbAt;
      var done = (hi === f.target && lo <= f.target - 2) || (hi === f.target + 1 && lo === f.target - 1) || isTB;
      if (done) {
        var s = { a: a, b: b };
        if (isTB && tbp !== null) { var tb = {}; tb[otherKey(k)] = tbp; tb[k] = Math.max(7, tbp + 2); s.tb = tb; }
        m.sets.push(s); evAfterSet(m); continue;
      }
      var partialOk = hi < f.target || (hi === f.target && lo >= f.target - 1);
      if (!last || !partialOk) return null;
      m.g = { a: a, b: b };
    }
    return m;
  }
  function evScoreText(m) {
    if (m.special === "bye" || m.special === "wo") return "";
    var parts = m.sets.map(function (s) {
      if (s.superTB) return s.a + "-" + s.b;
      return s.a + "-" + s.b + (s.tb ? "(" + Math.min(s.tb.a, s.tb.b) + ")" : "");
    });
    if (m.status === "live") parts.push(m.stbNow ? m.p.a + "-" + m.p.b : m.g.a + "-" + m.g.b);
    if (m.special === "ret" && m.retG && (m.retG.a || m.retG.b)) parts.push(m.retG.a + "-" + m.retG.b);
    return parts.join(" ");
  }

  // --- Arşiv ---
  function evArchiveId(m) { return "ev" + m.id; }
  function evArchive(m) {
    if (!spOf(m) && !m.sets.length && !m.g.a && !m.g.b) return;
    var r = m.rules || DEFAULT_RULES, f = rulesFmt(r);
    var rec = freshMatch({ a: m.a, b: m.b }, !!r.noAd, f.sets === 5 ? 5 : 3, f.stb,
      { setGamesTarget: f.target, setWinByTwo: true, tbTriggerAt: f.tbAt, forceSingleSet: f.sets === 1, mode: "simple" });
    rec.setup = false;
    rec.sets = JSON.parse(JSON.stringify(m.sets));
    if (m.status !== "done") rec.games = { a: m.g.a, b: m.g.b };
    rec.matchOver = m.status === "done";
    rec.winner = m.winner || null;
    rec.startedAt = m.startedAt || m.createdAt || Date.now();
    rec.archiveId = evArchiveId(m);
    rec.archivedAt = Date.now();
    rec.abandoned = !rec.matchOver;
    rec.scoreOnly = true;
    rec.court = courtLabel(m.court);
    rec.round = m.round || "";
    rec.special = spOf(m);
    rec.retG = m.retG || null;
    rec.draw = drawOf(m);
    rec.eventName = eventState ? evName(eventState) : "";
    var arr = loadArchive().filter(function (x) { return x.archiveId !== rec.archiveId; });
    arr.unshift(rec);
    arr.sort(function (x, y) { return (y.startedAt || 0) - (x.startedAt || 0); });
    if (arr.length > ARCHIVE_MAX) arr = arr.slice(0, ARCHIVE_MAX);
    writeArchive(arr);
  }

  // --- Yayın (turnuva başına bir link) ---
  function evPublic(ev) {
    return {
      v: 2, n: evName(ev), r: ev.rules || DEFAULT_RULES,
      m: ev.matches.map(function (m) {
        var o = { i: m.id, dt: m.date, c: m.court || "", tm: m.time || "", a: m.a, b: m.b, st: m.status, s: m.sets, u: m.updatedAt || 0, rd: m.round || "" };
        if (spOf(m)) { o.sp = m.special; if (m.retG) o.rg = m.retG; }
        if (m.status === "live") { o.g = m.g; if (m.stbNow) { o.stb = 1; o.p = m.p; } if (evInTBOf(ev, m)) o.tb = 1; }
        if (m.winner) o.w = m.winner;
        return o;
      })
    };
  }
  function evInTBOf(ev, m) {
    var f = rulesFmt(m.rules || ev.rules);
    return !m.stbNow && m.status === "live" && m.g.a === f.tbAt && m.g.b === f.tbAt;
  }
  function putEventLive(ev, code, ended) {
    var body = "E" + JSON.stringify(evPublic(ev));
    return getIdToken().then(function (a) {
      return fetch(FB.db + "/live/" + code + ".json?auth=" + encodeURIComponent(a.idToken), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ owner: a.uid, c: body, t: { ".sv": "timestamp" }, ended: !!ended })
      }).then(function (r) { if (!r.ok) throw new Error("put " + r.status); });
    });
  }
  function pushSlot(ev) { return evPush[ev.id] || (evPush[ev.id] = { timer: null, retry: null, busy: false, again: false }); }

  // --- Veli (izleyici) ekranı ---
  function loadFavs() { try { var a = JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function saveFavs(a) { try { localStorage.setItem(FAV_KEY, JSON.stringify(a.slice(-40))); } catch (e) {} }
  var evViewTimer = null, viewDay = null;
  function evFromPublic(o) {
    if (!o || !Array.isArray(o.m)) return null;
    var fallbackDay = ymd(new Date(o.d || Date.now()));
    return {
      name: String(o.n || ""), rules: o.r && typeof o.r === "object" ? o.r : null,
      matches: o.m.slice(0, 400).map(function (x) {
        return { id: x.i, date: validDay(x.dt) ? x.dt : fallbackDay, court: String(x.c || ""), time: String(x.tm || ""), a: String(x.a || "A"), b: String(x.b || "B"), round: validRound(x.rd), special: spOf({ special: x.sp }), retG: x.rg && typeof x.rg === "object" ? { a: +x.rg.a || 0, b: +x.rg.b || 0 } : null,
          status: x.st === "live" || x.st === "done" ? x.st : "sched",
          sets: Array.isArray(x.s) ? x.s : [], g: x.g || { a: 0, b: 0 }, p: x.p || { a: 0, b: 0 }, stbNow: !!x.stb, tbNow: !!x.tb,
          winner: x.w === "a" || x.w === "b" ? x.w : null, updatedAt: x.u || 0 };

  function evViewerCard(m, favs) {

      : (m.status === "live" && m.tbNow ? '<span class="ev-tag">' + t("evTB") + '</span>' : '');

      '<div class="ev-head"><span class="ev-meta">' + evMeta(m) + '</span>' + tag +

  function defaultViewDay(days) {

  function renderEventViewer() {
    var ev = liveView.event, st = liveView.status, favs = loadFavs();

    var rest = list.filter(function (m) { return favs.indexOf(String(m.id)) === -1; });
    var g = evGroups(rest);
    var card = function (m) { return evViewerCard(m, favs); };

  // ================= Yoklama: antrenörün grupları ve günlük yoklama =================
  // Antrenör grup açar, öğrencileri ekler; yoklamada isme bir dokunuş "geldi", ikinci
  // dokunuş "aynı gün 2. antrenman", üçüncü dokunuş sıfırlar. O günün antrenman sayısı,
  // öğrencilerin toplamı değil, o gün en çok kaç kez gelindiğidir (biri 2 ise gün 2 antrenman).
  // Kayıt biçimi: { groups: [{id, name, time, kids:[ad], createdAt}], att: {grupId: {"YYYY-AA-GG": {ad: 1|2}}} }
  var YK_KEY = "courtside-attendance-v1";
  function loadYk() {
    var d = null;
    try { d = JSON.parse(localStorage.getItem(YK_KEY) || "null"); } catch (e) { d = null; }
    if (!d || typeof d !== "object") d = {};
    if (!Array.isArray(d.groups)) d.groups = [];
    if (!d.att || typeof d.att !== "object") d.att = {};
    d.groups = d.groups.filter(function (g) { return g && g.id && typeof g.name === "string"; });
    d.groups.forEach(function (g) { if (!Array.isArray(g.kids)) g.kids = []; });
    return d;
  }
  var yk = loadYk();
  function saveYk() { try { localStorage.setItem(YK_KEY, JSON.stringify(yk)); } catch (e) {} }

  var ykOpen = false;       // Yoklama ekranları açık mı
  var ykGroupId = null;     // açık grup
  var ykTab = "day";        // "day" | "month" | "kids"
  var ykKid = null;         // açık öğrenci (takvim)
  var ykDay = todayStr();   // yoklamadaki gün
  var ykMonth = todayStr().slice(0, 7); // ay özetindeki ay
  var ykForm = null;        // yeni grup formu: {name, time, err}
  var ykLast = null;        // geri al için son dokunuş: {gid, day, name, before}
  var ykToast = null, ykToastTimer = null;
  var ykArm = null;         // silme onayı bekleyen: "g" (grup) ya da öğrenci adı
  var ykStatus = "";
  var ykEditing = null;     // adı düzenlenen öğrenci
  var ykEditErr = "";

  // Öğrencinin adını değiştirir; bütün günlerdeki yoklaması yeni ada taşınır.
  function ykRenameKid(g, oldName, newName) {
    newName = String(newName || "").replace(/\s+/g, " ").trim().slice(0, 32);
    if (!newName) return t("ykNeedKidName");
    if (newName === oldName) return "";
    var clash = g.kids.some(function (n) { return n !== oldName && nameKey(n) === nameKey(newName); });
    if (clash) return t("ykNameTaken");
    g.kids = g.kids.map(function (n) { return n === oldName ? newName : n; });
    var a = yk.att[g.id] || {};
    Object.keys(a).forEach(function (day) {
      var m = a[day];
      if (m && m.hasOwnProperty(oldName)) {
        m[newName] = Math.max(m[newName] || 0, m[oldName] || 0);
        delete m[oldName];
      }
    });
    saveYk();
    if (ykKid === oldName) ykKid = newName;
    return "";
  }
  function ykEditForm(name) {
    return '<div class="yk-edit">' +
      '<label class="yk-note" for="ykEditInput">' + t("ykKidName") + '</label>' +
      '<div class="pl-addrow" style="margin:0"><input id="ykEditInput" type="text" maxlength="32" autocomplete="off" autocorrect="off" spellcheck="false" value="' + escapeAttr(name) + '">' +
      '<button class="btn-primary" id="ykEditSave" type="button">' + t("ykSave") + '</button></div>' +
      (ykEditErr ? '<div class="share-status err">' + escapeHtml(ykEditErr) + '</div>' : '') +
      '<button class="share-close" id="ykEditCancel" type="button">' + t("cancel") + '</button></div>';
  }

  function ykGroup() {
    for (var i = 0; i < yk.groups.length; i++) if (String(yk.groups[i].id) === String(ykGroupId)) return yk.groups[i];
    return null;
  }
  function ykKids(g) { return g.kids.slice().sort(function (x, y) { return x.localeCompare(y, "tr"); }); }
  function ykDayMap(gid, day) { var a = yk.att[gid]; return (a && a[day]) || {}; }
  function ykVal(gid, day, name) { var v = ykDayMap(gid, day)[name]; return v === 2 ? 2 : (v === 1 ? 1 : 0); }
  function ykSetVal(gid, day, name, v) {
    var a = yk.att[gid] || (yk.att[gid] = {});
    var m = a[day] || (a[day] = {});
    if (v) m[name] = v; else delete m[name];
    if (!Object.keys(m).length) delete a[day];
    saveYk();
  }
  // O günün özeti: kaç öğrenci geldi ve kaç antrenman yapıldı (en çok gelinen sayı).
  function ykDayCounts(g, day) {
    var m = ykDayMap(g.id, day), kids = 0, s = 0;
    g.kids.forEach(function (n) { var v = m[n] === 2 ? 2 : (m[n] === 1 ? 1 : 0); if (v) { kids++; if (v > s) s = v; } });
    return { kids: kids, sessions: s };
  }
  function ykMonthDays(ym) {
    var p = ym.split("-"), y = +p[0], mo = +p[1] - 1, n = new Date(y, mo + 1, 0).getDate(), out = [];
    for (var d = 1; d <= n; d++) out.push(ymd(new Date(y, mo, d)));
    return out;
  }
  function ykMonthSessions(g, ym) {
    var a = yk.att[g.id] || {}, tot = 0;
    Object.keys(a).forEach(function (day) {
      if (day.slice(0, 7) !== ym) return;
      var s = 0, m = a[day];
      Object.keys(m).forEach(function (n) { if (m[n] > s) s = m[n]; });
      tot += Math.min(2, s);
    });
    return tot;
  }
  // Öğrencinin o ayki kayıtları: [[gün, 1|2], ...]
  function ykKidMonth(g, name, ym) {
    var a = yk.att[g.id] || {};
    return Object.keys(a).filter(function (d) { return d.slice(0, 7) === ym && a[d][name]; }).sort()
      .map(function (d) { return [d, a[d][name] === 2 ? 2 : 1]; });
  }
  function ykHubBadge() {
    if (!yk.groups.length) return "";
    var today = todayStr(), came = 0;
    yk.groups.forEach(function (g) { came += ykDayCounts(g, today).kids; });
    return came ? escapeHtml(t("ykTodayN", { n: came, t: yk.groups.reduce(function (s, g) { return s + g.kids.length; }, 0) })) : escapeHtml(String(yk.groups.length));
  }
  function ykLongDay(day) {
    var s;
    try { s = dayFromStr(day).toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" }); } catch (e) { s = day; }
    var off = dayOffset(day);
    return (off === 0 ? t("evToday") + " · " : off === -1 ? t("evYesterday") + " · " : "") + s;
  }
  function ykMonthName(ym) {
    try { return dayFromStr(ym + "-01").toLocaleDateString(locale(), { month: "long", year: "numeric" }); } catch (e) { return ym; }
  }
  function ykShortDay(day) {
    try { return dayFromStr(day).toLocaleDateString(locale(), { day: "numeric", month: "long", weekday: "long" }); } catch (e) { return day; }
  }
  function ykShiftMonth(n) {
    var d = dayFromStr(ykMonth + "-01"); d.setMonth(d.getMonth() + n); ykMonth = ymd(d).slice(0, 7);
  }

  // ================= Hesap ve bulut eşitleme =================
  // Antrenör e-posta + şifreyle hesap açar (Firebase Auth, REST). Hesap, canlı yayın için zaten
  // açılmış anonim hesaba bağlanır; böylece uid değişmez ve yayınlar bozulmaz.
  // Veri: /users/{uid}/data/{anahtar} = { v: localStorage'daki JSON metni, t: değişiklik zamanı }.
  // Her anahtar için "son yazan kazanır". İlk girişte telefondaki kayıtlarla buluttakiler birleştirilir.
  function loadCloudMeta() {
    try {
      var m = JSON.parse(localStorage.getItem(CLOUD_META_KEY) || "null");
      if (m && typeof m === "object") { m.t = m.t || {}; m.dirty = m.dirty || {}; return m; }
    } catch (e) {}
    return { owner: null, t: {}, dirty: {}, last: 0 };
  }
  var cloudMeta = loadCloudMeta();
  function saveCloudMeta() { rawSet(CLOUD_META_KEY, JSON.stringify(cloudMeta)); }
  function cloudUser() { var a = loadAuth(); return a && a.email && a.refreshToken ? a : null; }
  var cloudStatus = null;            // null | "syncing" | "ok" | "offline"
  var cloudPushTimer = null, cloudBusy = false, cloudAgain = false, cloudLastPull = 0;

  cloudHook = function (k) {
    cloudMeta.t[k] = Date.now();
    cloudMeta.dirty[k] = 1;
    saveCloudMeta();
    if (cloudUser()) scheduleCloudPush();
  };
  function scheduleCloudPush(delay) {
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(cloudPush, delay === undefined ? 1500 : delay);
  }
  function userUrl(uid, path, tok) { return FB.db + "/users/" + uid + (path ? "/" + path : "") + ".json?auth=" + encodeURIComponent(tok); }

  function cloudPush() {
    if (!cloudUser()) return Promise.resolve();
    var keys = Object.keys(cloudMeta.dirty).filter(function (k) { return CLOUD_KEYS.indexOf(k) !== -1; });
    if (!keys.length) { if (cloudStatus === "syncing") setCloudStatus("ok"); return Promise.resolve(); }
    if (cloudBusy) { cloudAgain = true; return Promise.resolve(); }
    cloudBusy = true; setCloudStatus("syncing");
    var body = {};
    keys.forEach(function (k) {
      var v = null; try { v = localStorage.getItem(k); } catch (e) {}
      body[k] = { v: v, t: cloudMeta.t[k] || Date.now() };
    });
    return getIdToken().then(function (a) {
      return fetch(userUrl(a.uid, "data", a.idToken), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
        .then(function (r) { if (!r.ok) throw new Error("push " + r.status); });
    }).then(function () {
      keys.forEach(function (k) { if (cloudMeta.t[k] === body[k].t) delete cloudMeta.dirty[k]; });
      cloudMeta.last = Date.now(); saveCloudMeta();
      cloudBusy = false; setCloudStatus("ok");
      if (cloudAgain || Object.keys(cloudMeta.dirty).length) { cloudAgain = false; scheduleCloudPush(300); }
    }, function () {
      cloudBusy = false; cloudAgain = false; setCloudStatus("offline");
      scheduleCloudPush(20000);
    });
  }

  // İlk girişte telefondaki kayıtlarla buluttakileri birleştirir (hiçbir kayıt kaybolmasın).
  function cloudMerge(k, localStr, remoteStr) {
    var L, R;
    try { L = JSON.parse(localStr); R = JSON.parse(remoteStr); } catch (e) { return remoteStr; }
    var out, seen = {};
    function union(arr, keyFn) {
      var res = [];
      arr.forEach(function (x) { var id = x ? keyFn(x) : ""; if (!id || seen[id]) return; seen[id] = 1; res.push(x); });
      return res;
    }
    if (k === "courtside-archive-v1" && Array.isArray(L) && Array.isArray(R)) {
      out = union(R.concat(L), function (x) { return String(x.archiveId); })
        .sort(function (x, y) { return (y.startedAt || 0) - (x.startedAt || 0); }).slice(0, ARCHIVE_MAX);
    } else if (k === "courtside-players-v1" && Array.isArray(L) && Array.isArray(R)) {
      out = union(R.concat(L), function (p) { return nameKey(p.name); })
        .sort(function (x, y) { return String(x.name).localeCompare(String(y.name), "tr"); });
    } else if (k === "courtside-cal-fav-v1" && Array.isArray(L) && Array.isArray(R)) {
      out = union(R.concat(L), function (x) { return String(x); });
    } else if (k === "courtside-tournaments-v1" && Array.isArray(L) && Array.isArray(R)) {
      out = union(R.concat(L), function (x) { return String(x.id); });
    } else if (k === "courtside-attendance-v1" && L && R) {
      out = { groups: union((R.groups || []).concat(L.groups || []), function (g) { return String(g.id); }), att: {} };
      [R.att || {}, L.att || {}].forEach(function (src) {
        Object.keys(src).forEach(function (gid) {
          var dst = out.att[gid] || (out.att[gid] = {});
          Object.keys(src[gid] || {}).forEach(function (day) {
            var dd = dst[day] || (dst[day] = {});
            Object.keys(src[gid][day] || {}).forEach(function (n) { dd[n] = Math.max(dd[n] || 0, src[gid][day][n] || 0); });
          });
        });
      });
    } else {
      // Süren maç: telefondakinde puan varsa o kalır, yoksa buluttaki gelir.
      out = (L && L.log && L.log.length) ? L : R;
    }
    return JSON.stringify(out);
  }

  // Buluttakini çeker. Dönen söz: telefondaki veri değişti mi (değiştiyse sayfa yeniden yüklenir).
  function cloudPull() {
    if (!cloudUser()) return Promise.resolve(false);
    setCloudStatus("syncing");
    return getIdToken().then(function (a) {
      return fetch(userUrl(a.uid, "data", a.idToken)).then(function (r) {
        if (!r.ok) throw new Error("pull " + r.status);
        return r.json();
      }).then(function (remote) {
        remote = remote || {};
        // merge: bu telefon ilk kez bir hesaba bağlanıyor. replace: telefonda başka hesabın kayıtları var.

      var n = document.getElementById("acNameInput"); if (n) n.focus();
    };
    if ((el = document.getElementById("acNameCancel"))) el.onclick = function () { acctNameEdit = false; render(); };
    var saveName = function () {
      var name = cleanPersonName(val("acNameInput"));
      if (!name) { showErr(t("acNeedName")); return; }
      acctBusy = true; render();
      cloudSetName(name).then(function () { acctBusy = false; acctNameEdit = false; acctErr = false; acctMsg = ""; render(); }, fail);
    };
    if ((el = document.getElementById("acNameSave"))) el.onclick = saveName;
    if ((el = document.getElementById("acNameInput"))) el.onkeydown = function (e) { if (e.key === "Enter") saveName(); };
    if ((el = document.getElementById("acSync"))) el.onclick = function () {
      acctBusy = true; acctMsg = ""; render();
      cloudPull().then(function (changed) {
        if (changed) { cloudReload(); return; }
        acctBusy = false;
        acctErr = cloudStatus === "offline";
        acctMsg = acctErr ? t("errNet") : t("acSynced");
        render();
      });
    };
    if ((el = document.getElementById("acLogout"))) el.onclick = function () { cloudSignOut(); clubInfo = undefined; clubMsg = ""; clubLeaveArm = false; acctMode = "login"; acctDelArm = false; acctMsg = ""; render(); };
    bindClubSection();
    if ((el = document.getElementById("acDelete"))) el.onclick = function () {
      if (!acctDelArm) { acctDelArm = true; render(); return; }
      acctBusy = true; render();
      cloudDeleteAccount().then(function () {
        acctBusy = false; acctDelArm = false; acctErr = false; acctMsg = t("acDeleted"); acctMode = "login"; render();
      }, function (err) { acctDelArm = false; fail(err); });
    };
  }

  // Açılışta: yayındaki turnuvalar kaldığı yerden devam etsin.
  if (!extractLiveCode(location.hash)) tournaments.forEach(function (ev) { if (ev.live) scheduleEventPush(ev); });

  applyDocLang();
  var launchLiveCode = extractLiveCode(location.hash);
  if (launchLiveCode) {
    startLiveViewer(launchLiveCode);
  } else {
    showIntro();
    checkLaunchLink();
    // Uygulama kapanıp açıldıysa süren yayın kaldığı yerden devam etsin.
    if (state.live && !state.setup) scheduleLivePush();
  }
  render();
  // Hesapla giriş yapılmışsa: açılışta buluttakini al, uygulamaya dönülünce ve internet gelince tekrar eşitle.
  if (!launchLiveCode) {
    if (cloudUser()) setTimeout(cloudSync, 300);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && cloudUser() && Date.now() - cloudLastPull > 30000) cloudSync();
      else if (document.visibilityState === "hidden" && cloudUser()) cloudPush();
    });
    window.addEventListener("online", function () { if (cloudUser()) cloudPush(); });
  }
})();
</script>
<script>
  var isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if ("serviceWorker" in navigator && !isNativeApp) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
